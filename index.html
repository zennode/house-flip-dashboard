:root{--bg:#0f1117;--card-bg:#1a1d27;--card-border:#2a2d37;--text:#e1e4ea;--text-muted:#8b8f9a;--accent:#4f8cff;--green:#34d399;--yellow:#fbbf24;--red:#f87171;--blue:#60a5fa;--purple:#a78bfa;--orange:#fb923c}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5}
.header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#1a1d27 0%,#252836 100%);border-bottom:1px solid var(--card-border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{background:rgba(79,140,255,0.1);border:1px solid rgba(79,140,255,0.2);border-radius:8px;padding:6px 14px;font-size:0.85rem}
.stat strong{color:var(--accent)}
.last-updated{font-size:0.75rem;color:var(--text-muted);width:100%;text-align:right}
.container{max-width:1400px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:20px;transition:transform 0.2s}
.card:hover{transform:translateY(-2px)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:8px}
.card-header h2{font-size:1rem;font-weight:600;flex:1}
.phase-badge{font-size:0.7rem;padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
.phase-closed{background:rgba(52,211,153,0.15);color:var(--green);border:1px solid rgba(52,211,153,0.3)}
.phase-closing{background:rgba(251,191,36,0.15);color:var(--yellow);border:1px solid rgba(251,191,36,0.3)}
.phase-rehab{background:rgba(251,146,60,0.15);color:var(--orange);border:1px solid rgba(251,146,60,0.3)}
.phase-financing{background:rgba(96,165,250,0.15);color:var(--blue);border:1px solid rgba(96,165,250,0.3)}
.phase-inspections{background:rgba(167,139,250,0.15);color:var(--purple);border:1px solid rgba(167,139,250,0.3)}
.phase-title{background:rgba(96,165,250,0.15);color:var(--blue);border:1px solid rgba(96,165,250,0.3)}
.phase-contract{background:rgba(251,191,36,0.15);color:var(--yellow);border:1px solid rgba(251,191,36,0.3)}
.phase-prospecting{background:rgba(139,143,154,0.15);color:var(--text-muted);border:1px solid rgba(139,143,154,0.3)}
.source-badges{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.source-badge{font-size:0.65rem;padding:2px 8px;border-radius:10px;background:rgba(79,140,255,0.1);color:var(--accent);border:1px solid rgba(79,140,255,0.2)}
.countdown{font-size:0.8rem;color:var(--yellow);margin-bottom:12px;padding:6px 10px;background:rgba(251,191,36,0.08);border-radius:6px;text-align:center}
.countdown.overdue{color:var(--red);background:rgba(248,113,113,0.08)}
.timeline{display:flex;align-items:center;gap:0;margin:14px 0;justify-content:space-between;position:relative}
.timeline::before{content:'';position:absolute;top:50%;left:8px;right:8px;height:2px;background:var(--card-border);transform:translateY(-50%);z-index:0}
.dot{width:16px;height:16px;border-radius:50%;z-index:1;position:relative;flex-shrink:0}
.dot.completed{background:var(--green)}
.dot.active{background:var(--blue);box-shadow:0 0 8px rgba(96,165,250,0.5);animation:pulse 2s infinite}
.dot.pending{background:var(--card-border)}
@keyframes pulse{0%,100%{box-shadow:0 0 4px rgba(96,165,250,0.3)}50%{box-shadow:0 0 12px rgba(96,165,250,0.6)}}
.timeline-labels{display:flex;justify-content:space-between;font-size:0.55rem;color:var(--text-muted);margin-bottom:14px;padding:0 2px}
.section{margin-top:12px}
.section-title{font-size:0.75rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;border-bottom:1px solid var(--card-border);padding-bottom:4px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-item{font-size:0.8rem}
.info-item .label{color:var(--text-muted);font-size:0.7rem}
.contacts-list,.updates-list,.actions-list{list-style:none;font-size:0.8rem}
.contacts-list li,.updates-list li,.actions-list li{padding:3px 0;border-bottom:1px solid rgba(42,45,55,0.5)}
.contacts-list li:last-child,.updates-list li:last-child,.actions-list li:last-child{border-bottom:none}
.update-date{color:var(--accent);font-size:0.7rem;margin-right:6px}
.update-source{font-size:0.65rem;padding:1px 6px;border-radius:8px;background:rgba(79,140,255,0.1);color:var(--text-muted);margin-left:4px}
.action-item{color:var(--yellow);font-size:0.8rem}
.contact-role{color:var(--text-muted);font-size:0.7rem}
.no-data{color:var(--text-muted);font-size:0.8rem;font-style:italic}
@media(max-width:500px){.grid{grid-template-columns:1fr}.header h1{font-size:1.1rem}}
</style>

const MILESTONES = ["Offer Made","Under Contract","Title & Escrow","Inspections","Appraisal","Financing","Repairs / Rehab","Final Walkthrough","Closing","Closed"];
const MILESTONE_SHORT = ["Offer","Contract","Title","Inspect","Appraise","Finance","Rehab","Walk","Closing","Closed"];

function getPhaseClass(m) {
  if (m === "Closed") return "phase-closed";
  if (m === "Closing") return "phase-closing";
  if (m === "Repairs / Rehab") return "phase-rehab";
  if (m === "Financing") return "phase-financing";
  if (m === "Inspections") return "phase-inspections";
  if (m === "Title & Escrow") return "phase-title";
  if (m === "Under Contract") return "phase-contract";
  if (m === "Prospecting") return "phase-prospecting";
  return "phase-financing";
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const parts = dateStr.split('/');
  const d = new Date(parts[2], parts[0]-1, parts[1]);
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.ceil((d - now) / (1000*60*60*24));
}

function formatFinancials(f) {
  if (!f || Object.keys(f).length === 0) return '<span class="no-data">No financial data</span>';
  let html = '<div class="info-grid">';
  const labels = {purchase_price:"Purchase Price",arv:"ARV",arv_estimate:"Est. ARV",arv_2br:"ARV (2BR)",arv_3br:"ARV (3BR)",repair_budget:"Repair Budget",closing_costs:"Closing Costs",loan_repayment_gsb:"Loan Repay (GSB)",contractor_payments:"Contractor Payments",construction_advance:"Construction Advance",points:"Points",rate:"Rate",term:"Term",lender_fees:"Lender Fees"};
  for (const [k,v] of Object.entries(f)) {
    const label = labels[k] || k;
    const val = typeof v === 'string' && /^\d+$/.test(v) ? '$'+Number(v).toLocaleString() : v;
    html += `<div class="info-item"><div class="label">${label}</div>${val}</div>`;
  }
  return html + '</div>';
}

function renderCard(p) {
  const mi = MILESTONES.indexOf(p.current_milestone);
  const days = daysUntil(p.closing_date);
  let countdown = '';
  if (p.closing_date) {
    if (days !== null) {
      if (days > 0) countdown = `<div class="countdown">Closing in ${days} day${days!==1?'s':''} (${p.closing_date})</div>`;
      else if (days === 0) countdown = `<div class="countdown">CLOSING TODAY (${p.closing_date})</div>`;
      else countdown = `<div class="countdown overdue">Closing was ${Math.abs(days)} day${Math.abs(days)!==1?'s':''} ago (${p.closing_date})</div>`;
    }
  }
  let dots = MILESTONES.map((m, i) => {
    let cls = 'pending';
    if (mi >= 0) {
      if (i < mi) cls = 'completed';
      else if (i === mi) cls = 'active';
    }
    return `<div class="dot ${cls}" title="${m}"></div>`;
  }).join('');
  let labels = MILESTONE_SHORT.map(s => `<span>${s}</span>`).join('');
  let sources = p.sources.map(s => `<span class="source-badge">${s}</span>`).join('');
  let contacts = p.contacts.length ? '<ul class="contacts-list">' + p.contacts.map(c => `<li>${c.name} <span class="contact-role">${c.role}</span></li>`).join('') + '</ul>' : '<span class="no-data">No contacts</span>';
  let updates = p.recent_updates.length ? '<ul class="updates-list">' + p.recent_updates.slice(0,3).map(u => `<li>${u.date ? '<span class="update-date">'+u.date+'</span>' : ''}${u.subject}<span class="update-source">${u.source}</span></li>`).join('') + '</ul>' : '<span class="no-data">No recent updates</span>';
  let actions = p.action_items.length ? '<ul class="actions-list">' + p.action_items.map(a => `<li class="action-item">${a}</li>`).join('') + '</ul>' : '<span class="no-data">No action items</span>';

  return `<div class="card">
    <div class="card-header"><h2>${p.address}</h2><span class="phase-badge ${getPhaseClass(p.current_milestone)}">${p.current_milestone}</span></div>
    <div class="source-badges">${sources}</div>
    ${countdown}
    <div class="timeline">${dots}</div>
    <div class="timeline-labels">${labels}</div>
    <div class="section"><div class="section-title">Financials</div>${formatFinancials(p.financials)}</div>
    <div class="section"><div class="section-title">Key Contacts</div>${contacts}</div>
    <div class="section"><div class="section-title">Recent Updates</div>${updates}</div>
    <div class="section"><div class="section-title">Action Items</div>${actions}</div>
  </div>`;
}

function render() {
  const props = DATA.properties;
  document.getElementById('last-updated').textContent = new Date(DATA.last_updated).toLocaleString();
  const active = props.filter(p => p.current_milestone !== 'Closed' && p.current_milestone !== 'Prospecting');
  document.getElementById('stat-active').textContent = active.length;
  document.getElementById('stat-closing').textContent = props.filter(p => p.current_milestone === 'Closing').length;
  document.getElementById('stat-rehab').textContent = props.filter(p => p.current_milestone === 'Repairs / Rehab').length;
  document.getElementById('stat-closed').textContent = props.filter(p => p.current_milestone === 'Closed').length;
  // Sort: active first (by milestone progress desc), then prospecting, then closed
  const order = {"Closing":0,"Final Walkthrough":1,"Financing":2,"Inspections":3,"Appraisal":4,"Title & Escrow":5,"Repairs / Rehab":6,"Under Contract":7,"Offer Made":8,"Prospecting":9,"Closed":10};
  props.sort((a,b) => (order[a.current_milestone]||99) - (order[b.current_milestone]||99));
  document.getElementById('cards').innerHTML = props.map(renderCard).join('');
}
render();
</script>
</body>
</html>
