<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Flip Closing Coordinator</title>
<style>
  :root{
    --bg:#0f1117; --card-bg:#1a1d27; --card-bg2:#20232f;
    --text:#e6e8ee; --muted:#8b90a0; --line:#2a2e3c;
    --green:#3ecf8e; --blue:#4c8dff; --gray:#454a5a;
    --amber:#f5a623; --red:#ff5d5d; --accent:#7c5cff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45;
  }
  header.sticky{
    position:sticky; top:0; z-index:50;
    background:rgba(15,17,23,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:16px 22px;
  }
  .hwrap{display:flex; flex-wrap:wrap; align-items:center; gap:18px; max-width:1280px; margin:0 auto}
  h1{font-size:20px; margin:0; letter-spacing:.2px}
  .updated{font-size:12px; color:var(--muted)}
  .stats{display:flex; gap:14px; margin-left:auto; flex-wrap:wrap}
  .stat{background:var(--card-bg); border:1px solid var(--line); border-radius:10px; padding:8px 14px; min-width:96px; text-align:center}
  .stat .num{font-size:22px; font-weight:700}
  .stat .lbl{font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted)}
  .stat.closing .num{color:var(--amber)}
  .stat.rehab .num{color:var(--blue)}
  .stat.active .num{color:var(--green)}
  main{max-width:1280px; margin:0 auto; padding:22px}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:18px}
  .card{background:var(--card-bg); border:1px solid var(--line); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:14px}
  .card.closed{opacity:.72}
  .ctop{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .addr{font-size:16px; font-weight:700}
  .loc{font-size:12px; color:var(--muted)}
  .badges{display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end}
  .badge{font-size:10px; font-weight:600; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.5px; white-space:nowrap}
  .phase{background:rgba(124,92,255,.18); color:#b9a8ff; border:1px solid rgba(124,92,255,.4)}
  .phase.closing{background:rgba(245,166,35,.15); color:var(--amber); border-color:rgba(245,166,35,.4)}
  .phase.closed{background:rgba(62,207,142,.15); color:var(--green); border-color:rgba(62,207,142,.4)}
  .src{background:var(--card-bg2); color:var(--muted); border:1px solid var(--line)}
  .countdown{font-size:12px; padding:8px 12px; border-radius:10px; background:var(--card-bg2); border:1px solid var(--line)}
  .countdown b{color:var(--amber)}
  .countdown.overdue b{color:var(--red)}
  .countdown.soon b{color:var(--amber)}
  /* timeline */
  .timeline{display:flex; align-items:flex-start; gap:0; margin:4px 0}
  .step{flex:1; display:flex; flex-direction:column; align-items:center; position:relative; min-width:0}
  .step .dot{width:13px; height:13px; border-radius:50%; background:var(--gray); border:2px solid var(--gray); z-index:2}
  .step.done .dot{background:var(--green); border-color:var(--green)}
  .step.active .dot{background:var(--blue); border-color:var(--blue); box-shadow:0 0 0 4px rgba(76,141,255,.22)}
  .step .line{position:absolute; top:6px; left:50%; width:100%; height:2px; background:var(--gray); z-index:1}
  .step.done .line{background:var(--green)}
  .step:last-child .line{display:none}
  .step .lbl{font-size:8.5px; color:var(--muted); margin-top:6px; text-align:center; line-height:1.15}
  .step.active .lbl{color:var(--blue); font-weight:700}
  .step.done .lbl{color:var(--text)}
  /* sections */
  .sections{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .sec{background:var(--card-bg2); border:1px solid var(--line); border-radius:10px; padding:11px 12px}
  .sec.full{grid-column:1 / -1}
  .sec h3{margin:0 0 7px; font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted)}
  .kv{display:flex; justify-content:space-between; font-size:12.5px; padding:2px 0}
  .kv .k{color:var(--muted)}
  .kv .v{font-weight:600; text-align:right}
  .contact{font-size:12.5px; padding:2px 0}
  .contact .role{color:var(--muted); font-size:11px}
  ul.items{margin:0; padding-left:16px; font-size:12.5px}
  ul.items li{margin:3px 0}
  ul.items li.urgent{color:var(--red); font-weight:600}
  .upd{font-size:12px; padding:5px 0; border-bottom:1px solid var(--line)}
  .upd:last-child{border-bottom:none}
  .upd .d{color:var(--muted); font-size:10.5px}
  .empty{color:var(--muted); font-size:12px; font-style:italic}
  .loading,.error{text-align:center; padding:60px 20px; color:var(--muted)}
  .error{color:var(--red)}
  @media(max-width:560px){
    .sections{grid-template-columns:1fr}
    .stats{width:100%; margin-left:0}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header class="sticky">
  <div class="hwrap">
    <div>
      <h1>🏠 House Flip Closing Coordinator</h1>
      <div class="updated" id="updated">Loading…</div>
    </div>
    <div class="stats">
      <div class="stat active"><div class="num" id="s-active">–</div><div class="lbl">Active</div></div>
      <div class="stat closing"><div class="num" id="s-closing">–</div><div class="lbl">At Closing</div></div>
      <div class="stat rehab"><div class="num" id="s-rehab">–</div><div class="lbl">In Rehab</div></div>
    </div>
  </div>
</header>
<main>
  <div id="content" class="loading">Loading properties…</div>
</main>
<script>
const STAGES = ["Prospecting","Acquired","Demo/Rehab","Listed","Under Contract","Closing","Closed"];

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function money(n){return (typeof n==="number")?"$"+n.toLocaleString("en-US"):esc(n);}
function fmtDate(s){if(!s)return "";const d=new Date(s+"T00:00:00");return isNaN(d)?esc(s):d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}

function daysTo(dateStr){
  const today=new Date(); today.setHours(0,0,0,0);
  const d=new Date(dateStr+"T00:00:00"); if(isNaN(d))return null;
  return Math.round((d-today)/86400000);
}

function timeline(p){
  const stages = (p.milestones && p.milestones.length) ? p.milestones : STAGES;
  const done = new Set(p.completed_milestones||[]);
  const cur = p.current_milestone;
  return '<div class="timeline">'+stages.map(st=>{
    let cls="step";
    if(st===cur) cls+=" active";
    else if(done.has(st)) cls+=" done";
    return '<div class="'+cls+'"><div class="line"></div><div class="dot"></div><div class="lbl">'+esc(st)+'</div></div>';
  }).join("")+'</div>';
}

function countdown(p){
  const cd = p.closing_date || (p.important_dates && p.important_dates.closing);
  if(!cd) return "";
  const n = daysTo(cd);
  if(n===null) return "";
  let cls="countdown", txt;
  if(n<0){cls+=" overdue"; txt="<b>"+Math.abs(n)+" day"+(Math.abs(n)===1?"":"s")+" overdue</b> — closing was "+fmtDate(cd);}
  else if(n===0){cls+=" soon"; txt="<b>Closing today</b> — "+fmtDate(cd);}
  else{if(n<=7)cls+=" soon"; txt="<b>"+n+" day"+(n===1?"":"s")+"</b> to closing — "+fmtDate(cd);}
  return '<div class="'+cls+'">'+txt+'</div>';
}

function financials(f){
  if(!f) return '<div class="empty">No financials</div>';
  const rows=[["Purchase",f.purchase_price],["Rehab",f.rehab_cost],["Listing",f.listing_price],["ARV",f.arv],["Closing Costs",f.closing_costs],["Repair Budget",f.repair_budget]];
  const html=rows.filter(r=>r[1]!=null).map(r=>'<div class="kv"><span class="k">'+r[0]+'</span><span class="v">'+money(r[1])+'</span></div>').join("");
  return html||'<div class="empty">No financials</div>';
}

function contacts(cs){
  if(!cs||!cs.length) return '<div class="empty">None listed</div>';
  return cs.map(c=>'<div class="contact"><b>'+esc(c.name)+'</b><div class="role">'+esc(c.role||"")+'</div></div>').join("");
}

function dates(p){
  const d = p.important_dates || {};
  const entries = Object.entries(d);
  if(p.closing_date && !d.closing) entries.unshift(["closing",p.closing_date]);
  if(!entries.length) return '<div class="empty">None recorded</div>';
  return entries.map(([k,v])=>'<div class="kv"><span class="k">'+esc(k.replace(/_/g," ").replace(/\b\w/g,m=>m.toUpperCase()))+'</span><span class="v">'+fmtDate(v)+'</span></div>').join("");
}

function actions(a){
  if(!a||!a.length) return '<div class="empty">No action items</div>';
  return '<ul class="items">'+a.map(it=>{
    const u=/urgent|overdue|asap/i.test(it);
    return '<li class="'+(u?"urgent":"")+'">'+esc(it)+'</li>';
  }).join("")+'</ul>';
}

function updates(u){
  if(!u||!u.length) return '<div class="empty">No recent updates</div>';
  return u.slice().reverse().slice(0,6).map(x=>'<div class="upd"><div class="d">'+fmtDate(x.date)+'</div>'+esc(x.note)+'</div>').join("");
}

function sourceBadges(p){
  let srcs=[];
  if(Array.isArray(p.source)) srcs=p.source;
  else if(p.source) srcs=[p.source];
  if(p.auto_detected) srcs.push("Auto-detected");
  return srcs.map(s=>'<span class="badge src">'+esc(s)+'</span>').join("");
}

function card(p){
  const closedCls = p.status==="closed" || p.current_milestone==="Closed" ? " closed" : "";
  let phaseCls="badge phase";
  if(p.current_milestone==="Closing") phaseCls+=" closing";
  if(p.current_milestone==="Closed") phaseCls+=" closed";
  return '<div class="card'+closedCls+'">'
    + '<div class="ctop"><div><div class="addr">'+esc(p.address)+'</div><div class="loc">'+esc([p.city,p.state].filter(Boolean).join(", "))+'</div></div>'
    + '<div class="badges"><span class="'+phaseCls+'">'+esc(p.current_milestone||"—")+'</span>'+sourceBadges(p)+'</div></div>'
    + countdown(p)
    + timeline(p)
    + '<div class="sections">'
    +   '<div class="sec"><h3>Financials</h3>'+financials(p.financials)+'</div>'
    +   '<div class="sec"><h3>Key Contacts</h3>'+contacts(p.contacts)+'</div>'
    +   '<div class="sec"><h3>Important Dates</h3>'+dates(p)+'</div>'
    +   '<div class="sec"><h3>Action Items</h3>'+actions(p.action_items)+'</div>'
    +   '<div class="sec full"><h3>Recent Updates</h3>'+updates(p.recent_updates)+'</div>'
    + '</div>'
    + '</div>';
}

function render(data){
  const props = data.properties||[];
  const active = props.filter(p=>p.status==="active").length;
  const closing = props.filter(p=>p.current_milestone==="Closing").length;
  const rehab = props.filter(p=>p.current_milestone==="Demo/Rehab").length;
  document.getElementById("s-active").textContent=active;
  document.getElementById("s-closing").textContent=closing;
  document.getElementById("s-rehab").textContent=rehab;
  let ts=data.last_updated;
  try{ts=new Date(data.last_updated).toLocaleString("en-US",{dateStyle:"medium",timeStyle:"short"});}catch(e){}
  document.getElementById("updated").textContent="Last updated: "+ts;

  const order={Closing:0,"Under Contract":1,Listed:2,"Demo/Rehab":3,Acquired:4,Prospecting:5,Closed:6};
  const sorted=props.slice().sort((a,b)=>(order[a.current_milestone]??9)-(order[b.current_milestone]??9));
  document.getElementById("content").className="grid";
  document.getElementById("content").innerHTML=sorted.map(card).join("");
}

fetch("properties_data.json?cb="+Date.now())
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
  .then(render)
  .catch(e=>{document.getElementById("content").className="error";document.getElementById("content").textContent="Failed to load properties_data.json: "+e.message;});
</script>
</body>
</html>
