<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Flip Closing Coordinator</title>
<style>
  :root{
    --bg:#0f1117; --card-bg:#1a1d27; --border:#272b38; --muted:#8a93a6;
    --text:#e6e9f0; --accent:#4f8cff; --green:#2ecc71; --blue:#4f8cff;
    --gray:#3a3f4d; --amber:#f5a623; --red:#ff5c5c; --chip:#222634;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.5;}
  header{position:sticky;top:0;z-index:10;background:rgba(15,17,23,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:16px 22px;}
  .h-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;justify-content:space-between}
  h1{font-size:19px;margin:0;font-weight:650;letter-spacing:.2px}
  .updated{color:var(--muted);font-size:12px}
  .stats{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
  .stat{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;
    padding:8px 16px;min-width:120px}
  .stat .num{font-size:22px;font-weight:700}
  .stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  main{padding:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px;max-width:1600px;margin:0 auto}
  .card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .addr{font-size:16px;font-weight:650;margin:0}
  .city{color:var(--muted);font-size:12px;margin-top:2px}
  .badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .badge{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--chip);border:1px solid var(--border);white-space:nowrap}
  .badge.phase{background:rgba(79,140,255,.16);border-color:rgba(79,140,255,.4);color:#a9c6ff;font-weight:600}
  .badge.src{color:var(--muted)}
  .countdown{display:inline-flex;align-items:center;gap:8px;font-size:13px;background:rgba(245,166,35,.12);
    border:1px solid rgba(245,166,35,.35);color:var(--amber);padding:6px 12px;border-radius:8px;font-weight:600}
  .countdown.soon{background:rgba(255,92,92,.12);border-color:rgba(255,92,92,.4);color:var(--red)}
  .countdown.done{background:rgba(46,204,113,.12);border-color:rgba(46,204,113,.4);color:var(--green)}
  .timeline{display:flex;align-items:flex-start;gap:2px;overflow-x:auto;padding:4px 0 2px}
  .tl-step{display:flex;flex-direction:column;align-items:center;flex:1;min-width:54px;text-align:center}
  .tl-row{display:flex;align-items:center;width:100%}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--gray);border:2px solid var(--gray);flex:none;margin:0 auto}
  .dot.done{background:var(--green);border-color:var(--green)}
  .dot.active{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 4px rgba(79,140,255,.2)}
  .line{height:2px;flex:1;background:var(--gray)}
  .line.done{background:var(--green)}
  .tl-lbl{font-size:9.5px;color:var(--muted);margin-top:6px;line-height:1.15}
  .tl-step.active .tl-lbl{color:#a9c6ff;font-weight:600}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .sec h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .sec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
  .sec li{font-size:12.5px}
  .kv{display:flex;justify-content:space-between;gap:8px}
  .kv .k{color:var(--muted)}
  .contact .nm{font-weight:600}
  .contact .rl{color:var(--muted);font-size:11px}
  .actions li{background:rgba(245,166,35,.08);border-left:2px solid var(--amber);padding:4px 8px;border-radius:4px}
  .updates li{border-left:2px solid var(--border);padding:2px 0 2px 10px}
  .updates .u-date{color:var(--accent);font-size:11px;font-weight:600}
  .full{grid-column:1 / -1}
  .empty{color:var(--muted);font-size:12px;font-style:italic}
  footer{text-align:center;color:var(--muted);font-size:11px;padding:24px}
  a{color:var(--accent)}
  @media(max-width:520px){main{grid-template-columns:1fr;padding:14px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="h-top">
    <div>
      <h1>🏠 House Flip Closing Coordinator</h1>
      <div class="updated" id="updated">Loading…</div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</header>
<main id="main"><div class="empty" style="padding:40px">Loading properties…</div></main>
<footer id="footer"></footer>
<script>
const MS_ORDER_FALLBACK = ["Prospecting","Acquired","Demo/Rehab","Listed","Under Contract","Closing","Closed"];
const REHAB_SET = new Set(["Demo/Rehab","Repairs / Rehab","Rehab","Repairs"]);
const CLOSING_SET = new Set(["Closing"]);

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function money(n){return "$"+Number(n).toLocaleString("en-US");}
function fmtKey(k){return k.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());}

function daysTo(dateStr){
  if(!dateStr) return null;
  const d=new Date(dateStr+"T00:00:00");
  const now=new Date(); now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}

function countdownHtml(p){
  if(!p.closing_date) return "";
  const dd = daysTo(p.closing_date);
  const dateLabel = new Date(p.closing_date+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
  let cls="countdown", txt;
  if(p.current_milestone==="Closed" || dd<0){cls+=" done"; txt = (p.current_milestone==="Closed"?"Closed":"Closing date passed")+" · "+dateLabel;}
  else if(dd===0){cls+=" soon"; txt="Closing TODAY · "+dateLabel;}
  else if(dd<=3){cls+=" soon"; txt=dd+" day"+(dd===1?"":"s")+" to closing · "+dateLabel;}
  else {txt=dd+" days to closing · "+dateLabel;}
  return '<div class="'+cls+'">⏱ '+esc(txt)+'</div>';
}

function timeline(p){
  const order = (p.milestones&&p.milestones.length)?p.milestones:MS_ORDER_FALLBACK;
  const completed = new Set(p.completed_milestones||[]);
  const curIdx = order.indexOf(p.current_milestone);
  let html='<div class="timeline">';
  order.forEach((m,i)=>{
    const isDone = completed.has(m) || (curIdx>-1 && i<curIdx) || p.current_milestone==="Closed";
    const isActive = i===curIdx && p.current_milestone!=="Closed";
    const dotCls = isActive?"active":(isDone?"done":"");
    const leftLine = i===0?"":'<div class="line '+((isDone||isActive)?"done":"")+'"></div>';
    const rightLine = i===order.length-1?"":'<div class="line '+(isDone?"done":"")+'"></div>';
    html+='<div class="tl-step '+(isActive?"active":"")+'">'+
            '<div class="tl-row">'+leftLine+'<div class="dot '+dotCls+'"></div>'+rightLine+'</div>'+
            '<div class="tl-lbl">'+esc(m)+'</div>'+
          '</div>';
  });
  return html+'</div>';
}

function section(title, inner){return '<div class="sec"><h4>'+title+'</h4>'+inner+'</div>';}

function financials(p){
  const f=p.financials||{};
  const keys=Object.keys(f);
  if(!keys.length) return section("Financials",'<div class="empty">No financial data yet</div>');
  const rows=keys.map(k=>'<li class="kv"><span class="k">'+esc(fmtKey(k))+'</span><span>'+(typeof f[k]==="number"?money(f[k]):esc(f[k]))+'</span></li>').join("");
  return section("Financials",'<ul>'+rows+'</ul>');
}
function contacts(p){
  const c=p.contacts||[];
  if(!c.length) return section("Key Contacts",'<div class="empty">None recorded</div>');
  return section("Key Contacts",'<ul>'+c.map(x=>'<li class="contact"><span class="nm">'+esc(x.name)+'</span><br><span class="rl">'+esc(x.role||"")+'</span></li>').join("")+'</ul>');
}
function dates(p){
  const items=[];
  if(p.closing_date) items.push('<li class="kv"><span class="k">Closing</span><span>'+esc(p.closing_date)+'</span></li>');
  const idates=p.important_dates;
  if(Array.isArray(idates)){
    idates.forEach(d=>items.push('<li class="kv"><span class="k">'+esc(d.label||d.type||"Date")+'</span><span>'+esc(d.date)+'</span></li>'));
  } else if(idates && typeof idates==="object"){
    Object.entries(idates).forEach(([k,v])=>items.push('<li class="kv"><span class="k">'+esc(fmtKey(k))+'</span><span>'+esc(v)+'</span></li>'));
  }
  if(!items.length) return section("Important Dates",'<div class="empty">None set</div>');
  return section("Important Dates",'<ul>'+items.join("")+'</ul>');
}
function actions(p){
  const a=p.action_items||[];
  if(!a.length) return section("Action Items",'<div class="empty">None open</div>');
  return section("Action Items",'<ul class="actions">'+a.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>');
}
function updates(p){
  const u=p.recent_updates||[];
  if(!u.length) return section("Recent Updates",'<div class="empty">No updates</div>');
  return section("Recent Updates",'<ul class="updates">'+u.slice(0,6).map(x=>'<li><span class="u-date">'+esc(x.date||"")+(x.source?" · "+esc(x.source):"")+'</span><br>'+esc(x.note||x.subject||"")+'</li>').join("")+'</ul>');
}

function sourceBadges(p){
  const set=new Set();
  if(p.source) set.add(p.source);
  (p.recent_updates||[]).forEach(u=>{if(u.source)set.add(u.source);});
  return [...set].map(s=>'<span class="badge src">'+esc(s)+'</span>').join("");
}

function card(p){
  return '<div class="card">'+
    '<div class="card-head"><div>'+
      '<p class="addr">'+esc(p.address)+'</p>'+
      '<div class="city">'+esc([p.city,p.state].filter(Boolean).join(", "))+'</div>'+
    '</div><div class="badges">'+
      '<span class="badge phase">'+esc(p.current_milestone||"—")+'</span>'+sourceBadges(p)+
    '</div></div>'+
    countdownHtml(p)+
    timeline(p)+
    '<div class="grid">'+financials(p)+contacts(p)+dates(p)+actions(p)+'</div>'+
    '<div class="full">'+updates(p)+'</div>'+
  '</div>';
}

function render(data){
  const props=(data.properties||[]).filter(p=>p.status!=="archived");
  const active=props.filter(p=>p.status==="active");
  const atClosing=props.filter(p=>CLOSING_SET.has(p.current_milestone));
  const inRehab=props.filter(p=>REHAB_SET.has(p.current_milestone));
  document.getElementById("stats").innerHTML=
    stat(active.length,"Active Properties")+stat(atClosing.length,"At Closing")+stat(inRehab.length,"In Rehab");
  const lu=data.last_updated?new Date(data.last_updated):null;
  document.getElementById("updated").textContent="Last updated: "+(lu?lu.toLocaleString("en-US",{dateStyle:"medium",timeStyle:"short"}):"unknown");
  // sort: closing soonest first, then active, then others
  const sorted=props.slice().sort((a,b)=>{
    const da=daysTo(a.closing_date), db=daysTo(b.closing_date);
    if(da!=null&&db!=null) return da-db;
    if(da!=null) return -1; if(db!=null) return 1;
    return 0;
  });
  document.getElementById("main").innerHTML=sorted.map(card).join("");
  document.getElementById("footer").innerHTML="Showing "+props.length+" properties · Auto-generated by House Flip Closing Coordinator";
}
function stat(num,lbl){return '<div class="stat"><div class="num">'+num+'</div><div class="lbl">'+lbl+'</div></div>';}

fetch("properties_data.json?ts="+Date.now())
  .then(r=>r.json())
  .then(render)
  .catch(e=>{document.getElementById("main").innerHTML='<div class="empty" style="padding:40px">Failed to load properties_data.json: '+esc(e.message)+'</div>';});
</script>
</body>
</html>
