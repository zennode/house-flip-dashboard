<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Flip Closing Coordinator</title>
<style>
  :root{
    --bg:#0f1117; --card-bg:#1a1d27; --border:#262a36; --text:#e6e8ee;
    --muted:#8b90a0; --accent:#4f8cff; --green:#2ecc71; --blue:#4f8cff;
    --gray:#3a3f4d; --yellow:#f5a623; --red:#ff5c5c; --chip:#222634;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45;padding-bottom:60px}
  header{position:sticky;top:0;z-index:50;background:rgba(15,17,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:16px 20px}
  .hwrap{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:16px;justify-content:space-between}
  h1{font-size:20px;font-weight:700;letter-spacing:.2px}
  .updated{font-size:12px;color:var(--muted);margin-top:2px}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .stat{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:8px 14px;text-align:center;min-width:78px}
  .stat .n{font-size:20px;font-weight:700;line-height:1}
  .stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
  main{max-width:1240px;margin:0 auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
  .card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .addr{font-size:16px;font-weight:700}
  .addr .city{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
  .badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .phase{background:rgba(79,140,255,.16);color:var(--blue);border:1px solid rgba(79,140,255,.35)}
  .phase.closed{background:rgba(46,204,113,.16);color:var(--green);border-color:rgba(46,204,113,.35)}
  .phase.rehab{background:rgba(245,166,35,.16);color:var(--yellow);border-color:rgba(245,166,35,.35)}
  .srcs{display:flex;gap:6px;flex-wrap:wrap}
  .src{font-size:10px;color:var(--muted);background:var(--chip);border:1px solid var(--border);border-radius:6px;padding:2px 7px;text-transform:uppercase;letter-spacing:.4px}
  .countdown{background:linear-gradient(90deg,rgba(79,140,255,.14),rgba(79,140,255,0));border:1px solid rgba(79,140,255,.3);border-radius:10px;padding:8px 12px;font-size:13px}
  .countdown b{font-size:16px}
  .countdown.soon{background:linear-gradient(90deg,rgba(245,166,35,.16),rgba(245,166,35,0));border-color:rgba(245,166,35,.35)}
  .countdown.past{background:linear-gradient(90deg,rgba(46,204,113,.14),rgba(46,204,113,0));border-color:rgba(46,204,113,.3)}
  .timeline{display:flex;align-items:center;gap:0;padding:4px 2px}
  .dot{flex:0 0 auto;width:13px;height:13px;border-radius:50%;background:var(--gray);position:relative}
  .dot.done{background:var(--green)}
  .dot.active{background:var(--blue);box-shadow:0 0 0 4px rgba(79,140,255,.22)}
  .seg{flex:1 1 auto;height:2px;background:var(--gray)}
  .seg.done{background:var(--green)}
  .tl-label{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-top:-4px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sec{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
  .sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:6px;font-weight:700}
  .sec.full{grid-column:1 / -1}
  .kv{font-size:12.5px;margin:3px 0;display:flex;gap:6px}
  .kv .k{color:var(--muted);min-width:90px}
  .lst{list-style:none;font-size:12.5px}
  .lst li{padding:3px 0 3px 14px;position:relative}
  .lst li:before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .upd li{padding:5px 0;border-bottom:1px solid var(--border)}
  .upd li:last-child{border-bottom:none}
  .upd .meta{font-size:10.5px;color:var(--muted);display:flex;gap:8px;margin-bottom:2px}
  .upd .tag{background:var(--chip);border-radius:5px;padding:1px 6px;text-transform:uppercase;letter-spacing:.4px}
  .empty{color:var(--muted);font-size:12px;font-style:italic}
  footer{max-width:1240px;margin:10px auto;padding:0 20px;color:var(--muted);font-size:11px;text-align:center}
  @media(max-width:520px){main{grid-template-columns:1fr;padding:14px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div>
      <h1>🏠 House Flip Closing Coordinator</h1>
      <div class="updated" id="updated">Loading…</div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</header>
<main id="cards"><div class="empty" style="padding:30px">Loading properties…</div></main>
<footer id="foot"></footer>
<script>
const STAGES=["Offer Made","Under Contract","Title & Escrow","Inspections","Appraisal","Financing","Repairs / Rehab","Final Walkthrough","Closing","Closed"];
const ALIAS={"prospecting":0,"offer made":0,"offer":0,"under contract":1,"p&s":1,"uc":1,"title & escrow":2,"title":2,"escrow":2,"inspections":3,"inspection":3,"appraisal":4,"financing":5,"finance":5,"repairs / rehab":6,"rehab":6,"repairs":6,"final walkthrough":7,"walkthrough":7,"closing":8,"closed":9};
function stageIdx(m){if(!m)return 0;const k=(""+m).toLowerCase().trim();if(k in ALIAS)return ALIAS[k];for(const a in ALIAS){if(k.includes(a))return ALIAS[a];}return 0;}
function esc(s){return (""+ (s==null?"":s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function daysTo(d){if(!d)return null;const t=new Date(d+"T00:00:00-04:00");const now=new Date();const ms=t-now;return Math.ceil(ms/86400000);}
function fmtDate(d){if(!d)return "";const t=new Date(d+"T00:00:00-04:00");return t.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}

function timeline(active,closed){
  let h='<div class="timeline">';
  for(let i=0;i<STAGES.length;i++){
    const done=closed?true:(i<active);
    const isActive=!closed&&i===active;
    h+='<span class="dot '+(done?'done':'')+(isActive?'active':'')+'" title="'+esc(STAGES[i])+'"></span>';
    if(i<STAGES.length-1){h+='<span class="seg '+((closed||i<active)?'done':'')+'"></span>';}
  }
  h+='</div><div class="tl-label"><span>Offer</span><span>Closed</span></div>';
  return h;
}
function section(title,inner,full){return '<div class="sec'+(full?' full':'')+'"><h3>'+title+'</h3>'+inner+'</div>';}

function contactsHtml(cs){if(!cs||!cs.length)return '<div class="empty">None recorded</div>';return '<ul class="lst">'+cs.slice(0,8).map(c=>'<li>'+esc(c.name)+(c.role?' <span style="color:var(--muted)">— '+esc(c.role)+'</span>':'')+'</li>').join('')+'</ul>';}
function finHtml(f){if(!f||!Object.keys(f).length)return '<div class="empty">No financials</div>';const lbl={purchase_price:"Purchase",arv:"ARV",repair_budget:"Repair Budget",closing_costs:"Closing Costs",purchase_wire:"Closing Wire"};return Object.keys(f).map(k=>'<div class="kv"><span class="k">'+esc(lbl[k]||k.replace(/_/g," "))+'</span><span>'+esc(f[k])+'</span></div>').join('');}
function datesHtml(p){const rows=[];if(p.closing_date)rows.push(["Closing",fmtDate(p.closing_date)]);if(p.under_contract_date)rows.push(["Under Contract",fmtDate(p.under_contract_date)]);if(p.inspection_date)rows.push(["Inspection",fmtDate(p.inspection_date)]);if(p.appraisal_date)rows.push(["Appraisal",fmtDate(p.appraisal_date)]);if(!rows.length)return '<div class="empty">No dates set</div>';return rows.map(r=>'<div class="kv"><span class="k">'+r[0]+'</span><span>'+r[1]+'</span></div>').join('');}
function itemsHtml(items){if(!items||!items.length)return '<div class="empty">No open items</div>';return '<ul class="lst">'+items.slice(0,8).map(it=>'<li>'+esc(typeof it==="string"?it:(it.text||it.title||JSON.stringify(it)))+'</li>').join('')+'</ul>';}
function updatesHtml(us){if(!us||!us.length)return '<div class="empty">No recent updates</div>';return '<ul class="lst upd">'+us.slice(0,5).map(u=>'<li><div class="meta"><span class="tag">'+esc(u.source||"Email")+'</span><span>'+esc(u.date||"")+'</span></div>'+esc(u.summary||u.subject||"")+'</li>').join('')+'</ul>';}

function card(p){
  const idx=stageIdx(p.current_milestone);const closed=idx>=9||(""+p.status).toLowerCase()==="closed";
  const phaseClass=closed?"closed":(idx===6?"rehab":"");
  let cd="";const d=daysTo(p.closing_date);
  if(p.closing_date){
    let cls="",txt="";
    if(d===null){}else if(d<0){cls="past";txt="Closed / passed "+fmtDate(p.closing_date);}
    else if(d===0){cls="soon";txt="Closing <b>today</b> — "+fmtDate(p.closing_date);}
    else{cls=d<=5?"soon":"";txt="<b>"+d+"</b> day"+(d===1?"":"s")+" to closing · "+fmtDate(p.closing_date);}
    if(txt)cd='<div class="countdown '+cls+'">'+txt+'</div>';
  }
  const srcs=(Array.isArray(p.source)?p.source:[p.source]).filter(Boolean);
  return '<div class="card"><div class="card-top"><div class="addr">'+esc(p.address)+'<span class="city">'+esc([p.city,p.state].filter(Boolean).join(", "))+'</span></div>'+
    '<span class="badge phase '+phaseClass+'">'+esc(p.current_milestone||"—")+'</span></div>'+
    '<div class="srcs">'+srcs.map(s=>'<span class="src">'+esc(s)+'</span>').join('')+(p.auto_detected?'<span class="src">auto</span>':'')+'</div>'+
    cd+
    timeline(idx,closed)+
    '<div class="grid">'+
      section("Financials",finHtml(p.financials))+
      section("Key Contacts",contactsHtml(p.contacts))+
      section("Important Dates",datesHtml(p))+
      section("Action Items",itemsHtml(p.action_items))+
      section("Recent Updates",updatesHtml(p.recent_updates),true)+
    '</div></div>';
}

function rank(p){const idx=stageIdx(p.current_milestone);const d=daysTo(p.closing_date);if(d!==null&&d>=0&&idx>=8)return d;if(idx>=8)return 1000+ (d||0);return 2000-idx;}

fetch("properties_data.json?_="+Date.now()).then(r=>r.json()).then(data=>{
  const props=(data.properties||[]).filter(p=>(""+(p.status||"active")).toLowerCase()!=="archived");
  let active=0,closing=0,rehab=0;
  props.forEach(p=>{const i=stageIdx(p.current_milestone);const closed=i>=9||(""+p.status).toLowerCase()==="closed";if(!closed)active++;if(i===8)closing++;if(i===6)rehab++;});
  document.getElementById("stats").innerHTML=
    '<div class="stat"><div class="n">'+active+'</div><div class="l">Active</div></div>'+
    '<div class="stat"><div class="n">'+closing+'</div><div class="l">At Closing</div></div>'+
    '<div class="stat"><div class="n">'+rehab+'</div><div class="l">In Rehab</div></div>'+
    '<div class="stat"><div class="n">'+props.length+'</div><div class="l">Tracked</div></div>';
  let lu=data.last_updated?new Date(data.last_updated):null;
  document.getElementById("updated").textContent="Last updated: "+(lu?lu.toLocaleString("en-US",{timeZone:"America/New_York",dateStyle:"medium",timeStyle:"short"})+" ET":"unknown");
  props.sort((a,b)=>rank(a)-rank(b));
  document.getElementById("cards").innerHTML=props.map(card).join("");
  document.getElementById("foot").textContent="House Flip Closing Coordinator · "+props.length+" properties · auto-generated dashboard";
}).catch(e=>{document.getElementById("cards").innerHTML='<div class="empty" style="padding:30px">Failed to load properties_data.json: '+e+'</div>';});
</script>
</body>
</html>
