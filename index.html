*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--card-bg:#1a1d27;--card-border:#2a2d3a;--text:#e1e4ed;--text-dim:#8b8fa3;--accent:#4f8cff;--green:#34d399;--yellow:#fbbf24;--red:#f87171;--blue:#60a5fa;--purple:#a78bfa;--orange:#fb923c}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5;padding-bottom:40px}
.header{position:sticky;top:0;z-index:100;background:rgba(15,17,23,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--card-border);padding:16px 24px}
.header h1{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-meta{display:flex;gap:20px;margin-top:6px;font-size:0.82rem;color:var(--text-dim)}
.header-meta .stat{display:flex;align-items:center;gap:5px}
.stat .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.green{background:var(--green)}.dot.blue{background:var(--blue)}.dot.yellow{background:var(--yellow)}.dot.red{background:var(--red)}
.container{max-width:1400px;margin:0 auto;padding:20px 24px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:20px;transition:border-color .2s}
.card:hover{border-color:var(--accent)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.card-address{font-size:1.05rem;font-weight:600;flex:1}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.badge.closed{background:rgba(52,211,153,0.15);color:var(--green)}
.badge.rehab{background:rgba(251,146,44,0.15);color:var(--orange)}
.badge.contract{background:rgba(96,165,250,0.15);color:var(--blue)}
.badge.inspections{background:rgba(251,191,36,0.15);color:var(--yellow)}
.badge.financing{background:rgba(167,139,250,0.15);color:var(--purple)}
.badge.title{background:rgba(79,140,255,0.15);color:var(--accent)}
.badge.prospecting{background:rgba(139,143,163,0.15);color:var(--text-dim)}
.source-badges{display:flex;gap:4px;margin:8px 0 12px}
.src{font-size:0.65rem;padding:2px 7px;border-radius:4px;background:rgba(79,140,255,0.1);color:var(--accent);border:1px solid rgba(79,140,255,0.2)}
.countdown{font-size:0.78rem;color:var(--yellow);margin-bottom:10px;font-weight:500}
.countdown.past{color:var(--green)}
.timeline{display:flex;align-items:center;gap:0;margin:14px 0;position:relative}
.milestone-dot{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.5rem;flex-shrink:0;position:relative;z-index:2}
.milestone-dot.done{background:var(--green);color:#fff}
.milestone-dot.active{background:var(--blue);color:#fff;box-shadow:0 0 8px rgba(96,165,250,0.5)}
.milestone-dot.pending{background:var(--card-border);color:var(--text-dim)}
.milestone-line{flex:1;height:2px;min-width:4px}
.milestone-line.done{background:var(--green)}
.milestone-line.pending{background:var(--card-border)}
.milestone-label{position:absolute;top:22px;font-size:0.5rem;color:var(--text-dim);white-space:nowrap;left:50%;transform:translateX(-50%)}
.sections{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.section{background:rgba(15,17,23,0.5);border-radius:8px;padding:12px}
.section-title{font-size:0.72rem;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-dim);margin-bottom:8px}
.section-item{font-size:0.78rem;color:var(--text);margin-bottom:4px;padding-left:8px;border-left:2px solid var(--card-border)}
.section-item.action{border-left-color:var(--yellow)}
.section-item.update{border-left-color:var(--accent)}
.section-item .date{color:var(--text-dim);font-size:0.7rem}
.section-item .fin-label{color:var(--text-dim)}
.section.full{grid-column:1/-1}
.empty{color:var(--text-dim);font-size:0.75rem;font-style:italic}
@media(max-width:500px){.cards{grid-template-columns:1fr}.sections{grid-template-columns:1fr}}
</style>
</head>

const MILESTONES = ['Offer Made','Under Contract','Title & Escrow','Inspections','Appraisal','Financing','Repairs / Rehab','Final Walkthrough','Closing','Closed'];

function getMilestoneIndex(m){
  const idx = MILESTONES.indexOf(m);
  return idx >= 0 ? idx : -1;
}

function badgeClass(m){
  if(m==='Closed') return 'closed';
  if(m==='Repairs / Rehab') return 'rehab';
  if(m==='Under Contract') return 'contract';
  if(m==='Inspections') return 'inspections';
  if(m==='Financing') return 'financing';
  if(m==='Title & Escrow') return 'title';
  if(m==='Prospecting') return 'prospecting';
  return 'contract';
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const parts = dateStr.split('/');
  const d = new Date(parseInt(parts[2]),parseInt(parts[0])-1,parseInt(parts[1]));
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.ceil((d - now)/(1000*60*60*24));
}

function renderTimeline(currentMilestone){
  const idx = getMilestoneIndex(currentMilestone);
  let html = '<div class="timeline">';
  MILESTONES.forEach((m,i)=>{
    const cls = i < idx ? 'done' : i === idx ? 'active' : 'pending';
    html += `<div class="milestone-dot ${cls}" title="${m}"><span style="display:none">${i+1}</span></div>`;
    if(i < MILESTONES.length - 1){
      const lineCls = i < idx ? 'done' : 'pending';
      html += `<div class="milestone-line ${lineCls}"></div>`;
    }
  });
  html += '</div>';
  // Labels for first, active, and last
  return html;
}

function renderCard(p){
  const days = daysUntil(p.closing_date);
  let countdownHtml = '';
  if(p.closing_date){
    if(days !== null){
      if(days < 0) countdownHtml = `<div class="countdown past">Closed ${Math.abs(days)} days ago (${p.closing_date})</div>`;
      else if(days === 0) countdownHtml = `<div class="countdown">CLOSING TODAY! (${p.closing_date})</div>`;
      else countdownHtml = `<div class="countdown">${days} days to closing (${p.closing_date})</div>`;
    }
  }

  const srcHtml = (p.sources||[]).map(s=>`<span class="src">${s}</span>`).join('');

  // Financials
  let finHtml = '';
  if(p.financials && Object.keys(p.financials).length > 0){
    finHtml = Object.entries(p.financials).map(([k,v])=>{
      const label = k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
      return `<div class="section-item"><span class="fin-label">${label}:</span> ${typeof v === 'string' ? (v.match(/^\d+$/) ? '$'+Number(v).toLocaleString() : v) : v}</div>`;
    }).join('');
  } else {
    finHtml = '<div class="empty">No financial data</div>';
  }

  // Contacts
  let contactsHtml = '';
  if(p.contacts && p.contacts.length > 0){
    contactsHtml = p.contacts.slice(0,5).map(c=>`<div class="section-item">${c.name} <span class="fin-label">(${c.role})</span></div>`).join('');
    if(p.contacts.length > 5) contactsHtml += `<div class="section-item" style="color:var(--text-dim)">+${p.contacts.length-5} more</div>`;
  } else {
    contactsHtml = '<div class="empty">No contacts</div>';
  }

  // Dates
  let datesHtml = '';
  if(p.closing_date){
    datesHtml += `<div class="section-item">Closing: ${p.closing_date}</div>`;
  }
  if(!datesHtml) datesHtml = '<div class="empty">No dates set</div>';

  // Action Items
  let actionsHtml = '';
  if(p.action_items && p.action_items.length > 0){
    actionsHtml = p.action_items.map(a=>`<div class="section-item action">${a}</div>`).join('');
  } else {
    actionsHtml = '<div class="empty">No action items</div>';
  }

  // Recent Updates
  let updatesHtml = '';
  if(p.recent_updates && p.recent_updates.length > 0){
    updatesHtml = p.recent_updates.slice(0,3).map(u=>`<div class="section-item update">${u.date ? '<span class="date">'+u.date+'</span> ' : ''}${u.subject} <span class="src">${u.source}</span></div>`).join('');
  } else {
    updatesHtml = '<div class="empty">No recent updates</div>';
  }

  return `<div class="card">
    <div class="card-header">
      <div class="card-address">${p.address}</div>
      <span class="badge ${badgeClass(p.current_milestone)}">${p.current_milestone}</span>
    </div>
    <div class="source-badges">${srcHtml}</div>
    ${countdownHtml}
    ${renderTimeline(p.current_milestone)}
    <div class="sections">
      <div class="section"><div class="section-title">Financials</div>${finHtml}</div>
      <div class="section"><div class="section-title">Key Contacts</div>${contactsHtml}</div>
      <div class="section"><div class="section-title">Important Dates</div>${datesHtml}</div>
      <div class="section"><div class="section-title">Action Items</div>${actionsHtml}</div>
      <div class="section full"><div class="section-title">Recent Updates</div>${updatesHtml}</div>
    </div>
  </div>`;
}

function render(){
  const props = DATA.properties || [];
  const active = props.filter(p=>p.current_milestone!=='Closed' && p.current_milestone!=='Prospecting');
  const atClosing = props.filter(p=>p.current_milestone==='Closing' || p.current_milestone==='Final Walkthrough');
  const inRehab = props.filter(p=>p.current_milestone==='Repairs / Rehab');
  const closed = props.filter(p=>p.current_milestone==='Closed');

  document.getElementById('stat-active').textContent = active.length;
  document.getElementById('stat-closing').textContent = atClosing.length;
  document.getElementById('stat-rehab').textContent = inRehab.length;
  document.getElementById('stat-closed').textContent = closed.length;
  document.getElementById('stat-total').textContent = props.length;
  document.getElementById('last-updated').textContent = DATA.last_updated;

  // Sort: active first (by milestone progress desc), then prospecting, then closed
  const sorted = [...props].sort((a,b)=>{
    const order = p => {
      if(p.current_milestone==='Closed') return 100;
      if(p.current_milestone==='Prospecting') return 99;
      return getMilestoneIndex(p.current_milestone);
    };
    const oa = order(a), ob = order(b);
    if(oa !== ob) return ob - oa; // Higher milestone first for active
    return 0;
  });
  // Actually let's put active (non-closed, non-prospecting) first sorted by milestone desc, then prospecting, then closed
  const activeProps = sorted.filter(p=>p.current_milestone!=='Closed' && p.current_milestone!=='Prospecting');
  const prospecting = sorted.filter(p=>p.current_milestone==='Prospecting');
  const closedProps = sorted.filter(p=>p.current_milestone==='Closed');

  // Sort active by milestone index descending (further along = first)
  activeProps.sort((a,b)=>getMilestoneIndex(b.current_milestone)-getMilestoneIndex(a.current_milestone));

  const allSorted = [...activeProps, ...prospecting, ...closedProps];

  document.getElementById('cards').innerHTML = allSorted.map(renderCard).join('');
}

document.addEventListener('DOMContentLoaded', render);
</script>
