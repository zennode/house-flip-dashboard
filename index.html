.closed-card{opacity:.6}
.closed-card:hover{opacity:.9}
@media(max-width:500px){.grid{grid-template-columns:1fr;padding:12px}.header{padding:12px}.header h1{font-size:1.1rem}}

const MILESTONES = ['Offer Made','Under Contract','Title & Escrow','Inspections','Appraisal','Financing','Repairs / Rehab','Final Walkthrough','Closing','Closed'];

function getMilestoneIndex(m){
  const i = MILESTONES.indexOf(m);
  return i >= 0 ? i : -1;
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const parts = dateStr.split('/');
  const d = new Date(parts[2], parts[0]-1, parts[1]);
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.ceil((d - now)/(1000*60*60*24));
}

function formatDate(d){
  const dt = new Date(d);
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function sourceBadge(s){
  const cls = s.toLowerCase().replace(/\s/g,'');
  return '<span class="badge badge-' + (cls === 'dotloop' ? 'dotloop' : cls === 'pdf' ? 'pdf' : cls === 'docusign' ? 'docusign' : 'email') + '">' + s + '</span>';
}

function render(){
  const props = DATA.properties;
  const active = props.filter(p => p.current_milestone !== 'Closed' && p.current_milestone !== 'Prospecting');
  const atClosing = props.filter(p => p.current_milestone === 'Closing');
  const inRehab = props.filter(p => p.current_milestone === 'Repairs / Rehab');

  document.getElementById('stats').innerHTML = '<span class="stat-pill"><b>' + active.length + '</b> Active</span><span class="stat-pill"><b>' + atClosing.length + '</b> At Closing</span><span class="stat-pill"><b>' + inRehab.length + '</b> In Rehab</span><span class="last-updated">Updated: ' + formatDate(DATA.last_updated) + '</span>';
  const grid = document.getElementById('grid');
  const order = {'Closing':0,'Financing':1,'Title & Escrow':2,'Inspections':3,'Appraisal':4,'Under Contract':5,'Repairs / Rehab':6,'Final Walkthrough':7,'Offer Made':8,'Prospecting':9,'Closed':10};
  const sorted = [...props].sort((a,b) => (order[a.current_milestone]||99) - (order[b.current_milestone]||99));

  grid.innerHTML = sorted.map(p => {
    const mi = getMilestoneIndex(p.current_milestone);
    const isClosed = p.current_milestone === 'Closed';
    const isProspecting = p.current_milestone === 'Prospecting';
    const days = daysUntil(p.closing_date);

    let milestoneHTML = '';
    if(!isProspecting){
      milestoneHTML = '<div class="milestone-track">';
      MILESTONES.forEach((m, idx) => {
        const state = idx < mi ? 'completed' : idx === mi ? 'active' : 'pending';
        milestoneHTML += '<div class="milestone-dot ' + state + '" data-tooltip="' + m + '"></div>';
        if(idx < MILESTONES.length - 1){
          milestoneHTML += '<div class="milestone-line ' + (idx < mi ? 'completed' : 'pending') + '"></div>';
        }
      });
      milestoneHTML += '</div>';
    }

    let countdownHTML = '';
    if(days !== null && !isClosed){
      if(days > 0) countdownHTML = '<div class="countdown">&#9201; ' + days + ' day' + (days!==1?'s':'') + ' to closing</div>';
      else if(days === 0) countdownHTML = '<div class="countdown" style="color:var(--red)">&#128308; CLOSING TODAY</div>';
      else countdownHTML = '<div class="countdown" style="color:var(--red)">&#9888;&#65039; ' + Math.abs(days) + ' day' + (Math.abs(days)!==1?'s':'') + ' past closing</div>';
    }
    const financials = p.financials && Object.keys(p.financials).length > 0 ?
      '<div class="section"><div class="section-title">Financials</div><div class="info-grid">' +
        Object.entries(p.financials).map(([k,v]) => '<span class="label">' + k.replace(/_/g,' ') + '</span><span class="value">$' + (typeof v === 'string' && v.includes('-') ? v.replace(/(\d+)/g, (m) => Number(m).toLocaleString()) : Number(v).toLocaleString()) + '</span>').join('') +
      '</div></div>' : '';

    const contacts = p.contacts && p.contacts.length > 0 ?
      '<div class="section"><div class="section-title">Key Contacts</div><ul class="contact-list">' +
        p.contacts.map(c => '<li>' + c.name + ' <span style="color:var(--text-dim)">(' + c.role + ')</span></li>').join('') +
      '</ul></div>' : '';

    const actions = p.action_items && p.action_items.length > 0 ?
      '<div class="section"><div class="section-title">Action Items</div><ul class="action-list">' +
        p.action_items.map(a => '<li>' + a + '</li>').join('') +
      '</ul></div>' : '';

    const updates = p.recent_updates && p.recent_updates.length > 0 ?
      '<div class="section"><div class="section-title">Recent Updates</div><ul class="update-list">' +
        p.recent_updates.slice(0,4).map(u => '<li>' + (u.date ? '<span class="date">' + u.date + '</span> ' : '') + u.subject + ' <span style="color:var(--text-dim);font-size:.7rem">[' + u.source + ']</span></li>').join('') +
      '</ul></div>' : '';

    return '<div class="card ' + (isClosed ? 'closed-card' : '') + '"><div class="card-header"><div class="card-address">' + p.address + '</div><div class="badges"><span class="badge badge-phase">' + p.current_milestone + '</span>' + (p.sources||[]).map(s => sourceBadge(s)).join('') + '</div>' + countdownHTML + '</div>' + milestoneHTML + '<div class="card-body">' + financials + contacts + actions + updates + '</div></div>';
  }).join('');
}

document.addEventListener('DOMContentLoaded', render);
</script>
