<head>
<meta charset="UTF-8">

<title>House Flip Closing Coordinator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --bg: #0f1117;
  --card-bg: #1a1d27;
  --text: #e4e4e7;
  --text-muted: #9ca3af;
  --accent: #3b82f6;
  --accent-green: #22c55e;
  --accent-yellow: #eab308;
  --accent-red: #ef4444;
  --border: #2d3140;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* âââ HEADER âââââââââââââââââââââââââââââââââââââââââââ */
.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(15,17,23,0.96);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
}
.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.header-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  flex: 1;
  min-width: 200px;
}
.header-title span {
  color: var(--accent);
}
.header-meta {
  font-size: 12px;
  color: var(--text-muted);
}
.header-badges {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.stat-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid;
}
.stat-badge.blue { background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.4); color: #93c5fd; }
.stat-badge.green { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.4); color: #86efac; }
.stat-badge.yellow { background: rgba(234,179,8,0.15); border-color: rgba(234,179,8,0.4); color: #fde047; }
.stat-badge.red { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.4); color: #fca5a5; }
.stat-dot { width: 7px; height: 7px; border-radius: 50%; }
.stat-dot.blue { background: var(--accent); }
.stat-dot.green { background: var(--accent-green); }
.stat-dot.yellow { background: var(--accent-yellow); }
.stat-dot.red { background: var(--accent-red); }

/* âââ FILTER BAR ââââââââââââââââââââââââââââââââââââââââ */
.filter-bar {
  max-width: 1400px;
  margin: 18px auto 0;
  padding: 0 20px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.filter-btn {
  padding: 6px 16px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--card-bg);
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.18s ease;
  font-family: inherit;
}
.filter-btn:hover {
  border-color: var(--accent);
  color: var(--text);
}
.filter-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* âââ GRID ââââââââââââââââââââââââââââââââââââââââââââââ */
.grid {
  max-width: 1400px;
  margin: 20px auto 40px;
  padding: 0 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 16px;
}

/* âââ CARD ââââââââââââââââââââââââââââââââââââââââââââââ */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: box-shadow 0.2s, border-color 0.2s;
  display: flex;
  flex-direction: column;
}
.card:hover { box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
.card.urgent { border-left: 3px solid var(--accent-red); }
.card.hidden { display: none; }

.card-header {
  padding: 14px 16px 12px;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.card-header-left { flex: 1; min-width: 0; }
.card-address {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 6px;
}
.card-badges { display: flex; flex-wrap: wrap; gap: 5px; }

.phase-badge {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.phase-green { background: rgba(34,197,94,0.2); color: #86efac; }
.phase-blue { background: rgba(59,130,246,0.2); color: #93c5fd; }
.phase-yellow { background: rgba(234,179,8,0.2); color: #fde047; }
.phase-red { background: rgba(239,68,68,0.2); color: #fca5a5; }
.phase-gray { background: rgba(156,163,175,0.15); color: #9ca3af; }

.source-badge {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
  border: 1px solid;
}
.src-dotloop { background: rgba(59,130,246,0.1); border-color: rgba(59,130,246,0.35); color: #93c5fd; }
.src-docusign { background: rgba(251,191,36,0.1); border-color: rgba(251,191,36,0.35); color: #fde047; }
.src-email { background: rgba(156,163,175,0.1); border-color: rgba(156,163,175,0.3); color: #d1d5db; }
.src-pdf { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: #fca5a5; }

.card-chevron {
  color: var(--text-muted);
  font-size: 16px;
  transition: transform 0.25s ease;
  flex-shrink: 0;
  margin-top: 2px;
}
.card.expanded .card-chevron { transform: rotate(180deg); }

.countdown {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
  margin-top: 4px;
}
.countdown.ok { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
.countdown.soon { background: rgba(234,179,8,0.15); color: #fde047; border: 1px solid rgba(234,179,8,0.3); }
.countdown.overdue { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); animation: pulse-red 1.5s infinite; }

@keyframes pulse-red {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* âââ TIMELINE ââââââââââââââââââââââââââââââââââââââââââ */
.milestone-bar {
  padding: 10px 16px 12px;
  border-top: 1px solid var(--border);
}
.milestone-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
  font-weight: 500;
}
.milestone-track {
  display: flex;
  align-items: center;
  gap: 3px;
  flex-wrap: nowrap;
  overflow: visible;
}
.ms-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  gap: 4px;
  min-width: 0;
}
.ms-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.ms-dot.done { background: var(--accent-green); }
.ms-dot.active {
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.3);
  animation: pulse-blue 1.8s ease-in-out infinite;
}
.ms-dot.pending { background: #374151; }
.ms-dot.prospecting-dot { background: var(--accent-yellow); }

@keyframes pulse-blue {
  0%, 100% { box-shadow: 0 0 0 3px rgba(59,130,246,0.3); }
  50% { box-shadow: 0 0 0 5px rgba(59,130,246,0.15); }
}
.ms-connector {
  height: 2px;
  flex: 1;
  min-width: 4px;
  border-radius: 1px;
}
.ms-connector.done { background: var(--accent-green); }
.ms-connector.pending { background: #2d3140; }

/* âââ CARD BODY âââââââââââââââââââââââââââââââââââââââââ */
.card-body {
  display: none;
  border-top: 1px solid var(--border);
  padding: 0;
}
.card.expanded .card-body { display: block; }

.card-section {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.card-section:last-child { border-bottom: none; }
.section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: 8px;
}

/* financials */
.financials-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 12px;
}
.fin-item { }
.fin-key { font-size: 11px; color: var(--text-muted); }
.fin-val { font-size: 13px; font-weight: 500; color: var(--text); }

/* contacts */
.contacts-list { display: flex; flex-direction: column; gap: 5px; }
.contact-item { display: flex; align-items: baseline; gap: 6px; }
.contact-name { font-size: 13px; font-weight: 500; }
.contact-role { font-size: 11px; color: var(--text-muted); }

/* dates */
.dates-list { display: flex; flex-direction: column; gap: 5px; }
.date-item { display: flex; gap: 8px; font-size: 13px; }
.date-label { color: var(--text-muted); min-width: 90px; }

/* action items */
.action-list { display: flex; flex-direction: column; gap: 5px; }
.action-item {
  display: flex;
  gap: 7px;
  align-items: flex-start;
  font-size: 13px;
  color: var(--text);
  padding: 5px 8px;
  background: rgba(239,68,68,0.07);
  border-radius: 6px;
  border-left: 2px solid var(--accent-red);
}
.action-icon { color: var(--accent-yellow); font-size: 12px; margin-top: 1px; flex-shrink: 0; }

/* updates */
.updates-list { display: flex; flex-direction: column; gap: 8px; }
.update-item {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.update-item:last-child { border-bottom: none; padding-bottom: 0; }
.update-meta { display: flex; align-items: center; gap: 6px; }
.update-date { font-size: 11px; color: var(--text-muted); }
.update-subject {
  font-size: 12px;
  color: var(--text);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* âââ RESPONSIVE ââââââââââââââââââââââââââââââââââââââââ */
@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; padding: 0 12px; }
  .header-inner { gap: 8px; }
  .header-title { font-size: 15px; }
  .filter-bar { padding: 0 12px; }
}

/* âââ EMPTY STATE âââââââââââââââââââââââââââââââââââââââ */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  font-size: 15px;
  display: none;
}
.empty-state.visible { display: block; }
</style>
</head>

// MILESTONE CONFIG
// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ

  'Offer Made',
  'Under Contract',
  'Title & Escrow',
  'Inspections',
  'Appraisal',
  'Financing',
  'Repairs / Rehab',

// HELPERS
// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
const TODAY = new Date('2026-05-22');

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function fmtLastUpdated(iso) {
  const d = new Date(iso);
  return 'Updated ' + d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
}

function parseClosingDate(str) {
  if (!str) return null;
  const d = new Date(str);
  if (!isNaN(d)) return d;
  return null;
}

function daysToClosing(str) {
  const d = parseClosingDate(str);
  if (!d) return null;
  const diff = Math.round((d - TODAY) / 86400000);
  return diff;
}

function formatMoney(val) {
  const n = parseFloat(String(val).replace(/[^0-9.]/g, ''));
  if (isNaN(n)) return val;
  if (n >= 1000000) return '$' + (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1000) return '$' + n.toLocaleString();
  return '$' + n;
}

function formatFinKey(key) {
  return key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function formatFinVal(key, val) {
  const lower = key.toLowerCase();
  if (lower.includes('rate') || lower.includes('percent')) return val;
  if (lower.includes('term') || lower.includes('type') || lower.includes('loan_type') || lower.includes('entity') || lower.includes('concession')) return val;
  if (/\d.*-.*\d/.test(val)) {
    const parts = val.split('-');
    return parts.map(p => isNaN(p.trim()) ? p.trim() : formatMoney(p.trim())).join(' â ');
  }
  if (/^\d+(\.\d+)?$/.test(String(val))) return formatMoney(val);
  return val;
}

function srcClass(src) {
  const map = { dotloop: 'src-dotloop', docusign: 'src-docusign', email: 'src-email', pdf: 'src-pdf' };
  return map[src.toLowerCase()] || 'src-email';
}

function phaseBadgeClass(milestone) {
  if (milestone === 'Closed') return 'phase-green';
  if (milestone === 'Inspections') return 'phase-yellow';
  if (milestone === 'Prospecting') return 'phase-gray';
  return 'phase-blue';
}

function sortKey(p) {
  const m = p.current_milestone;
  if (m === 'Prospecting') return 2;
  if (m === 'Closed') return 1;
  return 0;
}

function milestoneProgress(m) {
  if (m === 'Prospecting') return -1;
  return MILESTONES.indexOf(m);
}

function getFilterGroup(p) {
  const m = p.current_milestone;
  if (m === 'Closed') return 'closed';
  if (m === 'Prospecting') return 'prospecting';
  if (m === 'Closing') return 'closing';
  if (m === 'Repairs / Rehab') return 'rehab';
  return 'active';
}

// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
// SORT PROPERTIES
// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function sortProperties(props) {
  return [...props].sort((a, b) => {
    const sk = sortKey(a) - sortKey(b);
    if (sk !== 0) return sk;
    // within active: higher milestone index = closer to done
    if (sortKey(a) === 0) {
      const diff = milestoneProgress(b) - milestoneProgress(a);
      if (diff !== 0) return diff;
    }
    return 0;
  });
}

// BUILD MILESTONE TIMELINE
// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function buildTimeline(currentMilestone) {
  const isProspecting = currentMilestone === 'Prospecting';
  const currentIdx = MILESTONES.indexOf(currentMilestone);

  let html = '<div class="milestone-bar">';
  html += '<div class="milestone-label">Milestone Progress</div>';
  html += '<div class="milestone-track">';

  // Prospecting dot
  const prospClass = isProspecting ? 'ms-dot active' : (currentIdx >= 0 ? 'ms-dot done' : 'ms-dot pending');
  html += `<div class="ms-item" title="Prospecting"><div class="${prospClass}"></div></div>`;

  // Connector after prospecting
  const conn0Class = (!isProspecting && currentIdx >= 0) ? 'ms-connector done' : 'ms-connector pending';
  html += `<div class="${conn0Class}" style="flex:0.5"></div>`;

  MILESTONES.forEach((ms, i) => {
    let dotClass;
    if (isProspecting) {
      dotClass = 'ms-dot pending';
    } else if (i < currentIdx) {
      dotClass = 'ms-dot done';
    } else if (i === currentIdx) {
      dotClass = 'ms-dot active';
    } else {
      dotClass = 'ms-dot pending';
    }
    html += `<div class="ms-item" title="${ms}"><div class="${dotClass}"></div></div>`;
    if (i < MILESTONES.length - 1) {
      const connClass = (!isProspecting && i < currentIdx) ? 'ms-connector done' : 'ms-connector pending';
      html += `<div class="${connClass}"></div>`;
    }
  });

  html += '</div></div>';
  return html;
}

// BUILD CARD HTML
// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function buildCard(prop) {
  const hasActionItems = prop.action_items && prop.action_items.length > 0;
  const isClosed = prop.current_milestone === 'Closed';
  const isProspecting = prop.current_milestone === 'Prospecting';
  const filterGroup = getFilterGroup(prop);

  // Countdown
  let countdownHtml = '';
  if (prop.closing_date && !isClosed) {
    const days = daysToClosing(prop.closing_date);
    if (days !== null) {
      if (days < 0) {
        countdownHtml = `<div class="countdown overdue">&#9888; CLOSING OVERDUE (${Math.abs(days)}d ago)</div>`;
      } else if (days <= 14) {
        countdownHtml = `<div class="countdown soon">&#128197; ${days} days to closing</div>`;
      } else {
        countdownHtml = `<div class="countdown ok">&#128197; ${days} days to closing</div>`;
      }
    }
  }

  // Sources
  const sourcesHtml = prop.sources.map(s =>
    `<span class="source-badge ${srcClass(s)}">${s}</span>`
  ).join('');

  // Phase badge
  const phaseClass = phaseBadgeClass(prop.current_milestone);
  const phaseBadge = `<span class="phase-badge ${phaseClass}">${prop.current_milestone}</span>`;

  // Card classes
  const cardClasses = ['card', filterGroup];
  if (hasActionItems) cardClasses.push('urgent');
  // Expand by default if has action items
  if (hasActionItems) cardClasses.push('expanded');

  // ââ FINANCIALS ââ
  let financialsHtml = '';
  const finEntries = Object.entries(prop.financials || {}).filter(([k, v]) => v !== '' && v !== null);
  if (finEntries.length > 0) {
    financialsHtml = `<div class="card-section">
      <div class="section-title">Financials</div>
      <div class="financials-grid">
        ${finEntries.map(([k, v]) => `
          <div class="fin-item">
            <div class="fin-key">${formatFinKey(k)}</div>
            <div class="fin-val">${formatFinVal(k, v)}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
  }

  // ââ CONTACTS ââ
  let contactsHtml = '';
  if (prop.contacts && prop.contacts.length > 0) {
    contactsHtml = `<div class="card-section">
      <div class="section-title">Key Contacts</div>
      <div class="contacts-list">
        ${prop.contacts.map(c => `
          <div class="contact-item">
            <span class="contact-name">${c.name}</span>
            <span class="contact-role">${c.role}</span>
          </div>
        `).join('')}
      </div>
    </div>`;
  }

  // ââ DATES ââ
  let datesHtml = '';
  if (prop.closing_date) {
    const cdDate = parseClosingDate(prop.closing_date);
    const cdFmt = cdDate ? cdDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : prop.closing_date;
    datesHtml = `<div class="card-section">
      <div class="section-title">Important Dates</div>
      <div class="dates-list">
        <div class="date-item"><span class="date-label">Closing Date</span><span>${cdFmt}</span></div>
      </div>
    </div>`;
  }

  // ââ ACTION ITEMS ââ
  let actionsHtml = '';
  if (hasActionItems) {
    actionsHtml = `<div class="card-section">
      <div class="section-title">Action Items</div>
      <div class="action-list">
        ${prop.action_items.map(a => `
          <div class="action-item">
            <span class="action-icon">&#9888;</span>
            <span>${a}</span>
          </div>
        `).join('')}
      </div>
    </div>`;
  }

  // ââ RECENT UPDATES ââ
  let updatesHtml = '';
  const updates = (prop.recent_updates || []).slice(0, 3);
  if (updates.length > 0) {
    updatesHtml = `<div class="card-section">
      <div class="section-title">Recent Updates</div>
      <div class="updates-list">
        ${updates.map(u => {
          const text = u.subject || u.note || '';
          return `<div class="update-item">
            <div class="update-meta">
              ${u.date ? `<span class="update-date">${fmtDate(u.date)}</span>` : ''}
              <span class="source-badge ${srcClass(u.source || 'Email')}">${u.source || 'Email'}</span>
            </div>
            <div class="update-subject">${text}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  return `
  <div class="${cardClasses.join(' ')}" data-filter="${filterGroup}" data-address="${prop.address}">
    <div class="card-header" onclick="toggleCard(this)">
      <div class="card-header-left">
        <div class="card-address">${prop.address}</div>
        <div class="card-badges">
          ${phaseBadge}
          ${sourcesHtml}
        </div>
        ${countdownHtml}
      </div>
      <span class="card-chevron">&#8964;</span>
    </div>
    ${buildTimeline(prop.current_milestone)}
    <div class="card-body">
      ${financialsHtml}
      ${contactsHtml}
      ${datesHtml}
      ${actionsHtml}
      ${updatesHtml}
    </div>
  </div>`;
}

// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
// FILTER
// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
let currentFilter = 'all';

function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === filter);
  });
  const cards = document.querySelectorAll('.card');
  let visible = 0;
  cards.forEach(card => {
    const group = card.dataset.filter;
    const show = filter === 'all' || group === filter;
    card.classList.toggle('hidden', !show);
    if (show) visible++;
  });
  const empty = document.getElementById('empty-state');
  empty.classList.toggle('visible', visible === 0);
}

// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
// TOGGLE CARD
// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function toggleCard(headerEl) {
  const card = headerEl.closest('.card');
  card.classList.toggle('expanded');
}

// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
// STATS
// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function computeStats(props) {
  let active = 0, atClosing = 0, inRehab = 0;
  props.forEach(p => {
    const m = p.current_milestone;
    if (m !== 'Closed' && m !== 'Prospecting') active++;
    if (m === 'Closing') atClosing++;
    if (m === 'Repairs / Rehab') inRehab++;
  });
  return { active, atClosing, inRehab };
}

// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
// INIT
// âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
(function init() {
  // Last updated
  document.getElementById('last-updated').textContent = fmtLastUpdated(DATA.last_updated);

  // Stats badges
  const stats = computeStats(DATA.properties);
  const badgesEl = document.getElementById('header-badges');
  badgesEl.innerHTML = `
    <span class="stat-badge blue"><span class="stat-dot blue"></span>${stats.active} Active</span>
    <span class="stat-badge yellow"><span class="stat-dot yellow"></span>${stats.atClosing} At Closing</span>
    <span class="stat-badge green"><span class="stat-dot green"></span>${stats.inRehab} In Rehab</span>
  `;

  // Filter bar
  const filters = [
    { label: 'All', key: 'all' },
    { label: 'Active', key: 'active' },
    { label: 'Closing', key: 'closing' },
    { label: 'Rehab', key: 'rehab' },
    { label: 'Closed', key: 'closed' },
    { label: 'Prospecting', key: 'prospecting' },
  ];
  const filterBar = document.getElementById('filter-bar');
  filterBar.innerHTML = filters.map(f =>
    `<button class="filter-btn${f.key === 'all' ? ' active' : ''}" data-filter="${f.key}" onclick="setFilter('${f.key}')">${f.label}</button>`
  ).join('');

  // Sort and render cards
  const sorted = sortProperties(DATA.properties);
  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('empty-state');
  grid.innerHTML = emptyState.outerHTML; // keep empty state
  sorted.forEach(p => {
    grid.insertAdjacentHTML('beforeend', buildCard(p));
  });
})();
</script>
