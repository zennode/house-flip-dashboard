<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Flip Closing Coordinator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--card-bg:#1a1d27;--card-border:#2a2d3a;--text:#e1e4ed;--text-dim:#8b8fa3;--accent:#6c63ff;--green:#22c55e;--blue:#3b82f6;--yellow:#eab308;--orange:#f97316;--red:#ef4444;--cyan:#06b6d4}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#1a1d27 0%,#0f1117 100%);border-bottom:1px solid var(--card-border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
header h1{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,#6c63ff,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-meta{font-size:.8rem;color:var(--text-dim)}
.stats-bar{display:flex;gap:16px;flex-wrap:wrap}
.stat{text-align:center;padding:4px 12px;border-radius:8px;background:rgba(108,99,255,.08)}
.stat .num{font-size:1.3rem;font-weight:700;color:var(--accent)}
.stat .lbl{font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim)}
.container{max-width:1400px;margin:0 auto;padding:20px}
.alert-banner{background:linear-gradient(135deg,rgba(239,68,68,.15),rgba(249,115,22,.1));border:1px solid rgba(239,68,68,.3);border-radius:12px;padding:14px 20px;margin-bottom:20px;display:flex;align-items:center;gap:10px;font-size:.9rem}
.alert-banner .icon{font-size:1.2rem}
.section-title{font-size:1.1rem;font-weight:600;margin:24px 0 12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;font-size:.8rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:20px;transition:border-color .2s}
.card:hover{border-color:var(--accent)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:8px}
.card-address{font-size:1.05rem;font-weight:600}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.badge-closed{background:rgba(34,197,94,.15);color:var(--green)}
.badge-closing{background:rgba(249,115,22,.15);color:var(--orange)}
.badge-rehab{background:rgba(59,130,246,.15);color:var(--blue)}
.badge-financing{background:rgba(234,179,8,.15);color:var(--yellow)}
.badge-contract{background:rgba(6,182,212,.15);color:var(--cyan)}
.badge-prospecting{background:rgba(139,143,163,.15);color:var(--text-dim)}
.badge-escrow{background:rgba(168,85,247,.15);color:#a855f7}
.badge-inspection{background:rgba(236,72,153,.15);color:#ec4899}
.source-badges{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.src{font-size:.6rem;padding:1px 6px;border-radius:4px;background:rgba(108,99,255,.1);color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.countdown{font-size:.8rem;color:var(--orange);margin-bottom:10px;font-weight:500}
.countdown.urgent{color:var(--red);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.timeline{display:flex;gap:0;margin:12px 0;align-items:center}
.dot-wrap{display:flex;flex-direction:column;align-items:center;flex:1;position:relative}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--card-border)}
.dot.completed{background:var(--green);border-color:var(--green)}
.dot.active{background:var(--blue);border-color:var(--blue);box-shadow:0 0 8px rgba(59,130,246,.5)}
.dot-label{font-size:.5rem;color:var(--text-dim);text-align:center;margin-top:4px;white-space:nowrap;max-width:48px;overflow:hidden;text-overflow:ellipsis}
.line{height:2px;flex:1;background:var(--card-border);min-width:4px}
.line.completed{background:var(--green)}
.grid-sections{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.grid-section{background:rgba(15,17,23,.5);border-radius:8px;padding:10px}
.grid-section h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:6px}
.grid-section.full{grid-column:1/-1}
.grid-section ul{list-style:none;font-size:.78rem}
.grid-section li{padding:2px 0;border-bottom:1px solid rgba(42,45,58,.5)}
.grid-section li:last-child{border:none}
.action-item{color:var(--yellow);font-size:.78rem}
.update-entry{font-size:.75rem;color:var(--text-dim)}
.update-entry .date{color:var(--accent);font-weight:500}
.update-entry .src-tag{font-size:.6rem;padding:0 4px;border-radius:3px;background:rgba(108,99,255,.1);color:var(--accent);margin-left:4px}
.financial-row{display:flex;justify-content:space-between;font-size:.8rem}
.financial-row .label{color:var(--text-dim)}
.financial-row .value{font-weight:600}
.empty{color:var(--text-dim);font-style:italic;font-size:.75rem}
@media(max-width:500px){.cards{grid-template-columns:1fr}.grid-sections{grid-template-columns:1fr}.header h1{font-size:1.1rem}}
</style>
</head>
<body>
<header>
<div>
<h1>House Flip Closing Coordinator</h1>
<div class="header-meta">Last updated: <span id="lastUpdated">Loading...</span></div>
</div>
<div class="stats-bar">
<div class="stat"><div class="num" id="statActive">-</div><div class="lbl">Active</div></div>
<div class="stat"><div class="num" id="statClosing">-</div><div class="lbl">At Closing</div></div>
<div class="stat"><div class="num" id="statRehab">-</div><div class="lbl">In Rehab</div></div>
<div class="stat"><div class="num" id="statClosed">-</div><div class="lbl">Closed</div></div>
</div>
</header>
<div class="container">
<div id="alertBanner"></div>
<div id="activeSection"></div>
<div id="closedSection"></div>
</div>
<script>
const MILESTONES = ['Offer Made','Under Contract','Title & Escrow','Inspections','Appraisal','Financing','Repairs / Rehab','Final Walkthrough','Closing','Closed'];
const MILESTONE_BADGES = {'Closed':'badge-closed','Closing':'badge-closing','Repairs / Rehab':'badge-rehab','Financing':'badge-financing','Under Contract':'badge-contract','Title & Escrow':'badge-escrow','Inspections':'badge-inspection','Prospecting':'badge-prospecting','Offer Made':'badge-contract','Appraisal':'badge-financing','Final Walkthrough':'badge-closing'};

function daysUntil(dateStr){
  if(!dateStr)return null;
  const parts=dateStr.includes('-')?dateStr.split('-'):(dateStr.includes('/')?dateStr.split('/'):[]);
  let d;
  if(parts.length===3){
    if(dateStr.includes('-'))d=new Date(parts[0],parts[1]-1,parts[2]);
    else d=new Date(parts[2],parts[0]-1,parts[1]);
  }else return null;
  const now=new Date();now.setHours(0,0,0,0);d.setHours(0,0,0,0);
  return Math.ceil((d-now)/(86400000));
}

function formatMoney(v){if(!v)return'-';const n=parseFloat(v);return isNaN(n)?v:'$'+n.toLocaleString()}

function milestoneIndex(m){const i=MILESTONES.indexOf(m);return i>=0?i:(m==='Prospecting'?-1:0)}

function renderTimeline(currentMilestone){
  const ci=milestoneIndex(currentMilestone);
  if(ci<0)return '<div style="font-size:.7rem;color:var(--text-dim);margin:8px 0">Prospecting â not yet in pipeline</div>';
  let html='<div class="timeline">';
  MILESTONES.forEach((m,i)=>{
    const cls=i<ci?'completed':(i===ci?'active':'');
    if(i>0)html+=`<div class="line ${i<=ci?'completed':''}"></div>`;
    html+=`<div class="dot-wrap"><div class="dot ${cls}"></div><div class="dot-label">${m.replace('Repairs / Rehab','Rehab')}</div></div>`;
  });
  html+='</div>';return html;
}

function renderCard(p){
  const days=daysUntil(p.closing_date);
  const badgeCls=MILESTONE_BADGES[p.current_milestone]||'badge-prospecting';
  let countdown='';
  if(days!==null&&p.current_milestone!=='Closed'){
    if(days<=0)countdown='<div class="countdown urgent">CLOSING DAY / PAST DUE</div>';
    else if(days<=7)countdown=`<div class="countdown urgent">â¡ ${days} day${days>1?'s':''} to closing</div>`;
    else countdown=`<div class="countdown">${days} days to closing</div>`;
  }
  const sources=(p.sources||[]).map(s=>`<span class="src">${s}</span>`).join('');
  const fin=p.financials||{};
  const hasFinancials=Object.keys(fin).length>0;

  let financialsHtml='';
  if(hasFinancials){
    financialsHtml='<div class="grid-section"><h4>Financials</h4>';
    if(fin.purchase_price)financialsHtml+=`<div class="financial-row"><span class="label">Purchase</span><span class="value">${formatMoney(fin.purchase_price)}</span></div>`;
    if(fin.rehab_budget)financialsHtml+=`<div class="financial-row"><span class="label">Rehab Budget</span><span class="value">${formatMoney(fin.rehab_budget)}</span></div>`;
    if(fin.total_loan)financialsHtml+=`<div class="financial-row"><span class="label">Total Loan</span><span class="value">${formatMoney(fin.total_loan)}</span></div>`;
    if(fin.funds_at_closing)financialsHtml+=`<div class="financial-row"><span class="label">Funds at Closing</span><span class="value">${formatMoney(fin.funds_at_closing)}</span></div>`;
    if(fin.rate)financialsHtml+=`<div class="financial-row"><span class="label">Rate / Term</span><span class="value">${fin.rate} / ${fin.term||'-'}</span></div>`;
    if(fin.closing_costs)financialsHtml+=`<div class="financial-row"><span class="label">Closing Costs</span><span class="value">${formatMoney(fin.closing_costs)}</span></div>`;
    financialsHtml+='</div>';
  }

  const contacts=(p.contacts||[]).map(c=>`<li>${c.name} <span style="color:var(--text-dim)">(${c.role})</span></li>`).join('');
  const contactsHtml=contacts?`<div class="grid-section"><h4>Key Contacts</h4><ul>${contacts}</ul></div>`:'';

  const actions=(p.action_items||[]).map(a=>`<li class="action-item">â¸ ${a}</li>`).join('');
  const actionsHtml=actions?`<div class="grid-section full"><h4>Action Items</h4><ul>${actions}</ul></div>`:'';

  const updates=(p.recent_updates||[]).slice(0,3).map(u=>{
    const d=u.date?`<span class="date">${u.date}</span> `:'';
    const s=u.source?`<span class="src-tag">${u.source}</span>`:'';
    return `<li class="update-entry">${d}${u.subject}${s}</li>`;
  }).join('');
  const updatesHtml=updates?`<div class="grid-section full"><h4>Recent Updates</h4><ul>${updates}</ul></div>`:'';

  return `<div class="card">
    <div class="card-header">
      <div class="card-address">${p.address}</div>
      <span class="badge ${badgeCls}">${p.current_milestone}</span>
    </div>
    <div class="source-badges">${sources}</div>
    ${countdown}
    ${renderTimeline(p.current_milestone)}
    <div class="grid-sections">
      ${financialsHtml}${contactsHtml}${actionsHtml}${updatesHtml}
    </div>
  </div>`;
}

async function loadDashboard(){
  try{
    const resp=await fetch('properties_data.json?t='+Date.now());
    const data=await resp.json();
    document.getElementById('lastUpdated').textContent=new Date(data.last_updated).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'});
    const props=data.properties||[];
    const active=props.filter(p=>p.current_milestone!=='Closed');
    const closed=props.filter(p=>p.current_milestone==='Closed');
    const atClosing=props.filter(p=>p.current_milestone==='Closing'||p.current_milestone==='Final Walkthrough');
    const inRehab=props.filter(p=>p.current_milestone==='Repairs / Rehab');
    document.getElementById('statActive').textContent=active.length;
    document.getElementById('statClosing').textContent=atClosing.length;
    document.getElementById('statRehab').textContent=inRehab.length;
    document.getElementById('statClosed').textContent=closed.length;

    // Alert for urgent closings
    const urgent=props.filter(p=>{const d=daysUntil(p.closing_date);return d!==null&&d<=7&&d>=0&&p.current_milestone!=='Closed'});
    if(urgent.length>0){
      document.getElementById('alertBanner').innerHTML=urgent.map(u=>{
        const d=daysUntil(u.closing_date);
        return `<div class="alert-banner"><span class="icon">â ï¸</span><strong>Urgent:</strong>&nbsp;${u.address} â closing in ${d} day${d!==1?'s':''}${(u.action_items||[]).length>0?' | '+u.action_items[0]:''}</div>`;
      }).join('');
    }

    // Sort active: by closing date (soonest first), then by milestone progress
    active.sort((a,b)=>{
      const da=daysUntil(a.closing_date),db=daysUntil(b.closing_date);
      if(da!==null&&db!==null)return da-db;
      if(da!==null)return -1;if(db!==null)return 1;
      return milestoneIndex(b.current_milestone)-milestoneIndex(a.current_milestone);
    });

    let activeHtml='<div class="section-title">Active Properties ('+active.length+')</div><div class="cards">';
    activeHtml+=active.map(renderCard).join('');
    activeHtml+='</div>';
    document.getElementById('activeSection').innerHTML=activeHtml;

    let closedHtml='<div class="section-title">Closed Properties ('+closed.length+')</div><div class="cards">';
    closedHtml+=closed.map(renderCard).join('');
    closedHtml+='</div>';
    document.getElementById('closedSection').innerHTML=closedHtml;
  }catch(e){
    document.querySelector('.container').innerHTML='<div class="alert-banner"><span class="icon">â</span>Error loading data: '+e.message+'</div>';
  }
}
loadDashboard();
</script>
</body>
</html>
