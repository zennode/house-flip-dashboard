<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Flip Closing Coordinator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--card-bg:#1a1d27;--card-border:#2a2d37;--text:#e0e0e0;--text-muted:#888;--accent:#4a9eff;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--orange:#f97316;--purple:#a855f7}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5}
.header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#1a1d27,#252836);border-bottom:1px solid var(--card-border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.header h1{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,#4a9eff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{text-align:center;padding:6px 14px;background:rgba(255,255,255,0.05);border-radius:8px}
.stat-value{font-size:1.3rem;font-weight:700}
.stat-label{font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.last-updated{font-size:.75rem;color:var(--text-muted)}
.container{max-width:1400px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:20px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:8px}
.card-address{font-size:1.05rem;font-weight:600;flex:1}
.badge{padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.badge-closing{background:rgba(234,179,8,.15);color:var(--yellow)}
.badge-rehab{background:rgba(249,115,22,.15);color:var(--orange)}
.badge-inspections{background:rgba(168,85,247,.15);color:var(--purple)}
.badge-title{background:rgba(74,158,255,.15);color:var(--accent)}
.badge-closed{background:rgba(34,197,94,.15);color:var(--green)}
.badge-financing{background:rgba(74,158,255,.15);color:#60a5fa}
.badge-under-contract{background:rgba(168,85,247,.15);color:#c084fc}
.badge-prospecting{background:rgba(107,114,128,.15);color:#9ca3af}
.badge-offer{background:rgba(234,179,8,.15);color:#fbbf24}
.source-badges{display:flex;gap:4px;margin:6px 0 12px}
.src{padding:2px 6px;border-radius:4px;font-size:.6rem;background:rgba(255,255,255,0.08);color:var(--text-muted)}
.countdown{text-align:center;padding:8px;margin:8px 0;border-radius:8px;font-weight:600;font-size:.85rem}
.countdown.urgent{background:rgba(239,68,68,.12);color:var(--red)}
.countdown.soon{background:rgba(234,179,8,.12);color:var(--yellow)}
.countdown.ok{background:rgba(34,197,94,.12);color:var(--green)}
.countdown.past{background:rgba(239,68,68,.12);color:var(--red)}
.timeline{display:flex;align-items:center;gap:0;margin:12px 0;padding:8px;background:rgba(255,255,255,.03);border-radius:8px;overflow-x:auto}
.t-step{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;position:relative}
.t-dot{width:12px;height:12px;border-radius:50%;border:2px solid #333;position:relative;z-index:1}
.t-dot.completed{background:var(--green);border-color:var(--green)}
.t-dot.active{background:var(--accent);border-color:var(--accent);box-shadow:0 0 8px rgba(74,158,255,.5)}
.t-dot.pending{background:transparent;border-color:#444}
.t-label{font-size:.5rem;color:var(--text-muted);margin-top:4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.t-line{flex:0 0 auto;width:16px;height:2px;background:#333;margin:0 -1px;margin-bottom:14px}
.t-line.completed{background:var(--green)}
.section{margin-top:12px}
.section-title{font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.06)}
.section-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-item{font-size:.78rem}
.info-label{color:var(--text-muted);font-size:.65rem}
.action-item{font-size:.78rem;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04);display:flex;align-items:flex-start;gap:6px}
.action-item:last-child{border:none}
.action-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:6px;flex-shrink:0}
.action-dot.urgent{background:var(--red)}
.update-item{font-size:.75rem;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.update-item:last-child{border:none}
.update-date{color:var(--accent);font-size:.65rem;font-weight:600}
.loading{text-align:center;padding:60px;color:var(--text-muted);font-size:1.2rem}
@media(max-width:500px){.grid{grid-template-columns:1fr}.header{flex-direction:column;text-align:center}}
</style>
</head>
<body>
<div class="loading" id="loading">Loading dashboard...</div>
<script>
const MILESTONES=['Offer Made','Under Contract','Title & Escrow','Inspections','Appraisal','Financing','Repairs/Rehab','Final Walkthrough','Closing','Closed'];
function gmi(m){return MILESTONES.indexOf(m)}
function gbc(m){const map={'Closing':'closing','Repairs/Rehab':'rehab','Inspections':'inspections','Title & Escrow':'title','Closed':'closed','Financing':'financing','Under Contract':'under-contract','Prospecting':'prospecting','Offer Made':'offer'};return'badge-'+(map[m]||'title')}
function du(ds){if(!ds)return null;const t=new Date(ds+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);return Math.ceil((t-n)/864e5)}
function rcd(p,cd){if(!cd)return'';const d=du(cd);if(d===null)return'';let c='ok',t='';if(d<0){c='past';t=Math.abs(d)+' DAYS PAST CLOSING ('+cd+')'}else if(d===0){c='urgent';t='CLOSING TODAY!'}else if(d<=3){c='urgent';t=d+' DAY'+(d>1?'S':'')+' TO CLOSING'}else if(d<=14){c='soon';t=d+' days to closing ('+cd+')'}else{t=d+' days to closing ('+cd+')'}return'<div class="countdown '+c+'">'+t+'</div>'}
function rtl(cur){const idx=gmi(cur);let h='<div class="timeline">';MILESTONES.forEach((m,i)=>{if(i>0)h+='<div class="t-line '+(i<=idx?'completed':'')+'"></div>';let c='pending';if(i<idx)c='completed';else if(i===idx)c='active';h+='<div class="t-step"><div class="t-dot '+c+'"></div><div class="t-label">'+m.replace('Repairs/Rehab','Rehab')+'</div></div>'});h+='</div>';return h}
function rc(p){let h='<div class="card"><div class="card-header"><div class="card-address">'+p.address+'</div><span class="badge '+gbc(p.current_milestone)+'">'+p.current_milestone+'</span></div>';
h+='<div class="source-badges">'+(p.sources||[]).map(s=>'<span class="src">'+s+'</span>').join('')+'</div>';
h+=rcd(p,p.closing_date)+rtl(p.current_milestone);
const f=p.financials||{},fk=Object.keys(f).filter(k=>!Array.isArray(f[k])||f[k].length>0);
if(fk.length>0){h+='<div class="section"><div class="section-title">Financials</div><div class="section-grid">';fk.forEach(k=>{let v=f[k];if(Array.isArray(v))v=v.join(', ');h+='<div class="info-item"><div class="info-label">'+k.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase())+'</div>'+v+'</div>'});h+='</div></div>'}
if(p.contacts&&p.contacts.length>0){h+='<div class="section"><div class="section-title">Key Contacts</div><div class="section-grid">';p.contacts.forEach(c=>{h+='<div class="info-item"><div class="info-label">'+c.role+'</div>'+c.name+'</div>'});h+='</div></div>'}
if(p.action_items&&p.action_items.length>0){h+='<div class="section"><div class="section-title">Action Items</div>';p.action_items.forEach(a=>{const u=/URGENT|PAST DUE|ASAP|TODAY|TOMORROW/i.test(a);h+='<div class="action-item"><div class="action-dot '+(u?'urgent':'')+'"></div>'+a+'</div>'});h+='</div>'}
if(p.recent_updates&&p.recent_updates.length>0){h+='<div class="section"><div class="section-title">Recent Updates</div>';p.recent_updates.slice(0,3).forEach(u=>{h+='<div class="update-item"><span class="update-date">'+u.date+'</span> '+u.note+'</div>'});h+='</div>'}
h+='</div>';return h}
fetch('properties_data.json').then(r=>r.json()).then(DATA=>{
const props=DATA.properties;
const active=props.filter(p=>p.current_milestone!=='Closed'&&p.current_milestone!=='Prospecting');
const atC=props.filter(p=>p.current_milestone==='Closing');
const inR=props.filter(p=>p.current_milestone==='Repairs/Rehab');
const closed=props.filter(p=>p.current_milestone==='Closed');
document.body.innerHTML='<div class="header"><div><h1>House Flip Closing Coordinator</h1><div class="last-updated">Last updated: '+new Date(DATA.last_updated).toLocaleString('en-US',{timeZone:'America/New_York',dateStyle:'medium',timeStyle:'short'})+'</div></div><div class="header-stats"><div class="stat"><div class="stat-value" style="color:var(--accent)">'+active.length+'</div><div class="stat-label">Active</div></div><div class="stat"><div class="stat-value" style="color:var(--yellow)">'+atC.length+'</div><div class="stat-label">At Closing</div></div><div class="stat"><div class="stat-value" style="color:var(--orange)">'+inR.length+'</div><div class="stat-label">In Rehab</div></div><div class="stat"><div class="stat-value" style="color:var(--green)">'+closed.length+'</div><div class="stat-label">Closed</div></div></div></div><div class="container"><div class="grid" id="cards"></div></div>';
const order=['Closing','Inspections','Title & Escrow','Financing','Repairs/Rehab','Final Walkthrough','Under Contract','Offer Made','Prospecting','Closed'];
[...props].sort((a,b)=>(order.indexOf(a.current_milestone)===-1?99:order.indexOf(a.current_milestone))-(order.indexOf(b.current_milestone)===-1?99:order.indexOf(b.current_milestone))).forEach(p=>{document.getElementById('cards').innerHTML+=rc(p)})
}).catch(e=>{document.getElementById('loading').textContent='Error loading data: '+e.message});
</script>
</body>
</html>
