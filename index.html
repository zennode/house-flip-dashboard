<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Flip Closing Coordinator</title>
<style>
:root{--bg:#0f1117;--card-bg:#1a1d27;--border:#2a2e3d;--text:#e6e8ef;--muted:#8b90a3;--green:#34d399;--blue:#60a5fa;--gray:#4b5163;--amber:#fbbf24;--red:#f87171;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.45;}
header{position:sticky;top:0;z-index:50;background:rgba(15,17,23,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:16px;}
header h1{font-size:1.15rem;font-weight:700;}
#updated{color:var(--muted);font-size:.8rem;}
.stats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;}
.stat{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:6px 12px;text-align:center;}
.stat b{display:block;font-size:1.05rem;}
.stat span{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
main{max-width:1400px;margin:0 auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px;}
@media(max-width:480px){main{grid-template-columns:1fr;padding:12px;}}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;}
.card-top{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.addr{font-size:1.02rem;font-weight:700;}
.city{color:var(--muted);font-size:.8rem;}
.badges{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.badge{font-size:.66rem;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;}
.b-phase{background:rgba(96,165,250,.15);color:var(--blue);border:1px solid rgba(96,165,250,.4);}
.b-phase.closed{background:rgba(52,211,153,.15);color:var(--green);border-color:rgba(52,211,153,.4);}
.b-src{background:rgba(139,144,163,.12);color:var(--muted);border:1px solid var(--border);}
.countdown{font-size:.8rem;padding:7px 10px;border-radius:8px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:var(--amber);}
.countdown.overdue{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.35);color:var(--red);}
.timeline{display:flex;align-items:flex-start;}
.tl-step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;}
.tl-dot{width:13px;height:13px;border-radius:50%;background:var(--gray);z-index:2;}
.tl-step.done .tl-dot{background:var(--green);}
.tl-step.active .tl-dot{background:var(--blue);box-shadow:0 0 0 4px rgba(96,165,250,.25);}
.tl-step:not(:first-child)::before{content:"";position:absolute;top:6px;right:50%;width:100%;height:2px;background:var(--gray);z-index:1;}
.tl-step.done:not(:first-child)::before,.tl-step.active:not(:first-child)::before{background:var(--green);}
.tl-label{font-size:.56rem;color:var(--muted);margin-top:5px;text-align:center;max-width:60px;}
.tl-step.active .tl-label{color:var(--blue);font-weight:700;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:520px){.grid{grid-template-columns:1fr;}}
.sec{background:rgba(15,17,23,.5);border:1px solid var(--border);border-radius:8px;padding:10px;}
.sec h3{font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;}
.sec ul{list-style:none;font-size:.78rem;}
.sec li{padding:2px 0;color:var(--text);}
.sec li .k{color:var(--muted);}
.sec.wide{grid-column:1/-1;}
.upd{border-left:2px solid var(--blue);padding-left:8px;margin:5px 0;}
.upd .d{color:var(--muted);font-size:.68rem;}
.ai li{padding-left:14px;position:relative;}
.ai li::before{content:"\2192";position:absolute;left:0;color:var(--amber);}
.empty{color:var(--muted);font-size:.76rem;font-style:italic;}
#loading{text-align:center;padding:60px;color:var(--muted);grid-column:1/-1;}
</style>
</head>
<body>
<header>
  <div>
    <h1>&#127968; House Flip Closing Coordinator</h1>
    <div id="updated">Loading&hellip;</div>
  </div>
  <div class="stats" id="stats"></div>
</header>
<main id="main"><div id="loading">Loading properties&hellip;</div></main>
<script>
const PHASE_ORDER = {"Closing":0,"Under Contract":1,"Listed":2,"Demo/Rehab":3,"Repairs / Rehab":3,"Inspections":4,"Appraisal":4,"Financing":4,"Title & Escrow":4,"Acquired":5,"Offer Made":5,"Prospecting":6,"Closed":9};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmtMoney(v){if(v==null||v==="")return null;if(typeof v==="number")return "$"+v.toLocaleString();return String(v);}
function daysTo(dateStr){const d=new Date(dateStr+"T00:00:00");if(isNaN(d))return null;const now=new Date();now.setHours(0,0,0,0);return Math.round((d-now)/86400000);}
function findClosingDate(p){
  if(p.closing_date)return p.closing_date;
  if(Array.isArray(p.important_dates)){const m=p.important_dates.find(x=>/clos/i.test(x.label||""));if(m)return m.date;}
  if(p.important_dates&&typeof p.important_dates==="object"&&!Array.isArray(p.important_dates)){for(const k in p.important_dates){if(/clos/i.test(k))return p.important_dates[k];}}
  return null;
}
function sources(p){
  const s=new Set();if(p.source)s.add(p.source);
  (p.recent_updates||[]).forEach(u=>{if(u.source)s.add(u.source);});
  return [...s];
}
function timeline(p){
  const ms=p.milestones&&p.milestones.length?p.milestones:["Offer Made","Under Contract","Title & Escrow","Inspections","Appraisal","Financing","Repairs / Rehab","Final Walkthrough","Closing","Closed"];
  const done=new Set(p.completed_milestones||[]);
  return '<div class="timeline">'+ms.map(m=>{
    const cls=m===p.current_milestone?"active":(done.has(m)?"done":"");
    return '<div class="tl-step '+cls+'"><div class="tl-dot"></div><div class="tl-label">'+esc(m)+'</div></div>';
  }).join('')+'</div>';
}
function section(title,inner,wide){return '<div class="sec'+(wide?' wide':'')+'"><h3>'+title+'</h3>'+(inner||'<div class="empty">None</div>')+'</div>';}
function card(p){
  const closed=p.status==="closed"||p.current_milestone==="Closed";
  const cd=findClosingDate(p);let cdHtml="";
  if(cd&&!closed){const n=daysTo(cd);
    if(n!=null)cdHtml='<div class="countdown'+(n<0?' overdue':'')+'">&#9203; Closing '+esc(cd)+' &mdash; '+(n<0?Math.abs(n)+" days overdue":(n===0?"TODAY":n+" days away"))+'</div>';}
  const fin=p.financials||{};
  const finRows=Object.entries(fin).map(([k,v])=>{const m=fmtMoney(v);return m?'<li><span class="k">'+esc(k.replace(/_/g," "))+':</span> '+esc(m)+'</li>':''}).join('');
  const conRows=(p.contacts||[]).map(c=>'<li>'+esc(c.name)+(c.role?' <span class="k">&mdash; '+esc(c.role)+'</span>':'')+'</li>').join('');
  let dateRows="";
  if(Array.isArray(p.important_dates))dateRows=p.important_dates.map(x=>'<li><span class="k">'+esc(x.label)+':</span> '+esc(x.date)+'</li>').join('');
  else if(p.important_dates&&typeof p.important_dates==="object")dateRows=Object.entries(p.important_dates).map(([k,v])=>'<li><span class="k">'+esc(k.replace(/_/g," "))+':</span> '+esc(v)+'</li>').join('');
  if(cd&&!dateRows.includes(cd))dateRows+='<li><span class="k">closing:</span> '+esc(cd)+'</li>';
  const aiRows=(p.action_items||[]).map(a=>'<li>'+esc(a)+'</li>').join('');
  const upds=(p.recent_updates||[]).slice(-4).reverse().map(u=>'<div class="upd"><div class="d">'+esc(u.date)+(u.source?' &middot; '+esc(u.source):'')+'</div><div>'+esc(u.note)+'</div></div>').join('');
  const srcs=sources(p).map(s=>'<span class="badge b-src">'+esc(s)+'</span>').join('');
  return '<div class="card">'
    +'<div class="card-top"><div><div class="addr">'+esc(p.address)+'</div><div class="city">'+esc([p.city,p.state].filter(Boolean).join(", "))+'</div></div>'
    +'<div class="badges"><span class="badge b-phase'+(closed?' closed':'')+'">'+esc(p.current_milestone)+'</span>'+srcs+'</div></div>'
    +cdHtml+timeline(p)
    +'<div class="grid">'
    +section("Financials",finRows?'<ul>'+finRows+'</ul>':null)
    +section("Key Contacts",conRows?'<ul>'+conRows+'</ul>':null)
    +section("Important Dates",dateRows?'<ul>'+dateRows+'</ul>':null)
    +section("Action Items",aiRows?'<ul class="ai">'+aiRows+'</ul>':null)
    +section("Recent Updates",upds||null,true)
    +'</div></div>';
}
fetch("properties_data.json?cb="+Date.now()).then(r=>r.json()).then(data=>{
  const props=(data.properties||[]).slice().sort((a,b)=>(PHASE_ORDER[a.current_milestone]??7)-(PHASE_ORDER[b.current_milestone]??7));
  const active=props.filter(p=>p.status!=="closed"&&p.current_milestone!=="Closed");
  const atClosing=active.filter(p=>p.current_milestone==="Closing").length;
  const rehab=active.filter(p=>/rehab/i.test(p.current_milestone)).length;
  document.getElementById("stats").innerHTML=
    '<div class="stat"><b>'+active.length+'</b><span>Active</span></div>'
    +'<div class="stat"><b>'+atClosing+'</b><span>At Closing</span></div>'
    +'<div class="stat"><b>'+rehab+'</b><span>In Rehab</span></div>'
    +'<div class="stat"><b>'+(props.length-active.length)+'</b><span>Closed</span></div>';
  const lu=data.last_updated?new Date(data.last_updated):null;
  document.getElementById("updated").textContent="Last updated: "+(lu&&!isNaN(lu)?lu.toLocaleString("en-US",{timeZone:"America/New_York",dateStyle:"medium",timeStyle:"short"})+" ET":String(data.last_updated));
  document.getElementById("main").innerHTML=props.map(card).join("");
}).catch(e=>{document.getElementById("main").innerHTML='<div id="loading">Failed to load properties_data.json: '+esc(e.message)+'</div>';});
</script>
</body>
</html>
