:root {
--bg: #0f1117;
--card-bg: #1a1d27;
--text: #e2e8f0;
--text-muted: #94a3b8;
--accent: #3b82f6;
--green: #22c55e;
--yellow: #eab308;
--red: #ef4444;
--border: #2d3348;

* { margin: 0; padding: 0; box-sizing: border-box; }
body {

background: var(--bg);
color: var(--text);
line-height: 1.5;
}
header {
position: sticky;
top: 0;
z-index: 100;
background: rgba(15, 17, 23, 0.95);
backdrop-filter: blur(10px);
border-bottom: 1px solid var(--border);
padding: 16px 24px;
}
.header-content {
max-width: 1400px;
margin: 0 auto;
display: flex;
flex-wrap: wrap;
align-items: center;
justify-content: space-between;
gap: 12px;
}
.header-title h1 {
font-size: 1.4rem;
font-weight: 700;
color: var(--text);
}
.header-title .updated {
font-size: 0.8rem;
color: var(--text-muted);
}
.stats-badges {
display: flex;
gap: 10px;
flex-wrap: wrap;
}
.stat-badge {
padding: 6px 14px;
border-radius: 20px;
font-size: 0.8rem;
font-weight: 600;
}
.stat-badge.active { background: rgba(59,130,246,0.15); color: var(--accent); border: 1px solid rgba(59,130,246,0.3); }
.stat-badge.closing { background: rgba(234,179,8,0.15); color: var(--yellow); border: 1px solid rgba(234,179,8,0.3); }
.stat-badge.rehab { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
main {
max-width: 1400px;
margin: 0 auto;
padding: 24px;
display: flex;
flex-direction: column;
gap: 16px;
}
.section-label {
font-size: 0.85rem;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 0.05em;
color: var(--text-muted);
margin-top: 8px;
padding-bottom: 4px;
border-bottom: 1px solid var(--border);
}
.card {
background: var(--card-bg);
border: 1px solid var(--border);
border-radius: 12px;
padding: 20px;
}
.card-header {
display: flex;
flex-wrap: wrap;
align-items: flex-start;
justify-content: space-between;
gap: 8px;
margin-bottom: 12px;
}
.card-address {
font-size: 1.15rem;
font-weight: 700;
}
.badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.badge {
padding: 3px 10px;
border-radius: 12px;
font-size: 0.7rem;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 0.03em;
}
.badge-green { background: rgba(34,197,94,0.15); color: var(--green); }
.badge-blue { background: rgba(59,130,246,0.15); color: var(--accent); }
.badge-yellow { background: rgba(234,179,8,0.15); color: var(--yellow); }
.badge-red { background: rgba(239,68,68,0.15); color: var(--red); }
.badge-purple { background: rgba(168,85,247,0.15); color: #a855f7; }
.badge-orange { background: rgba(249,115,22,0.15); color: #f97316; }
.badge-gray { background: rgba(148,163,184,0.1); color: var(--text-muted); }
.source-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.source-badge { padding: 2px 8px; border-radius: 8px; font-size: 0.65rem; font-weight: 600; }
.countdown {
font-size: 0.85rem;
font-weight: 600;
margin-bottom: 12px;
}
.countdown.urgent { color: var(--red); }
.countdown.soon { color: var(--yellow); }
.countdown.normal { color: var(--green); }
.countdown.closed { color: var(--text-muted); }
.milestone-timeline {
display: flex;
align-items: flex-start;
gap: 0;
margin-bottom: 16px;
overflow-x: auto;
padding-bottom: 4px;
}
.milestone-step {
display: flex;
flex-direction: column;
align-items: center;
flex: 1;
min-width: 50px;
position: relative;
}
.milestone-dot {
width: 14px;
height: 14px;
border-radius: 50%;
margin-bottom: 4px;
flex-shrink: 0;
position: relative;
z-index: 2;
}
.milestone-dot.completed { background: var(--green); }
.milestone-dot.current { background: var(--accent); box-shadow: 0 0 0 4px rgba(59,130,246,0.25); }
.milestone-dot.future { background: var(--border); }
.milestone-label {
font-size: 0.55rem;
color: var(--text-muted);
text-align: center;
line-height: 1.2;
max-width: 60px;
}
.milestone-step:not(:last-child)::after {
content: '';
position: absolute;
top: 7px;
left: calc(50% + 7px);
right: calc(-50% + 7px);
height: 2px;
z-index: 1;
}
.milestone-step.step-completed:not(:last-child)::after { background: var(--green); }
.milestone-step.step-current:not(:last-child)::after { background: var(--border); }
.milestone-step.step-future:not(:last-child)::after { background: var(--border); }
.card-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
gap: 16px;
}
.card-section h3 {
font-size: 0.75rem;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 0.05em;
color: var(--text-muted);
margin-bottom: 8px;
}
.card-section { margin-bottom: 4px; }
.contact-item, .financial-item, .date-item {
font-size: 0.8rem;
padding: 3px 0;
color: var(--text);
}
.contact-role { color: var(--text-muted); font-size: 0.75rem; }
.action-item {
font-size: 0.8rem;
padding: 6px 10px;
margin-bottom: 4px;
background: rgba(234,179,8,0.08);
border-left: 3px solid var(--yellow);
border-radius: 0 6px 6px 0;
}
.update-item {
font-size: 0.78rem;
padding: 6px 0;
border-bottom: 1px solid rgba(45,51,72,0.5);
}
.update-item:last-child { border-bottom: none; }
.update-date {
font-size: 0.7rem;
color: var(--text-muted);
}
.update-source {
font-size: 0.6rem;
padding: 1px 6px;
border-radius: 6px;
margin-left: 6px;
}
.financial-key { color: var(--text-muted); font-size: 0.75rem; }
.financial-value { color: var(--text); font-weight: 600; }
@media (max-width: 768px) {
header { padding: 12px 16px; }
main { padding: 16px; }
.header-content { flex-direction: column; align-items: flex-start; }
.card-grid { grid-template-columns: 1fr; }
.card-address { font-size: 1rem; }
.milestone-label { font-size: 0.5rem; }
}
</style>
</head>

const STAGES = [
"Offer Made", "Under Contract", "Title & Escrow", "Inspections",
"Appraisal", "Financing", "Repairs / Rehab", "Final Walkthrough",
"Closing", "Closed"
];
const STAGE_ABBR = [
"Offer", "Contract", "Title", "Inspect",
"Appraise", "Finance", "Rehab", "Walkthru",
"Closing", "Closed"
];

function stageIndex(milestone) {
  if (milestone === "Prospecting") return -1;
  const idx = STAGES.indexOf(milestone);
  return idx >= 0 ? idx : -1;
}

function isActive(p) {
  return p.current_milestone !== "Closed" && p.current_milestone !== "Prospecting";
}

function parseClosingDate(d) {
  if (!d) return null;
  const parts = d.split('/');
  return new Date(parseInt(parts[2]), parseInt(parts[0])-1, parseInt(parts[1]));
}

function daysBetween(a, b) {
  return Math.ceil((b - a) / (1000*60*60*24));
}

function sortProperties(props) {
  const today = new Date(2026, 4, 23);
  const active = props.filter(p => isActive(p));
  const closed = props.filter(p => p.current_milestone === "Closed");
  const prospecting = props.filter(p => p.current_milestone === "Prospecting");

  active.sort((a, b) => {
    const da = parseClosingDate(a.closing_date);
    const db = parseClosingDate(b.closing_date);
    if (da && db) return da - db;
    if (da) return -1;
    if (db) return 1;
    return stageIndex(b.current_milestone) - stageIndex(a.current_milestone);
  });

  return [...active, ...closed, ...prospecting];
}

function sourceClass(s) {
  switch(s.toLowerCase()) {
    case 'dotloop': return 'badge-purple';
    case 'docusign': return 'badge-blue';
    case 'pdf': return 'badge-orange';
    default: return 'badge-gray';
  }
}

function milestoneClass(m) {
  if (m === 'Closed') return 'badge-green';
  if (m === 'Inspections') return 'badge-yellow';
  if (m === 'Prospecting') return 'badge-gray';
  return 'badge-blue';
}

function formatFinancialKey(k) {
  return k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function formatFinancialValue(v) {
  if (!isNaN(v) && v.length > 0) {
    return '$' + parseInt(v).toLocaleString();
  }
  return v;
}

function renderTimeline(milestone) {
  const idx = stageIndex(milestone);
  let html = '<div class="milestone-timeline">';
  for (let i = 0; i < STAGES.length; i++) {
    let stepClass = 'step-future';
    let dotClass = 'future';
    if (milestone === 'Prospecting') {
      dotClass = 'future';
      stepClass = 'step-future';
    } else if (i < idx) {
      dotClass = 'completed';
      stepClass = 'step-completed';
    } else if (i === idx) {
      dotClass = 'current';
      stepClass = 'step-current';
    }
    html += `<div class="milestone-step ${stepClass}">`;
    html += `<div class="milestone-dot ${dotClass}"></div>`;
    html += `<div class="milestone-label">${STAGE_ABBR[i]}</div>`;
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderCard(p) {
  const today = new Date(2026, 4, 23);
  let html = '<div class="card">';

  // Header
  html += '<div class="card-header">';
  html += `<span class="card-address">${p.address}</span>`;
  html += '<div class="badges">';
  html += `<span class="badge ${milestoneClass(p.current_milestone)}">${p.current_milestone}</span>`;
  html += '</div></div>';

  // Source badges
  html += '<div class="source-badges">';
  p.sources.forEach(s => {
    html += `<span class="source-badge ${sourceClass(s)}">${s}</span>`;
  });
  html += '</div>';

  // Countdown
  if (p.closing_date) {
    const cd = parseClosingDate(p.closing_date);
    if (p.current_milestone === 'Closed') {
      html += `<div class="countdown closed">CLOSED (${p.closing_date})</div>`;
    } else {
      const days = daysBetween(today, cd);
      let cls = 'normal';
      if (days < 0) cls = 'closed';
      else if (days <= 7) cls = 'urgent';
      else if (days <= 30) cls = 'soon';
      if (days < 0) {
        html += `<div class="countdown ${cls}">${Math.abs(days)} days past closing (${p.closing_date})</div>`;
      } else {
        html += `<div class="countdown ${cls}">${days} days to closing (${p.closing_date})</div>`;
      }
    }
  }

  // Timeline
  html += renderTimeline(p.current_milestone);

  // Card grid
  html += '<div class="card-grid">';

  // Financials
  const finKeys = Object.keys(p.financials || {});
  if (finKeys.length > 0) {
    html += '<div class="card-section"><h3>Financials</h3>';
    finKeys.forEach(k => {
      html += `<div class="financial-item"><span class="financial-key">${formatFinancialKey(k)}:</span> <span class="financial-value">${formatFinancialValue(p.financials[k])}</span></div>`;
    });
    html += '</div>';
  }

  // Contacts
  if (p.contacts && p.contacts.length > 0) {
    html += '<div class="card-section"><h3>Key Contacts</h3>';
    p.contacts.forEach(c => {
      html += `<div class="contact-item">${c.name} <span class="contact-role">- ${c.role}</span></div>`;
    });
    html += '</div>';
  }

  // Dates
  if (p.closing_date) {
    html += '<div class="card-section"><h3>Important Dates</h3>';
    html += `<div class="date-item">Closing: ${p.closing_date}</div>`;
    html += '</div>';
  }

  // Action items
  if (p.action_items && p.action_items.length > 0) {
    html += '<div class="card-section"><h3>Action Items</h3>';
    p.action_items.forEach(a => {
      html += `<div class="action-item">${a}</div>`;
    });
    html += '</div>';
  }

  // Recent updates (last 5)
  if (p.recent_updates && p.recent_updates.length > 0) {
    html += '<div class="card-section"><h3>Recent Updates</h3>';
    const updates = p.recent_updates.slice(0, 5);
    updates.forEach(u => {
      const text = u.subject || u.note || '';
      html += '<div class="update-item">';
      if (u.date) html += `<span class="update-date">${u.date}</span>`;
      html += `<span class="update-source source-badge ${sourceClass(u.source)}">${u.source}</span>`;
      html += `<div>${text}</div>`;
      html += '</div>';
    });
    html += '</div>';
  }

  html += '</div>'; // card-grid
  html += '</div>'; // card
  return html;
}

function render() {
  // Header
  const updated = new Date(DATA.last_updated);
  document.getElementById('lastUpdated').textContent =
    'Last updated: ' + updated.toLocaleString('en-US', {
      month: 'short', day: 'numeric', year: 'numeric',
      hour: 'numeric', minute: '2-digit', hour12: true, timeZoneName: 'short'
    });

  // Stats
  const activeProps = DATA.properties.filter(isActive);
  const closingProps = DATA.properties.filter(p => p.current_milestone === 'Closing');
  const rehabProps = DATA.properties.filter(p => p.current_milestone === 'Repairs / Rehab');
  document.getElementById('statsBadges').innerHTML =
    `<span class="stat-badge active">${activeProps.length} Active</span>` +
    `<span class="stat-badge closing">${closingProps.length} At Closing</span>` +
    `<span class="stat-badge rehab">${rehabProps.length} In Rehab</span>`;

  // Cards
  const sorted = sortProperties(DATA.properties);
  const main = document.getElementById('main');
  let html = '';

  const activeSorted = sorted.filter(isActive);
  const closedSorted = sorted.filter(p => p.current_milestone === 'Closed');
  const prospSorted = sorted.filter(p => p.current_milestone === 'Prospecting');

  if (activeSorted.length > 0) {
    html += '<div class="section-label">Active Properties</div>';
    activeSorted.forEach(p => { html += renderCard(p); });
  }
  if (closedSorted.length > 0) {
    html += '<div class="section-label">Closed</div>';
    closedSorted.forEach(p => { html += renderCard(p); });
  }
  if (prospSorted.length > 0) {
    html += '<div class="section-label">Prospecting</div>';
    prospSorted.forEach(p => { html += renderCard(p); });
  }

  main.innerHTML = html;
}

render();
</script>
