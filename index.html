<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Flip Closing Coordinator</title>
<style>
:root {
  --bg: #0f1117; --card-bg: #1a1d27; --card-border: #2a2d3a; --text: #e4e4e7;
  --text-muted: #9ca3af; --accent: #3b82f6; --success: #22c55e; --warning: #f59e0b;
  --danger: #ef4444; --purple: #a855f7; --orange: #f97316;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; line-height:1.5; }
.header { position:sticky; top:0; z-index:100; background:rgba(15,17,23,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--card-border); padding:16px 24px; }
.header-top { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
.header h1 { font-size:1.35rem; font-weight:700; letter-spacing:-.02em; }
.header-meta { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.updated { font-size:.8rem; color:var(--text-muted); }
.email-notice { font-size:.75rem; color:var(--warning); background:rgba(245,158,11,.1); padding:3px 10px; border-radius:20px; display:flex; align-items:center; gap:4px; }
.stats { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.stat { font-size:.78rem; padding:4px 12px; border-radius:20px; font-weight:600; }
.stat-total { background:rgba(59,130,246,.15); color:var(--accent); }
.stat-active { background:rgba(34,197,94,.15); color:var(--success); }
.stat-closed { background:rgba(156,163,175,.15); color:var(--text-muted); }
.stat-prospect { background:rgba(168,85,247,.15); color:var(--purple); }
.filters { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
.filter-btn { background:var(--card-bg); border:1px solid var(--card-border); color:var(--text-muted); padding:5px 14px; border-radius:20px; cursor:pointer; font-size:.8rem; transition:all .2s; }
.filter-btn:hover { border-color:var(--accent); color:var(--text); }
.filter-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.grid { display:grid; grid-template-columns:1fr; gap:16px; padding:20px 24px; max-width:1400px; margin:0 auto; }
@media(min-width:768px) { .grid { grid-template-columns:repeat(2,1fr); } }
@media(min-width:1100px) { .grid { grid-template-columns:repeat(3,1fr); } }
.card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:12px; padding:18px; transition:transform .2s, box-shadow .2s, border-color .2s; }
.card:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,.3); border-color:rgba(59,130,246,.3); }
.card-header { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:10px; }
.card-address { font-size:1.05rem; font-weight:700; }
.card-full-address { font-size:.72rem; color:var(--text-muted); margin-top:2px; }
.badges { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
.badge { font-size:.68rem; padding:2px 8px; border-radius:10px; font-weight:600; white-space:nowrap; }
.badge-closed { background:rgba(34,197,94,.15); color:var(--success); }
.badge-closing, .badge-title { background:rgba(59,130,246,.15); color:var(--accent); }
.badge-financing { background:rgba(245,158,11,.15); color:var(--warning); }
.badge-inspections { background:rgba(249,115,22,.15); color:var(--orange); }
.badge-under-contract { background:rgba(168,85,247,.15); color:var(--purple); }
.badge-rehab { background:rgba(239,68,68,.15); color:var(--danger); }
.badge-prospecting { background:rgba(156,163,175,.15); color:var(--text-muted); }
.source-badge { font-size:.62rem; padding:1px 6px; border-radius:8px; background:rgba(255,255,255,.06); color:var(--text-muted); }
.countdown { font-size:.78rem; margin-bottom:10px; padding:6px 10px; border-radius:8px; background:rgba(59,130,246,.08); display:flex; align-items:center; gap:6px; }
.countdown.past { background:rgba(34,197,94,.08); color:var(--success); }
.countdown.future { background:rgba(245,158,11,.08); color:var(--warning); }
.timeline { display:flex; gap:4px; margin:12px 0; align-items:center; position:relative; }
.dot-wrap { position:relative; display:flex; flex-direction:column; align-items:center; }
.dot { width:12px; height:12px; border-radius:50%; background:#333; transition:all .2s; cursor:default; flex-shrink:0; }
.dot.passed { background:var(--success); }
.dot.current { background:var(--accent); animation:pulse 2s infinite; }
.dot.future { background:#333; }
.dot-label { display:none; position:absolute; bottom:18px; font-size:.6rem; white-space:nowrap; background:var(--card-bg); border:1px solid var(--card-border); padding:2px 6px; border-radius:4px; color:var(--text-muted); z-index:10; }
.dot-wrap:hover .dot-label { display:block; }
.line { flex:1; height:2px; background:#333; min-width:4px; }
.line.passed { background:var(--success); }
@keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(59,130,246,.4); } 50%{ box-shadow:0 0 0 6px rgba(59,130,246,0); } }
.section { margin-top:12px; }
.section-title { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:600; margin-bottom:6px; }
.fin-grid { display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; font-size:.78rem; }
.fin-label { color:var(--text-muted); }
.fin-val { font-weight:600; }
.contact { font-size:.8rem; margin-bottom:2px; }
.contact-role { color:var(--text-muted); font-size:.7rem; }
.action-item { font-size:.8rem; padding:5px 8px; background:rgba(245,158,11,.08); border-left:3px solid var(--warning); border-radius:0 6px 6px 0; margin-bottom:4px; display:flex; align-items:flex-start; gap:6px; }
.action-icon { flex-shrink:0; }
.update { font-size:.78rem; padding:4px 0; border-bottom:1px solid rgba(255,255,255,.04); }
.update:last-child { border:none; }
.update-date { color:var(--text-muted); font-size:.7rem; }
.footer { text-align:center; padding:24px; color:var(--text-muted); font-size:.75rem; border-top:1px solid var(--card-border); margin-top:20px; }
.footer a { color:var(--accent); text-decoration:none; }
.footer a:hover { text-decoration:underline; }
.hidden { display:none !important; }
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <h1>House Flip Closing Coordinator</h1>
    <div class="header-meta">
      <span class="email-notice">&#9888; No new emails in last 12 hours</span>
      <span class="updated">Last updated: May 12, 2026 8:01 AM ET</span>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="filters" id="filters"></div>
</div>
<div class="grid" id="grid"></div>
<div class="footer">Auto-generated by House Flip Coordinator &middot; Data as of May 12, 2026 8:01 AM ET &middot; <a href="https://github.com" target="_blank">GitHub Repo</a></div>

<script>
const MILESTONES = ["Offer Made","Under Contract","Title & Escrow","Inspections","Appraisal","Financing","Repairs / Rehab","Final Walkthrough","Closing","Closed"];
const PHASE_BADGE = {"Closed":"badge-closed","Closing":"badge-closing","Title & Escrow":"badge-title","Financing":"badge-financing","Inspections":"badge-inspections","Under Contract":"badge-under-contract","Repairs / Rehab":"badge-rehab","Prospecting":"badge-prospecting"};
const FILTER_MAP = {"All":null,"Active":p=>!["Closed","Prospecting"].includes(p.current_milestone),"Closing":p=>p.current_milestone==="Closing","Rehab":p=>p.current_milestone==="Repairs / Rehab","Closed":p=>p.current_milestone==="Closed","Prospecting":p=>p.current_milestone==="Prospecting"};

const DATA=[{"address":"297 Breckwood Blvd, Springfield, MA 01109","current_milestone":"Closed","closing_date":"4/13/2026","sources":["dotloop","Email"],"contacts":[{"name":"Alice Kempf","role":"Agent"},{"name":"David Burstein","role":"Attorney"},{"name":"Jessica Sicard","role":"Project Manager"}],"financials":{},"recent_updates":[{"date":"2026-04-13","subject":"Closing date reached","source":"Email"},{"subject":"Repairs priority","source":"Email"},{"subject":"FHA Amendatory signed","source":"dotloop"}],"action_items":[]},{"address":"29 Chestnut Dr, Belchertown, MA 01007","current_milestone":"Closed","closing_date":"4/14/2026","sources":["dotloop","Email"],"contacts":[{"name":"Alice Kempf","role":"Agent"},{"name":"David Burstein","role":"Attorney"},{"name":"Jessica Sicard","role":"Project Manager"}],"financials":{},"recent_updates":[{"date":"2026-04-14","subject":"Closing date reached","source":"Email"}],"action_items":[]},{"address":"4 School St, Ware, MA 01082","current_milestone":"Financing","closing_date":null,"sources":["Email","PDF"],"contacts":[{"name":"David Burstein","role":"Attorney"},{"name":"Jessica Sicard","role":"Project Manager"}],"financials":{},"recent_updates":[{"date":"2026-04-28","subject":"Financing stage updates","source":"Email"}],"action_items":["Follow up on closing date once financing finalizes"]},{"address":"167 East Park Terrace, Pittsfield, MA 01201","current_milestone":"Financing","closing_date":"5/7/2026","sources":["Email","PDF"],"contacts":[{"name":"David Burstein","role":"Attorney"},{"name":"Jessica Sicard","role":"Project Manager"},{"name":"Will McGuire","role":"Borrower/Signer"}],"financials":{"purchase_price":"166000","construction_advance":"50000","points":"4980","rate":"12.00%","term":"12 months","lender_fees":"570"},"recent_updates":[{"date":"2026-05-03","subject":"David Burstein sent preliminary closing docs to Pinnacle; closing moved up to May 7","source":"Email"},{"date":"2026-04-29","subject":"Pinnacle Financial approved financing; checklist and funding sheet sent","source":"Email"},{"date":"2026-04-25","subject":"Insurance binder and financing docs in progress","source":"Email"},{"date":"2026-04-21","subject":"Pinnacle received financing request; proposed terms shared","source":"Email"}],"action_items":["GET INSURANCE BINDER TO PINNACLE ASAP - closing May 7","Provide tax identification numbers for borrower and guarantors","Will McGuire needs to sign loan package remotely","Overnight signed documents back to Burstein office"]},{"address":"70 Town Hill Road, Middlefield, MA 01243","current_milestone":"Closed","closing_date":null,"sources":["Email"],"contacts":[{"name":"Jessica Sicard","role":"Project Manager"}],"financials":{},"recent_updates":[{"date":"2026-04-20","subject":"Property closed","source":"Email"}],"action_items":[]},{"address":"40 Roland St, Pittsfield, MA 01201","current_milestone":"Closing","closing_date":null,"sources":["Email","dotloop"],"contacts":[{"name":"Alice Kempf","role":"Agent"},{"name":"David Burstein","role":"Attorney"},{"name":"Jessica Sicard","role":"Project Manager"}],"financials":{},"recent_updates":[{"date":"2026-05-09","subject":"Confirm new closing date","source":"Email"}],"action_items":["Confirm new closing date"]},{"address":"21 Holly St, Greenfield, MA","current_milestone":"Repairs / Rehab","closing_date":null,"sources":["Email"],"contacts":[{"name":"Jessica Sicard","role":"Project Manager"}],"financials":{},"recent_updates":[{"date":"2026-04-22","subject":"Rehab work in progress","source":"Email"}],"action_items":[]},{"address":"1874 Home Rd, Sheffield, MA","current_milestone":"Repairs / Rehab","closing_date":null,"sources":["Email"],"contacts":[{"name":"Jessica Sicard","role":"Project Manager"}],"financials":{},"recent_updates":[{"date":"2026-04-22","subject":"Rehab work in progress","source":"Email"}],"action_items":[]},{"address":"1 Richmond Ln, Pittsfield, MA","current_milestone":"Repairs / Rehab","closing_date":null,"sources":["Email"],"contacts":[{"name":"Jessica Sicard","role":"Project Manager"}],"financials":{},"recent_updates":[{"date":"2026-04-22","subject":"Rehab work in progress","source":"Email"}],"action_items":[]},{"address":"42 Washington St, Monson, MA 01057","current_milestone":"Repairs / Rehab","closing_date":null,"sources":["dotloop","Email"],"contacts":[{"name":"Alice Kempf","role":"Agent"},{"name":"Jessica Sicard","role":"Project Manager"}],"financials":{},"recent_updates":[{"date":"2026-05-01","subject":"6 listing documents signed via dotloop","source":"dotloop"}],"action_items":[]},{"address":"54 Sectar Rd, Ashford, CT 06278","current_milestone":"Under Contract","closing_date":null,"sources":["dotloop","Email"],"contacts":[{"name":"Alice Kempf","role":"Agent"},{"name":"Jessica Sicard","role":"Project Manager"}],"financials":{},"recent_updates":[{"date":"2026-05-01","subject":"Under contract; docs in dotloop","source":"dotloop"}],"action_items":[]},{"address":"282-284 Suffolk Street, Holyoke, MA","current_milestone":"Prospecting","closing_date":null,"sources":["Email"],"contacts":[],"financials":{},"recent_updates":[],"action_items":[]},{"address":"Egremont Project, Egremont, MA","current_milestone":"Prospecting","closing_date":null,"sources":["Email"],"contacts":[],"financials":{},"recent_updates":[],"action_items":[]},{"address":"213 Brodie Mountain Rd, Hancock, MA 01237","current_milestone":"Closed","closing_date":null,"sources":["Email"],"contacts":[],"financials":{},"recent_updates":[],"action_items":[]},{"address":"11 Bryant St, Springfield, MA","current_milestone":"Closed","closing_date":null,"sources":["Email"],"contacts":[{"name":"Jessica Sicard","role":"Project Manager"}],"financials":{},"recent_updates":[{"date":"2026-04-29","subject":"Detailed financial breakdown: YB owed $8,670.50 after settlement","source":"Email"}],"action_items":["Final payment approved; confirm listing date","Track YB settlement amount"]},{"address":"100 Central St (New Property)","current_milestone":"Repairs / Rehab","closing_date":null,"sources":["Email"],"contacts":[],"financials":{},"recent_updates":[{"date":"2026-04-24","subject":"New property acquired; rehab planning","source":"Email"}],"action_items":[]},{"address":"300 Tyler St, Pittsfield, MA 01201","current_milestone":"Title & Escrow","closing_date":null,"sources":["Email","PDF"],"contacts":[{"name":"David Burstein","role":"Attorney"},{"name":"Jessica Sicard","role":"Project Manager"}],"financials":{},"recent_updates":[{"date":"2026-05-05","subject":"Title work in progress","source":"Email"}],"action_items":[]},{"address":"166 East St, Stafford, CT 06076","current_milestone":"Under Contract","closing_date":null,"sources":["dotloop","Email"],"contacts":[{"name":"Alice Kempf","role":"Agent"}],"financials":{},"recent_updates":[{"date":"2026-05-08","subject":"Under contract; awaiting inspections","source":"Email"}],"action_items":[]},{"address":"583 Hawks Spur Rd, Plymouth, VT","current_milestone":"Prospecting","closing_date":null,"sources":["Email"],"contacts":[],"financials":{},"recent_updates":[],"action_items":[]},{"address":"103 Prospect St (Potential Sale)","current_milestone":"Inspections","closing_date":null,"sources":["Email"],"contacts":[],"financials":{},"recent_updates":[{"date":"2026-05-08","subject":"Potential buyer Hunter Foote in discussions","source":"Email"}],"action_items":["Await Hunter Foote settlement offer from Vanderburgh","Do NOT contact Code Enforcement - avoid prompting closer attention"]}];

function shortAddr(a){const p=a.split(',');return p[0].replace(/\s*\(.*\)/,'');}
function parseCd(d){if(!d)return null;const[m,day,y]=d.split('/');return new Date(y,m-1,day);}
function daysDiff(cd){const now=new Date(2026,4,12);const t=cd.getTime()-now.getTime();return Math.round(t/864e5);}
function fmt$(v){return '$'+Number(v).toLocaleString();}

const total=DATA.length;
const closed=DATA.filter(p=>p.current_milestone==='Closed').length;
const prospecting=DATA.filter(p=>p.current_milestone==='Prospecting').length;
const active=total-closed-prospecting;

document.getElementById('stats').innerHTML=`
  <span class="stat stat-total">${total} Properties</span>
  <span class="stat stat-active">${active} Active</span>
  <span class="stat stat-closed">${closed} Closed</span>
  <span class="stat stat-prospect">${prospecting} Prospecting</span>`;

const filtersEl=document.getElementById('filters');
Object.keys(FILTER_MAP).forEach((k,i)=>{
  const b=document.createElement('button');
  b.className='filter-btn'+(i===0?' active':'');
  b.textContent=k;b.dataset.filter=k;
  b.onclick=()=>{document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(k);};
  filtersEl.appendChild(b);
});

function buildTimeline(cm){
  const ci=MILESTONES.indexOf(cm);
  let h='';
  MILESTONES.forEach((m,i)=>{
    const cls=i<ci?'passed':i===ci?'current':'future';
    h+=`<div class="dot-wrap"><div class="dot ${cls}"></div><div class="dot-label">${m}</div></div>`;
    if(i<MILESTONES.length-1) h+=`<div class="line${i<ci?' passed':''}"></div>`;
  });
  return h;
}

function buildCard(p){
  const bc=PHASE_BADGE[p.current_milestone]||'badge-prospecting';
  const cd=parseCd(p.closing_date);
  const hasFin=Object.keys(p.financials).length>0;
  const finLabels={purchase_price:'Purchase Price',construction_advance:'Construction Advance',points:'Points',rate:'Rate',term:'Term',lender_fees:'Lender Fees'};

  let html=`<div class="card" data-milestone="${p.current_milestone}">`;
  html+=`<div class="card-header"><div><div class="card-address">${shortAddr(p.address)}</div><div class="card-full-address">${p.address}</div></div><div class="badges"><span class="badge ${bc}">${p.current_milestone}</span></div></div>`;
  html+=`<div class="badges" style="margin-bottom:4px">${p.sources.map(s=>`<span class="source-badge">${s}</span>`).join('')}</div>`;

  if(cd){
    const dd=daysDiff(cd);
    if(dd<0) html+=`<div class="countdown past">&#10003; Closed ${Math.abs(dd)} days ago (${p.closing_date})</div>`;
    else if(dd===0) html+=`<div class="countdown future">&#9888; Closing TODAY (${p.closing_date})</div>`;
    else html+=`<div class="countdown future">&#9200; ${dd} day${dd!==1?'s':''} until closing (${p.closing_date})</div>`;
  }

  html+=`<div class="timeline">${buildTimeline(p.current_milestone)}</div>`;

  if(hasFin){
    html+=`<div class="section"><div class="section-title">Financials</div><div class="fin-grid">`;
    for(const[k,v]of Object.entries(p.financials)){
      const display=k==='rate'||k==='term'?v:fmt$(v);
      html+=`<span class="fin-label">${finLabels[k]||k}</span><span class="fin-val">${display}</span>`;
    }
    html+=`</div></div>`;
  }

  if(p.contacts.length){
    html+=`<div class="section"><div class="section-title">Key Contacts</div>`;
    p.contacts.forEach(c=>{ html+=`<div class="contact">${c.name} <span class="contact-role">&middot; ${c.role}</span></div>`; });
    html+=`</div>`;
  }

  if(p.action_items.length){
    html+=`<div class="section"><div class="section-title">Action Items</div>`;
    p.action_items.forEach(a=>{ html+=`<div class="action-item"><span class="action-icon">&#9888;</span><span>${a}</span></div>`; });
    html+=`</div>`;
  }

  if(p.recent_updates.length){
    const show=p.recent_updates.slice(0,3);
    html+=`<div class="section"><div class="section-title">Recent Updates</div>`;
    show.forEach(u=>{
      html+=`<div class="update">${u.date?`<span class="update-date">${u.date}</span> `:''}${u.subject} <span class="source-badge">${u.source}</span></div>`;
    });
    html+=`</div>`;
  }

  html+=`</div>`;
  return html;
}

function render(filter){
  const fn=FILTER_MAP[filter];
  const filtered=fn?DATA.filter(fn):DATA;
  document.getElementById('grid').innerHTML=filtered.map(buildCard).join('');
}
render('All');
</script>
</body>
</html>
