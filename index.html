:root{--bg:#0f1117;--card-bg:#1a1d27;--card-border:#2a2d3a;--text:#e1e4ed;--text-muted:#8b8fa3;--accent:#4f8cff;--green:#34d399;--yellow:#fbbf24;--red:#f87171;--blue:#60a5fa;--purple:#a78bfa;--orange:#fb923c}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5}
.header{position:sticky;top:0;z-index:100;background:rgba(15,17,23,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--card-border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:1.25rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-meta{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.header-meta .stat{text-align:center}
.header-meta .stat-val{font-size:1.5rem;font-weight:700}
.header-meta .stat-label{font-size:0.7rem;text-transform:uppercase;color:var(--text-muted);letter-spacing:0.05em}
.header-meta .updated{font-size:0.75rem;color:var(--text-muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px;padding:24px;max-width:1600px;margin:0 auto}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:20px;transition:transform 0.15s,box-shadow 0.15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:8px}
.card-address{font-size:1rem;font-weight:600;flex:1}
.badge{padding:3px 10px;border-radius:20px;font-size:0.7rem;font-weight:600;text-transform:uppercase;white-space:nowrap}
.badge-closing{background:rgba(251,191,36,0.15);color:var(--yellow);border:1px solid rgba(251,191,36,0.3)}
.badge-rehab{background:rgba(79,140,255,0.15);color:var(--accent);border:1px solid rgba(79,140,255,0.3)}
.badge-contract{background:rgba(167,139,250,0.15);color:var(--purple);border:1px solid rgba(167,139,250,0.3)}
.badge-closed{background:rgba(52,211,153,0.15);color:var(--green);border:1px solid rgba(52,211,153,0.3)}
.badge-inspections{background:rgba(249,115,22,0.15);color:var(--orange);border:1px solid rgba(249,115,22,0.3)}
.badge-escrow{background:rgba(248,113,113,0.15);color:var(--red);border:1px solid rgba(248,113,113,0.3)}
.badge-financing{background:rgba(56,189,248,0.15);color:#38bdf8;border:1px solid rgba(56,189,248,0.3)}
.badge-prospecting{background:rgba(139,143,163,0.15);color:var(--text-muted);border:1px solid rgba(139,143,163,0.3)}
.source-badges{display:flex;gap:4px;margin:6px 0 12px}
.src{padding:2px 7px;border-radius:4px;font-size:0.6rem;font-weight:600;text-transform:uppercase;background:rgba(255,255,255,0.06);color:var(--text-muted)}
.countdown{font-size:0.8rem;color:var(--yellow);margin-bottom:10px;font-weight:500}
.timeline{display:flex;align-items:center;gap:0;margin:12px 0 16px;position:relative}
.dot-wrap{display:flex;flex-direction:column;align-items:center;flex:1;position:relative}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--card-border);background:var(--card-bg);position:relative;z-index:1}
.dot.completed{background:var(--green);border-color:var(--green)}
.dot.active{background:var(--accent);border-color:var(--accent);box-shadow:0 0 8px rgba(79,140,255,0.5)}
.dot-label{font-size:0.5rem;color:var(--text-muted);margin-top:4px;text-align:center;width:50px;line-height:1.1}
.line{position:absolute;top:7px;left:50%;right:-50%;height:2px;background:var(--card-border);z-index:0}
.line.completed{background:var(--green)}
.section{margin-top:12px}
.section-title{font-size:0.7rem;text-transform:uppercase;color:var(--text-muted);letter-spacing:0.05em;margin-bottom:6px;font-weight:600}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.detail-item{font-size:0.78rem}
.detail-item .label{color:var(--text-muted);font-size:0.65rem}
.contact{font-size:0.78rem;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.contact:last-child{border:none}
.contact .role{color:var(--text-muted);font-size:0.65rem}
.action-item{font-size:0.78rem;padding:4px 0 4px 14px;position:relative;border-bottom:1px solid rgba(255,255,255,0.04)}
.action-item:last-child{border:none}
.action-item::before{content:'';position:absolute;left:0;top:10px;width:6px;height:6px;border-radius:50%;background:var(--yellow)}
.action-item.urgent::before{background:var(--red)}
.update{font-size:0.75rem;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;gap:8px}
.update:last-child{border:none}
.update-date{color:var(--accent);font-size:0.65rem;white-space:nowrap;min-width:65px}
.update-note{color:var(--text-muted)}
@media(max-width:500px){.grid{grid-template-columns:1fr;padding:12px}.header{padding:12px}}
</style>
</head>

const MILESTONES = ['Offer Made','Under Contract','Title & Escrow','Inspections','Appraisal','Financing','Repairs/Rehab','Final Walkthrough','Closing','Closed'];

function getMilestoneIndex(m) {
  const idx = MILESTONES.indexOf(m);
  if (idx >= 0) return idx;
  if (m === 'Prospecting') return -1;
  return -1;
}

function getBadgeClass(m) {
  const map = {
    'Closing': 'badge-closing', 'Closed': 'badge-closed',
    'Repairs/Rehab': 'badge-rehab', 'Under Contract': 'badge-contract',
    'Inspections': 'badge-inspections', 'Title & Escrow': 'badge-escrow',
    'Financing': 'badge-financing', 'Prospecting': 'badge-prospecting',
    'Appraisal': 'badge-inspections', 'Final Walkthrough': 'badge-closing',
    'Offer Made': 'badge-contract'
  };
  return map[m] || 'badge-prospecting';
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.ceil((d - now) / 86400000);
}

function formatMoney(v) {
  if (typeof v === 'number') return '$' + v.toLocaleString();
  if (typeof v === 'string') return v.startsWith('$') ? v : '$' + v;
  return v;
}

function render() {
  const props = DATA.properties;
  const active = props.filter(p => !['Closed','Prospecting'].includes(p.current_milestone));
  const atClosing = props.filter(p => p.current_milestone === 'Closing');
  const inRehab = props.filter(p => p.current_milestone === 'Repairs/Rehab');

  // Sort: active first (by milestone desc), then closed, then prospecting
  const sorted = [...props].sort((a, b) => {
    const ai = getMilestoneIndex(a.current_milestone);
    const bi = getMilestoneIndex(b.current_milestone);
    if (a.current_milestone === 'Prospecting' && b.current_milestone !== 'Prospecting') return 1;
    if (b.current_milestone === 'Prospecting' && a.current_milestone !== 'Prospecting') return -1;
    if (a.current_milestone === 'Closed' && b.current_milestone !== 'Closed' && b.current_milestone !== 'Prospecting') return 1;
    if (b.current_milestone === 'Closed' && a.current_milestone !== 'Closed' && a.current_milestone !== 'Prospecting') return -1;
    return bi - ai;
  });

  const updated = new Date(DATA.last_updated);
  const updatedStr = updated.toLocaleString('en-US', {timeZone:'America/New_York', month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'});

  let html = `<div class="header">
    <h1>House Flip Closing Coordinator</h1>
    <div class="header-meta">
      <div class="stat"><div class="stat-val" style="color:var(--accent)">${active.length}</div><div class="stat-label">Active</div></div>
      <div class="stat"><div class="stat-val" style="color:var(--yellow)">${atClosing.length}</div><div class="stat-label">At Closing</div></div>
      <div class="stat"><div class="stat-val" style="color:var(--blue)">${inRehab.length}</div><div class="stat-label">In Rehab</div></div>
      <div class="stat"><div class="stat-val" style="color:var(--green)">${props.filter(p=>p.current_milestone==='Closed').length}</div><div class="stat-label">Closed</div></div>
      <div class="updated">Updated: ${updatedStr} ET</div>
    </div>
  </div><div class="grid">`;

  sorted.forEach(p => {
    const mi = getMilestoneIndex(p.current_milestone);
    const days = daysUntil(p.closing_date);

    html += `<div class="card">
      <div class="card-header">
        <div class="card-address">${p.address}</div>
        <span class="badge ${getBadgeClass(p.current_milestone)}">${p.current_milestone}</span>
      </div>
      <div class="source-badges">${(p.sources||[]).map(s=>`<span class="src">${s}</span>`).join('')}</div>`;

    if (days !== null) {
      const countdownColor = days <= 0 ? 'var(--green)' : days <= 7 ? 'var(--red)' : days <= 14 ? 'var(--yellow)' : 'var(--text-muted)';
      const countdownText = days <= 0 ? 'Closing day!' : days === 1 ? '1 day to closing' : `${days} days to closing`;
      html += `<div class="countdown" style="color:${countdownColor}">${countdownText} ${p.closing_date ? '(' + p.closing_date + ')' : ''}</div>`;
    }

    // Timeline
    if (mi >= 0) {
      html += `<div class="timeline">`;
      MILESTONES.forEach((ms, i) => {
        const cls = i < mi ? 'completed' : i === mi ? 'active' : '';
        const lineCls = i < mi ? 'completed' : '';
        html += `<div class="dot-wrap">
          <div class="dot ${cls}"></div>
          <div class="dot-label">${ms}</div>
          ${i < MILESTONES.length - 1 ? `<div class="line ${lineCls}"></div>` : ''}
        </div>`;
      });
      html += `</div>`;
    }

    // Financials
    const finKeys = Object.keys(p.financials || {});
    if (finKeys.length > 0) {
      html += `<div class="section"><div class="section-title">Financials</div><div class="detail-grid">`;
      finKeys.forEach(k => {
        const label = k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
        html += `<div class="detail-item"><div class="label">${label}</div>${formatMoney(p.financials[k])}</div>`;
      });
      html += `</div></div>`;
    }

    // Contacts
    if (p.contacts && p.contacts.length > 0) {
      html += `<div class="section"><div class="section-title">Key Contacts</div>`;
      p.contacts.slice(0, 5).forEach(c => {
        html += `<div class="contact">${c.name} <span class="role">â ${c.role}</span></div>`;
      });
      if (p.contacts.length > 5) html += `<div class="contact" style="color:var(--text-muted)">+${p.contacts.length - 5} more</div>`;
      html += `</div>`;
    }

    // Action Items
    if (p.action_items && p.action_items.length > 0) {
      html += `<div class="section"><div class="section-title">Action Items</div>`;
      p.action_items.forEach(a => {
        const urgent = a.toUpperCase().includes('URGENT');
        html += `<div class="action-item ${urgent?'urgent':''}">${a}</div>`;
      });
      html += `</div>`;
    }

    // Recent Updates
    if (p.recent_updates && p.recent_updates.length > 0) {
      html += `<div class="section"><div class="section-title">Recent Updates</div>`;
      p.recent_updates.slice(0, 4).forEach(u => {
        html += `<div class="update"><span class="update-date">${u.date || ''}</span><span class="update-note">${u.note}</span></div>`;
      });
      if (p.recent_updates.length > 4) html += `<div class="update"><span class="update-note" style="color:var(--accent)">+${p.recent_updates.length - 4} more updates</span></div>`;
      html += `</div>`;
    }

    html += `</div>`;
  });

  html += `</div>`;
  document.body.innerHTML = html;
}

render();
</script>
