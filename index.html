<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Flip Closing Coordinator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1117;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.header{position:sticky;top:0;z-index:100;background:#0f1117;border-bottom:1px solid #2d3140;padding:16px 24px}
.header-inner{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.header h1{font-size:22px;font-weight:700;color:#f3f4f6}
.header .meta{color:#6b7280;font-size:13px}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{background:#1a1d27;padding:8px 16px;border-radius:8px;text-align:center;min-width:100px}
.stat-value{font-size:24px;font-weight:700}
.stat-label{font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em}
.container{max-width:1400px;margin:0 auto;padding:20px 24px}
.card{background:#1a1d27;border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid #2d3140}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}
.card h2{margin:0;color:#f3f4f6;font-size:18px;font-weight:600}
.badge{padding:4px 12px;border-radius:16px;font-size:12px;font-weight:600;color:#fff}
.src-badge{padding:2px 8px;border-radius:10px;font-size:11px;margin-right:4px;color:#fff}
.countdown{font-weight:700;font-size:14px;margin:8px 0}
.timeline{position:relative;margin:12px 0}
.timeline-line{position:absolute;top:7px;left:0;right:0;height:2px;background:#374151;z-index:0}
.timeline-dots{display:flex;justify-content:space-between;position:relative;z-index:1}
.dot-wrap{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0}
.dot{width:14px;height:14px;border-radius:50%}
.dot-label{font-size:9px;color:#9ca3af;margin-top:4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.section-title{color:#9ca3af;font-size:12px;text-transform:uppercase;margin:0 0 8px 0;letter-spacing:.05em}
.update-date{color:#6b7280;font-size:11px}
.update-note{color:#d1d5db;font-size:12px}
.action-item{margin-bottom:3px}
.urgent{color:#fbbf24}
.normal{color:#e5e7eb}
.muted{color:#6b7280}
</style>
</head>
<body>
<div class="header"><div class="header-inner"><div><h1>House Flip Closing Coordinator</h1><div class="meta" id="meta">Loading...</div></div><div class="stats" id="stats"></div></div></div>
<div class="container" id="container"><p style="color:#9ca3af">Loading dashboard data...</p></div>
<script>
const MS=['Offer Made','Under Contract','Title & Escrow','Inspections','Appraisal','Financing','Repairs/Rehab','Final Walkthrough','Closing','Closed'];
const PC={'Prospecting':'#6b7280','Offer Made':'#f59e0b','Under Contract':'#3b82f6','Title & Escrow':'#8b5cf6','Inspections':'#06b6d4','Appraisal':'#14b8a6','Financing':'#10b981','Repairs/Rehab':'#f97316','Final Walkthrough':'#ec4899','Closing':'#ef4444','Closed':'#22c55e'};
const SC={'dotloop':'#4f46e5','DocuSign':'#f7c948','Email':'#6b7280','PDF':'#ef4444'};
const today=new Date();
function mi(m){if(m==='Prospecting')return -1;const i=MS.indexOf(m);return i>=0?i:-1;}
function du(d){if(!d)return null;const cd=new Date(d+'T12:00:00');return Math.floor((cd-today)/(864e5));}
function render(data){
const props=data.properties;
const active=props.filter(p=>p.current_milestone!=='Closed'&&p.current_milestone!=='Prospecting');
const closing=props.filter(p=>p.current_milestone==='Closing');
const rehab=props.filter(p=>p.current_milestone==='Repairs/Rehab');
const closed=props.filter(p=>p.current_milestone==='Closed');
document.getElementById('meta').innerHTML='Last updated: '+data.last_updated+' \u2022 '+props.length+' properties tracked';
document.getElementById('stats').innerHTML='<div class="stat"><div class="stat-value" style="color:#3b82f6">'+active.length+'</div><div class="stat-label">Active</div></div><div class="stat"><div class="stat-value" style="color:#ef4444">'+closing.length+'</div><div class="stat-label">At Closing</div></div><div class="stat"><div class="stat-value" style="color:#f97316">'+rehab.length+'</div><div class="stat-label">In Rehab</div></div><div class="stat"><div class="stat-value" style="color:#22c55e">'+closed.length+'</div><div class="stat-label">Closed</div></div>';
props.sort(function(a,b){
var pa=a.current_milestone,pb=b.current_milestone;
if(pa==='Closed'&&pb!=='Closed')return 1;if(pb==='Closed'&&pa!=='Closed')return -1;
if(pa==='Prospecting'&&pb!=='Prospecting')return 1;if(pb==='Prospecting'&&pa!=='Prospecting')return -1;
var da=du(a.closing_date),db=du(b.closing_date);
if(da!==null&&db!==null)return da-db;if(da!==null)return -1;if(db!==null)return 1;
return mi(a.current_milestone)-mi(b.current_milestone);});
var html='';
for(var i=0;i<props.length;i++){var p=props[i];
var phase=p.current_milestone;var d=du(p.closing_date);
var cd='';
if(d!==null){if(d<0)cd='<div class="countdown" style="color:#ef4444">CLOSING '+Math.abs(d)+' DAYS PAST DUE</div>';
else if(d===0)cd='<div class="countdown" style="color:#f59e0b">CLOSING TODAY</div>';
else cd='<div class="countdown" style="color:'+(d<=7?'#ef4444':d<=14?'#f59e0b':'#22c55e')+'">'+d+' DAYS TO CLOSING</div>';}
var dots='';var idx=mi(phase);
for(var j=0;j<MS.length;j++){
var c=phase==='Closed'||j<idx?'#22c55e':j===idx?'#3b82f6':'#374151';
var bdr=j===idx?'2px solid #fff':'2px solid '+c;
dots+='<div class="dot-wrap"><div class="dot" style="background:'+c+';border:'+bdr+'"></div><div class="dot-label" title="'+MS[j]+'">'+MS[j]+'</div></div>';}
var tl='<div class="timeline"><div class="timeline-line"></div><div class="timeline-dots">'+dots+'</div></div>';
var srcs=(p.sources||[]).map(function(s){return '<span class="src-badge" style="background:'+(SC[s]||'#6b7280')+'">'+s+'</span>';}).join('');
var fin='<span class="muted">\u2014</span>';
if(p.financials&&Object.keys(p.financials).length){fin=Object.entries(p.financials).map(function(e){
var l=e[0].replace(/_/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});
var val=Array.isArray(e[1])?e[1].join(', '):typeof e[1]==='boolean'?(e[1]?'Yes':'No'):e[1];
return '<div><span class="muted">'+l+':</span> <span style="color:#e5e7eb">'+val+'</span></div>';}).join('');}
var con='<span class="muted">\u2014</span>';
if(p.contacts&&p.contacts.length){con=p.contacts.slice(0,6).map(function(c){return '<div style="margin-bottom:2px"><span style="color:#e5e7eb">'+c.name+'</span> <span class="muted" style="font-size:11px">('+c.role+')</span></div>';}).join('');
if(p.contacts.length>6)con+='<div class="muted" style="font-size:11px">+'+(p.contacts.length-6)+' more</div>';}
var dates='<span class="muted">\u2014</span>';
if(p.closing_date)dates='<div><span class="muted">Closing:</span> <span style="color:#e5e7eb">'+p.closing_date+'</span></div>';
var actions='<span class="muted">\u2014</span>';
if(p.action_items&&p.action_items.length){actions=p.action_items.map(function(a){
var u=a.indexOf('URGENT')>=0||a.indexOf('PAST DUE')>=0||a.indexOf('TODAY')>=0;
return '<div class="action-item '+(u?'urgent':'normal')+'">'+(u?'\u26a0\ufe0f':'\u2022')+' '+a+'</div>';}).join('');}
var updates='<span class="muted">\u2014</span>';
if(p.recent_updates&&p.recent_updates.length){updates=p.recent_updates.slice(0,3).map(function(u){return '<div style="margin-bottom:4px"><span class="update-date">'+u.date+'</span> <span class="update-note">'+u.note+'</span></div>';}).join('');}
html+='<div class="card"><div class="card-header"><h2>'+p.address+'</h2><div style="display:flex;align-items:center;gap:8px"><span class="badge" style="background:'+(PC[phase]||'#6b7280')+'">'+phase+'</span>'+srcs+'</div></div>'+cd+tl+'<div class="grid"><div><h3 class="section-title">Financials</h3>'+fin+'</div><div><h3 class="section-title">Key Contacts</h3>'+con+'</div><div><h3 class="section-title">Important Dates</h3>'+dates+'</div></div><div class="grid2"><div><h3 class="section-title">Action Items</h3>'+actions+'</div><div><h3 class="section-title">Recent Updates</h3>'+updates+'</div></div></div>';}
document.getElementById('container').innerHTML=html;}
fetch('properties_data.json').then(function(r){return r.json();}).then(render).catch(function(e){document.getElementById('container').innerHTML='<p style="color:#ef4444">Error loading data: '+e.message+'</p>';});
</script>
</body>
</html>
