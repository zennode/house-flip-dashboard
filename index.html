<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Flip Closing Coordinator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--card-bg:#1a1d27;--border:#2a2d3a;--text:#e1e4ed;--text-muted:#8b8fa3;--accent:#4f8cff;--green:#34d399;--yellow:#fbbf24;--red:#f87171;--blue:#60a5fa;--purple:#a78bfa;--orange:#fb923c}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
.header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#141720,#1a1d2a);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-meta{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.stat{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:13px;display:flex;align-items:center;gap:6px}
.stat .num{font-weight:700;font-size:16px}
.stat.active .num{color:var(--accent)}
.stat.closing .num{color:var(--orange)}
.stat.rehab .num{color:var(--yellow)}
.stat.closed .num{color:var(--green)}
.updated{font-size:12px;color:var(--text-muted)}
.container{max-width:1400px;margin:0 auto;padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:18px;transition:border-color .2s}
.card:hover{border-color:var(--accent)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:8px}
.card-header h2{font-size:15px;font-weight:600;flex:1}
.badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
.badge-closed{background:rgba(52,211,153,.15);color:var(--green)}
.badge-closing{background:rgba(251,146,36,.15);color:var(--orange)}
.badge-rehab{background:rgba(251,191,36,.15);color:var(--yellow)}
.badge-financing{background:rgba(96,165,250,.15);color:var(--blue)}
.badge-contract{background:rgba(167,139,250,.15);color:var(--purple)}
.badge-inspections{background:rgba(248,113,113,.15);color:var(--red)}
.badge-title{background:rgba(79,140,255,.15);color:var(--accent)}
.badge-prospecting{background:rgba(139,143,163,.15);color:var(--text-muted)}
.source-badges{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.src{font-size:10px;padding:2px 7px;border-radius:4px;background:rgba(79,140,255,.1);color:var(--accent);border:1px solid rgba(79,140,255,.2)}
.countdown{font-size:12px;color:var(--orange);font-weight:600;margin-bottom:10px}
.countdown.overdue{color:var(--red)}
.timeline{display:flex;align-items:center;gap:3px;margin-bottom:14px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot.completed{background:var(--green)}
.dot.active{background:var(--blue);box-shadow:0 0 6px var(--blue)}
.dot.pending{background:#2a2d3a}
.dot-label{font-size:9px;color:var(--text-muted);margin-left:2px;margin-right:4px}
.section{margin-bottom:10px}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:6px;font-weight:600}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-row{font-size:12px;color:var(--text-muted);display:flex;justify-content:space-between;padding:2px 0}
.info-row span:last-child{color:var(--text);font-weight:500}
.contact{font-size:12px;padding:3px 0;border-bottom:1px solid rgba(42,45,58,.5)}
.contact:last-child{border:none}
.contact .role{color:var(--text-muted);font-size:11px}
.action-item{font-size:12px;padding:4px 0 4px 14px;position:relative;color:var(--yellow)}
.action-item::before{content:"!";position:absolute;left:0;font-weight:700;color:var(--orange)}
.update{font-size:12px;padding:4px 0;border-bottom:1px solid rgba(42,45,58,.3)}
.update:last-child{border:none}
.update .date{color:var(--accent);font-size:11px}
.update .src-tag{color:var(--text-muted);font-size:10px}
.section-group{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:900px){.cards{grid-template-columns:1fr}.section-group{grid-template-columns:1fr}}
</style>
</head>

function getBadgeClass(m){
  if(m==="Closed")return"badge-closed";
  if(m==="Closing")return"badge-closing";
  if(m==="Repairs / Rehab")return"badge-rehab";
  if(m==="Financing")return"badge-financing";
  if(m==="Under Contract")return"badge-contract";
  if(m==="Inspections")return"badge-inspections";
  if(m==="Title & Escrow")return"badge-title";
  if(m==="Prospecting")return"badge-prospecting";
  return"badge-contract";
}

function getCountdown(d){
  if(!d)return"";
  const parts=d.split("/");
  const cd=new Date(parseInt(parts[2]),parseInt(parts[0])-1,parseInt(parts[1]));
  const now=new Date();
  now.setHours(0,0,0,0);
  const diff=Math.ceil((cd-now)/(1000*60*60*24));
  if(diff<0)return`<div class="countdown overdue">Closing was ${Math.abs(diff)} days ago</div>`;
  if(diff===0)return`<div class="countdown">Closing TODAY</div>`;
  return`<div class="countdown">${diff} day${diff!==1?"s":""} to closing</div>`;
}

function renderTimeline(milestone){
  const idx=MILESTONES.indexOf(milestone);
  if(idx===-1)return`<div class="timeline"><span class="dot pending"></span><span class="dot-label">${milestone}</span></div>`;
  return`<div class="timeline">${MILESTONES.map((m,i)=>{
    let cls="pending";
    if(i<idx)cls="completed";
    if(i===idx)cls="active";
    return`<span class="dot ${cls}" title="${m}"></span>`;
  }).join("")}</div>`;
}

function fmt$(v){return v?"$"+Number(v).toLocaleString():"â"}

function renderCard(p){
  const fin=p.financials||{};
  const hasFin=Object.keys(fin).length>0;
  const contacts=p.contacts||[];
  const actions=p.action_items||[];
  const updates=(p.recent_updates||[]).slice(0,3);
  let html=`<div class="card">
    <div class="card-header">
      <h2>${p.address}</h2>
      <span class="badge ${getBadgeClass(p.current_milestone)}">${p.current_milestone}</span>
    </div>
    <div class="source-badges">${(p.sources||[]).map(s=>`<span class="src">${s}</span>`).join("")}</div>
    ${getCountdown(p.closing_date)}
    ${renderTimeline(p.current_milestone)}`;

  // Sections in 2-col grid
  html+=`<div class="section-group">`;

  // Financials
  if(hasFin){
    html+=`<div class="section"><div class="section-title">Financials</div>`;
    if(fin.purchase_price)html+=`<div class="info-row"><span>Purchase</span><span>${fmt$(fin.purchase_price)}</span></div>`;
    if(fin.rehab_budget)html+=`<div class="info-row"><span>Rehab</span><span>${fmt$(fin.rehab_budget)}</span></div>`;
    if(fin.total_loan)html+=`<div class="info-row"><span>Loan</span><span>${fmt$(fin.total_loan)}</span></div>`;
    if(fin.closing_costs)html+=`<div class="info-row"><span>Closing Costs</span><span>${fmt$(fin.closing_costs)}</span></div>`;
    if(fin.rate)html+=`<div class="info-row"><span>Rate</span><span>${fin.rate}</span></div>`;
    if(fin.term)html+=`<div class="info-row"><span>Term</span><span>${fin.term}</span></div>`;
    html+=`</div>`;
  }

  // Contacts
  if(contacts.length){
    html+=`<div class="section"><div class="section-title">Key Contacts</div>`;
    contacts.slice(0,4).forEach(c=>{html+=`<div class="contact">${c.name} <span class="role">Â· ${c.role}</span></div>`;});
    html+=`</div>`;
  }

  html+=`</div>`; // end section-group

  // Action Items
  if(actions.length){
    html+=`<div class="section"><div class="section-title">Action Items</div>`;
    actions.forEach(a=>{html+=`<div class="action-item">${a}</div>`;});
    html+=`</div>`;
  }

  // Recent Updates
  if(updates.length){
    html+=`<div class="section"><div class="section-title">Recent Updates</div>`;
    updates.forEach(u=>{html+=`<div class="update">${u.date?`<span class="date">${u.date}</span> `:""}${u.subject} <span class="src-tag">[${u.source}]</span></div>`;});
    html+=`</div>`;
  }

  html+=`</div>`;
  return html;
}

// Sort: active first (non-Closed, non-Prospecting), then Prospecting, then Closed
const active=DATA.properties.filter(p=>p.current_milestone!=="Closed"&&p.current_milestone!=="Prospecting");
const prospecting=DATA.properties.filter(p=>p.current_milestone==="Prospecting");
const closed=DATA.properties.filter(p=>p.current_milestone==="Closed");
const sorted=[...active,...prospecting,...closed];
document.getElementById("cards").innerHTML=sorted.map(renderCard).join("");
</script>
