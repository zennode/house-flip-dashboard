<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>House Flip Closing Coordinator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0f1117;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:0;}
.header{position:sticky;top:0;background:#0f1117ee;backdrop-filter:blur(10px);padding:16px 24px;border-bottom:1px solid #2a2d3a;z-index:100;}
.header h1{font-size:22px;color:#f9fafb;margin-bottom:4px;}
.header .meta{font-size:12px;color:#6b7280;}
.stats{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap;}
.stat{background:#1a1d27;padding:8px 16px;border-radius:8px;text-align:center;min-width:100px;}
.stat .num{font-size:24px;font-weight:800;color:#f3f4f6;}
.stat .label{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:0.5px;}
.container{max-width:1100px;margin:0 auto;padding:20px 16px;}
.card{background:#1a1d27;border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid #2a2d3a;}
.card h2{color:#f3f4f6;font-size:18px;margin:0 0 6px 0;font-weight:700;}
.badge{color:#fff;padding:3px 12px;border-radius:9999px;font-size:12px;font-weight:600;display:inline-block;}
.src-badge{color:#fff;padding:2px 8px;border-radius:9999px;font-size:11px;margin-right:4px;display:inline-block;}
.timeline{display:flex;justify-content:space-between;gap:2px;margin:12px 0;}
.tl-step{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;}
.tl-dot{width:14px;height:14px;border-radius:50%;margin-bottom:3px;}
.tl-label{font-size:9px;color:#9ca3af;text-align:center;line-height:1.1;word-break:break-word;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;}
.section-title{color:#d1d5db;font-size:12px;font-weight:700;margin-bottom:6px;}
.action-title{color:#fbbf24;font-size:12px;font-weight:700;margin-bottom:6px;}
.fin-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #2a2d3a;}
.fin-label{color:#9ca3af;font-size:12px;}
.fin-val{color:#e5e7eb;font-size:12px;font-weight:600;}
.contact{font-size:12px;color:#d1d5db;padding:2px 0;}
.contact .role{color:#6b7280;}
.action{font-size:12px;color:#fbbf24;padding:3px 0;padding-left:12px;position:relative;}
.action::before{content:'â¡';position:absolute;left:0;}
.update{font-size:11px;color:#9ca3af;padding:3px 0;border-bottom:1px solid #1f2230;}
.update .date{color:#6b7280;}
.update .text{color:#d1d5db;}
.update .src{background:#1f2937;padding:1px 5px;border-radius:3px;font-size:10px;}
.countdown{font-weight:700;font-size:13px;}
</style>
</head>
<body>
<div class="header">
<h1>House Flip Closing Coordinator</h1>
<div class="meta" id="meta"></div>
<div class="stats" id="stats"></div>
</div>
<div class="container" id="container"></div>
<script>
const MS=['Offer Made','Under Contract','Title & Escrow','Inspections','Appraisal','Financing','Repairs / Rehab','Final Walkthrough','Closing','Closed'];
const MI={};MS.forEach((m,i)=>MI[m]=i);
const PC={'Prospecting':'#6b7280','Offer Made':'#8b5cf6','Under Contract':'#3b82f6','Title & Escrow':'#06b6d4','Inspections':'#f59e0b','Appraisal':'#f97316','Financing':'#ef4444','Repairs / Rehab':'#10b981','Final Walkthrough':'#14b8a6','Closing':'#ec4899','Closed':'#22c55e'};
const SC={'dotloop':'#4f46e5','DocuSign':'#f59e0b','PDF':'#ef4444','Email':'#6b7280'};
function dtc(cd){if(!cd)return null;const p=cd.split('/');const c=new Date(+p[2],+p[0]-1,+p[1]);const t=new Date();t.setHours(0,0,0,0);return Math.ceil((c-t)/(86400000));}
function fmt(v){try{const n=parseInt(v);return isNaN(n)?v:'$'+n.toLocaleString();}catch(e){return v;}}
function render(data){
document.getElementById('meta').innerHTML='Last updated: '+new Date(data.last_updated).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short',timeZone:'America/New_York'})+' EDT &nbsp;|&nbsp; Dashboard auto-refreshes via GitHub Pages';
const props=data.properties;
const active=props.filter(p=>p.current_milestone!=='Closed'&&p.current_milestone!=='Prospecting').length;
const closing=props.filter(p=>['Closing','Final Walkthrough'].includes(p.current_milestone)).length;
const rehab=props.filter(p=>p.current_milestone==='Repairs / Rehab').length;
const closed=props.filter(p=>p.current_milestone==='Closed').length;
document.getElementById('stats').innerHTML=`<div class="stat"><div class="num">${active}</div><div class="label">Active Properties</div></div><div class="stat"><div class="num">${closing}</div><div class="label">At Closing</div></div><div class="stat"><div class="num">${rehab}</div><div class="label">In Rehab</div></div><div class="stat"><div class="num" style="color:#22c55e">${closed}</div><div class="label">Closed</div></div>`;
const sorted=[...props].sort((a,b)=>{const am=a.current_milestone,bm=b.current_milestone;if(am==='Closed'&&bm!=='Closed')return 1;if(am!=='Closed'&&bm==='Closed')return -1;if(am==='Prospecting'&&bm!=='Prospecting')return 1;if(am!=='Prospecting'&&bm==='Prospecting')return -1;return(MI[bm]||0)-(MI[am]||0);});
let html='';
sorted.forEach(p=>{
const m=p.current_milestone,cd=p.closing_date,d=dtc(cd);
let cdown='';
if(d!==null&&m!=='Closed'){if(d<=0)cdown='<span class="countdown" style="color:#ef4444">CLOSING TODAY / PAST DUE</span>';else if(d<=7)cdown=`<span class="countdown" style="color:#f59e0b">${d} day${d!==1?'s':''} to closing</span>`;else cdown=`<span style="color:#9ca3af;font-size:13px">${d} days to closing</span>`;}
const sbadges=(p.sources||[]).map(s=>`<span class="src-badge" style="background:${SC[s]||'#6b7280'}">${s}</span>`).join('');
let tl='';
MS.forEach((ms,i)=>{const idx=MI[m]??-1;let bg,bdr;if(m==='Prospecting'){bg='#374151';bdr=bg;}else if(i<idx){bg='#22c55e';bdr='#22c55e';}else if(i===idx){bg='#3b82f6';bdr='#3b82f6';}else{bg='#374151';bdr=bg;}tl+=`<div class="tl-step"><div class="tl-dot" style="background:${bg};border:2px solid ${bdr}"></div><span class="tl-label">${ms.replace('Repairs / Rehab','Rehab')}</span></div>`;});
const fins=p.financials||{};const fl={'purchase_price':'Purchase Price','rehab_budget':'Rehab Budget','total_loan':'Total Loan','funds_at_closing':'Funds at Closing','construction_advance':'Construction Advance','points':'Points','rate':'Rate','term':'Term','lender_fees':'Lender Fees','closing_costs':'Closing Costs'};
let fhtml='';if(Object.keys(fins).length){fhtml='<div style="margin-top:10px"><div class="section-title">FINANCIALS</div>'+Object.entries(fins).map(([k,v])=>`<div class="fin-row"><span class="fin-label">${fl[k]||k}</span><span class="fin-val">${!['rate','term'].includes(k)?fmt(v):v}</span></div>`).join('')+'</div>';}
let chtml='';const contacts=p.contacts||[];if(contacts.length){chtml='<div style="margin-top:10px"><div class="section-title">KEY CONTACTS</div>'+contacts.map(c=>`<div class="contact">${c.name} <span class="role">â ${c.role}</span></div>`).join('')+'</div>';}
let dhtml='';if(cd){dhtml=`<div style="margin-top:10px"><div class="section-title">IMPORTANT DATES</div><div class="fin-row"><span class="fin-label">Closing Date</span><span class="fin-val">${cd}</span></div></div>`;}
let ahtml='';const actions=p.action_items||[];if(actions.length){ahtml='<div style="margin-top:10px"><div class="action-title">ACTION ITEMS</div>'+actions.map(a=>`<div class="action">${a}</div>`).join('')+'</div>';}
let uhtml='';const updates=(p.recent_updates||[]).slice(0,4);if(updates.length){uhtml='<div style="margin-top:10px"><div class="section-title">RECENT UPDATES</div>'+updates.map(u=>`<div class="update"><span class="date">[${u.date||''}]</span> <span class="text">${u.subject}</span> <span class="src">${u.source||''}</span></div>`).join('')+'</div>';}
html+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px"><div><h2>${p.address}</h2><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="badge" style="background:${PC[m]||'#6b7280'}">${m}</span>${sbadges}</div></div><div style="text-align:right">${cdown}</div></div><div class="timeline">${tl}</div><div class="grid"><div>${fhtml}${chtml}</div><div>${dhtml}${ahtml}${uhtml}</div></div></div>`;
});
document.getElementById('container').innerHTML=html;
}
fetch('properties_data.json').then(r=>r.json()).then(render).catch(e=>{document.getElementById('container').innerHTML='<p style="color:#ef4444">Error loading data: '+e.message+'</p>';});
</script>
</body>
</html>
