<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Flip Closing Coordinator</title>
<style>
:root {
  --bg: #0f1117;
  --card-bg: #1a1d27;
  --text: #e2e8f0;
  --text-muted: #94a3b8;
  --accent: #3b82f6;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --border: #2a2d3a;
  --card-hover: #1e2130;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  line-height: 1.6;
  min-height: 100vh;
}

/* Header */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: linear-gradient(180deg, #0f1117 0%, rgba(15,17,23,0.97) 100%);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
}

.header-inner {
  max-width: 1400px;
  margin: 0 auto;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
}

.header .last-updated {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.stats-bar {
  display: flex;
  gap: 16px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.stat-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 0.85rem;
}

.stat-chip .stat-num {
  font-size: 1.3rem;
  font-weight: 700;
}

.stat-chip.active .stat-num { color: var(--accent); }
.stat-chip.closing .stat-num { color: var(--danger); }
.stat-chip.rehab .stat-num { color: var(--warning); }

/* Cards container */
.cards-container {
  max-width: 1400px;
  margin: 24px auto;
  padding: 0 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.section-label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  margin-top: 12px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}

/* Property Card */
.property-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  transition: border-color 0.2s;
}

.property-card:hover {
  border-color: #3a3d4a;
}

.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}

.card-address {
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--text);
}

.badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}

.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.badge-stage { color: #fff; }
.badge-stage.green { background: var(--success); }
.badge-stage.blue { background: var(--accent); }
.badge-stage.orange { background: var(--warning); color: #000; }
.badge-stage.red { background: var(--danger); }
.badge-stage.gray { background: #4b5563; }
.badge-stage.purple { background: #8b5cf6; }

.badge-source {
  background: rgba(255,255,255,0.07);
  color: var(--text-muted);
  border: 1px solid var(--border);
  font-size: 0.65rem;
  padding: 2px 8px;
}

.countdown {
  font-size: 0.8rem;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 6px;
  white-space: nowrap;
}

.countdown.overdue { background: rgba(239,68,68,0.15); color: var(--danger); }
.countdown.soon { background: rgba(245,158,11,0.15); color: var(--warning); }
.countdown.ok { background: rgba(59,130,246,0.12); color: var(--accent); }

/* Timeline */
.timeline-wrapper {
  margin: 16px 0 20px 0;
  overflow-x: auto;
  padding-bottom: 4px;
}

.timeline {
  display: flex;
  align-items: flex-start;
  gap: 0;
  min-width: 640px;
  position: relative;
}

.timeline-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  position: relative;
}

.timeline-dot-row {
  display: flex;
  align-items: center;
  width: 100%;
  justify-content: center;
  position: relative;
}

.timeline-line {
  flex: 1;
  height: 2px;
  background: var(--border);
}

.timeline-line.completed { background: var(--success); }
.timeline-line.left { margin-right: -1px; }
.timeline-line.right { margin-left: -1px; }

.timeline-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  flex-shrink: 0;
  z-index: 1;
  border: 2px solid transparent;
}

.timeline-dot.completed { background: var(--success); border-color: var(--success); }
.timeline-dot.active { background: var(--accent); border-color: var(--accent); animation: pulse 2s infinite; }
.timeline-dot.future { background: #2a2d3a; border-color: #3a3d4a; }

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0.5); }
  50% { box-shadow: 0 0 0 6px rgba(59,130,246,0); }
}

.timeline-label {
  font-size: 0.6rem;
  color: var(--text-muted);
  text-align: center;
  margin-top: 6px;
  line-height: 1.2;
  max-width: 70px;
}

.timeline-label.active { color: var(--accent); font-weight: 600; }
.timeline-label.completed { color: var(--success); }

/* Card body grid */
.card-body {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
}

.card-section {
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}

.card-section h4 {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: 10px;
  font-weight: 600;
}

/* Financials */
.kv-list { list-style: none; }
.kv-list li {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  font-size: 0.82rem;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.kv-list li:last-child { border-bottom: none; }
.kv-key { color: var(--text-muted); }
.kv-val { color: var(--text); font-weight: 500; }

/* Contacts */
.contact-item {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  font-size: 0.82rem;
}
.contact-name { color: var(--text); }
.contact-role { color: var(--text-muted); font-size: 0.75rem; }

/* Action items */
.action-list { list-style: none; }
.action-list li {
  position: relative;
  padding: 4px 0 4px 16px;
  font-size: 0.82rem;
  color: var(--text);
}
.action-list li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 11px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}
.action-list li.urgent { color: var(--danger); font-weight: 600; }
.action-list li.urgent::before { background: var(--danger); }

/* Updates */
.update-item {
  padding: 5px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: 0.8rem;
}
.update-item:last-child { border-bottom: none; }
.update-date {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-right: 6px;
}
.update-subject { color: var(--text); }

.expand-toggle {
  background: none;
  border: none;
  color: var(--accent);
  cursor: pointer;
  font-size: 0.78rem;
  padding: 6px 0 0;
  text-decoration: underline;
}
.expand-toggle:hover { color: #60a5fa; }

.hidden { display: none; }

.empty-note {
  font-size: 0.8rem;
  color: var(--text-muted);
  font-style: italic;
}

/* Responsive */
@media (max-width: 768px) {
  .header { padding: 12px 16px; }
  .header h1 { font-size: 1.15rem; }
  .cards-container { padding: 0 12px; }
  .property-card { padding: 16px; }
  .card-body { grid-template-columns: 1fr; }
  .timeline { min-width: 500px; }
  .stat-chip { padding: 6px 10px; font-size: 0.8rem; }
  .stat-chip .stat-num { font-size: 1.1rem; }
}
</style>

const MILESTONES = [
  "Offer Made", "Under Contract", "Title & Escrow", "Inspections",
  "Appraisal", "Financing", "Repairs / Rehab", "Final Walkthrough",
  "Closing", "Closed"
];

const STAGE_COLORS = {
  "Closed": "green",
  "Under Contract": "blue",
  "Inspections": "blue",
  "Financing": "blue",
  "Title & Escrow": "blue",
  "Repairs / Rehab": "orange",
  "Appraisal": "blue",
  "Final Walkthrough": "blue",
  "Closing": "red",
  "Prospecting": "gray",
  "Offer Made": "purple"
};

function milestoneIndex(m) {
  return MILESTONES.indexOf(m);
}

function formatFinKey(k) {
  return k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function formatFinVal(v) {
  if (/^\d+$/.test(v)) {
    return '$' + Number(v).toLocaleString();
  }
  return v;
}

function daysUntil(dateStr) {
  const parts = dateStr.split('/');
  const d = new Date(parts[2], parts[0] - 1, parts[1]);
  const now = new Date(2026, 4, 23); // 2026-05-23
  return Math.ceil((d - now) / (1000 * 60 * 60 * 24));
}

function renderTimeline(currentMilestone) {
  const idx = milestoneIndex(currentMilestone);
  let html = '<div class="timeline-wrapper"><div class="timeline">';
  for (let i = 0; i < MILESTONES.length; i++) {
    let dotClass = 'future';
    let labelClass = '';
    if (idx >= 0) {
      if (i < idx) { dotClass = 'completed'; labelClass = 'completed'; }
      else if (i === idx) { dotClass = 'active'; labelClass = 'active'; }
    }
    // For "Closed", all are completed
    if (currentMilestone === 'Closed') {
      dotClass = 'completed'; labelClass = 'completed';
    }

    let leftLine = '', rightLine = '';
    if (i > 0) {
      let lc = 'timeline-line left';
      if (currentMilestone === 'Closed' || i <= idx) lc += ' completed';
      leftLine = `<div class="${lc}"></div>`;
    }
    if (i < MILESTONES.length - 1) {
      let rc = 'timeline-line right';
      if (currentMilestone === 'Closed' || i < idx) rc += ' completed';
      rightLine = `<div class="${rc}"></div>`;
    }

    html += `<div class="timeline-step">
      <div class="timeline-dot-row">
        ${leftLine}
        <div class="timeline-dot ${dotClass}"></div>
        ${rightLine}
      </div>
      <div class="timeline-label ${labelClass}">${MILESTONES[i]}</div>
    </div>`;
  }
  html += '</div></div>';
  return html;
}

function isUrgent(text) {
  return /DAYS? AWAY|urgent|ASAP|immediately|overdue/i.test(text);
}

function renderCard(p) {
  const stageColor = STAGE_COLORS[p.current_milestone] || 'gray';
  let countdown = '';
  if (p.closing_date && p.current_milestone !== 'Closed') {
    const days = daysUntil(p.closing_date);
    let cls = 'ok';
    let label = '';
    if (days < 0) { cls = 'overdue'; label = `${Math.abs(days)} days overdue`; }
    else if (days === 0) { cls = 'overdue'; label = 'Closing TODAY'; }
    else if (days <= 7) { cls = 'soon'; label = `${days} days to closing`; }
    else { label = `${days} days to closing`; }
    countdown = `<span class="countdown ${cls}">${label}</span>`;
  }

  const sourceBadges = (p.sources || []).map(s =>
    `<span class="badge badge-source">${s}</span>`
  ).join('');

  // Financials
  const finKeys = Object.keys(p.financials || {});
  let financialsHTML = '';
  if (finKeys.length > 0) {
    financialsHTML = `<div class="card-section"><h4>Financials</h4><ul class="kv-list">` +
      finKeys.map(k => `<li><span class="kv-key">${formatFinKey(k)}</span><span class="kv-val">${formatFinVal(p.financials[k])}</span></li>`).join('') +
      `</ul></div>`;
  }

  // Contacts
  let contactsHTML = '';
  if (p.contacts && p.contacts.length > 0) {
    contactsHTML = `<div class="card-section"><h4>Key Contacts</h4>` +
      p.contacts.map(c => `<div class="contact-item"><span class="contact-name">${c.name}</span><span class="contact-role">${c.role}</span></div>`).join('') +
      `</div>`;
  }

  // Important dates
  let datesHTML = '';
  const dates = [];
  if (p.closing_date) dates.push({ label: 'Closing Date', value: p.closing_date });
  if (dates.length > 0) {
    datesHTML = `<div class="card-section"><h4>Important Dates</h4><ul class="kv-list">` +
      dates.map(d => `<li><span class="kv-key">${d.label}</span><span class="kv-val">${d.value}</span></li>`).join('') +
      `</ul></div>`;
  }

  // Action items
  let actionsHTML = '';
  if (p.action_items && p.action_items.length > 0) {
    actionsHTML = `<div class="card-section"><h4>Action Items</h4><ul class="action-list">` +
      p.action_items.map(a => `<li class="${isUrgent(a) ? 'urgent' : ''}">${a}</li>`).join('') +
      `</ul></div>`;
  }

  // Recent updates
  let updatesHTML = '';
  if (p.recent_updates && p.recent_updates.length > 0) {
    const MAX_SHOW = 5;
    const items = p.recent_updates.map((u, i) => {
      const text = u.subject || u.note || '';
      const dateStr = u.date ? `<span class="update-date">${u.date}</span>` : '';
      const hidden = i >= MAX_SHOW ? ' hidden' : '';
      return `<div class="update-item${hidden}" data-extra="${i >= MAX_SHOW ? '1' : ''}">${dateStr}<span class="update-subject">${text}</span></div>`;
    }).join('');
    const toggle = p.recent_updates.length > MAX_SHOW
      ? `<button class="expand-toggle" onclick="toggleUpdates(this)">Show ${p.recent_updates.length - MAX_SHOW} more</button>`
      : '';
    updatesHTML = `<div class="card-section" style="grid-column: 1 / -1;"><h4>Recent Updates</h4>${items}${toggle}</div>`;
  }

  return `<div class="property-card">
    <div class="card-header">
      <div>
        <div class="card-address">${p.address}</div>
        <div class="badges" style="margin-top:6px">
          <span class="badge badge-stage ${stageColor}">${p.current_milestone}</span>
          ${sourceBadges}
          ${countdown}
        </div>
      </div>
    </div>
    ${renderTimeline(p.current_milestone)}
    <div class="card-body">
      ${financialsHTML}
      ${contactsHTML}
      ${datesHTML}
      ${actionsHTML}
      ${updatesHTML}
    </div>
  </div>`;
}

function toggleUpdates(btn) {
  const section = btn.parentElement;
  const extras = section.querySelectorAll('.update-item[data-extra="1"]');
  const showing = !extras[0].classList.contains('hidden');
  extras.forEach(el => el.classList.toggle('hidden'));
  btn.textContent = showing ? `Show ${extras.length} more` : `Show less`;
}

function sortProperties(props) {
  const active = [];
  const closed = [];
  const prospecting = [];

  props.forEach(p => {
    if (p.current_milestone === 'Closed') closed.push(p);
    else if (p.current_milestone === 'Prospecting') prospecting.push(p);
    else active.push(p);
  });

  // Sort active by milestone progress descending (most progress first)
  active.sort((a, b) => milestoneIndex(b.current_milestone) - milestoneIndex(a.current_milestone));

  return { active, closed, prospecting };
}

function render() {
  // Header
  const dt = new Date(DATA.last_updated);
  document.getElementById('lastUpdated').textContent =
    'Last updated: ' + dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) +
    ' at ' + dt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

  const { active, closed, prospecting } = sortProperties(DATA.properties);

  // Stats
  document.getElementById('statActive').textContent = active.length;
  document.getElementById('statClosing').textContent =
    active.filter(p => p.current_milestone === 'Closing').length;
  document.getElementById('statRehab').textContent =
    active.filter(p => p.current_milestone === 'Repairs / Rehab').length;

  // Render cards
  const container = document.getElementById('cardsContainer');
  let html = '';

  if (active.length) {
    html += `<div class="section-label">Active Properties (${active.length})</div>`;
    html += active.map(renderCard).join('');
  }
  if (closed.length) {
    html += `<div class="section-label">Closed (${closed.length})</div>`;
    html += closed.map(renderCard).join('');
  }
  if (prospecting.length) {
    html += `<div class="section-label">Prospecting (${prospecting.length})</div>`;
    html += prospecting.map(renderCard).join('');
  }

  container.innerHTML = html;
}

render();
</script>
