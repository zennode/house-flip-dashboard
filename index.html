<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Flip Closing Coordinator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1117;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:16px;max-width:1200px;margin:0 auto}
header{position:sticky;top:0;z-index:100;background:#0f1117;padding:16px 0 12px;border-bottom:1px solid #2d3348;margin-bottom:16px}
h1{font-size:24px;font-weight:800;color:#f1f5f9}
.stats{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap}
.stat{background:#1a1d27;padding:8px 16px;border-radius:8px;font-size:13px}
.stat b{color:#f1f5f9}
.updated{color:#6b7280;font-size:12px;margin-top:4px}
.card{background:#1a1d27;border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid #2d3348}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}
.card h2{margin:0;color:#f1f5f9;font-size:18px;font-weight:700}
.badge{color:#fff;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.countdown{color:#fff;padding:6px 12px;border-radius:8px;font-weight:700;font-size:14px;text-align:center;margin:8px 0}
.timeline{position:relative;display:flex;justify-content:space-between;margin:12px 0;padding:0 4px}
.timeline-bg{position:absolute;top:5px;left:10px;right:10px;height:2px;background:#374151;z-index:0}
.timeline-fg{position:absolute;top:5px;left:10px;height:2px;background:#3b82f6;z-index:1}
.dot-wrap{display:flex;flex-direction:column;align-items:center;flex:1}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid}
.dot-label{font-size:9px;color:#9ca3af;margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.section-title{color:#94a3b8;font-size:11px;font-weight:600;text-transform:uppercase;margin-bottom:4px}
.fin-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #1e293b}
.fin-label{color:#9ca3af;font-size:12px}
.fin-val{color:#e2e8f0;font-size:12px;font-weight:600}
.contact{font-size:12px;color:#cbd5e1;padding:2px 0}
.contact b{color:#e2e8f0;font-weight:500}
.contact span{color:#6b7280}
.update{font-size:12px;color:#cbd5e1;padding:3px 0;border-bottom:1px solid #1e293b}
.update .date{color:#6b7280}
.update .src{background:#1e293b;color:#9ca3af;padding:1px 6px;border-radius:8px;font-size:10px}
.action{font-size:12px;color:#fbbf24;padding:2px 0}
.tag{color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;margin-right:4px}
.more{font-size:11px;color:#6b7280}
@media(max-width:768px){.grid{grid-template-columns:1fr!important}}
#loading{text-align:center;padding:60px;color:#6b7280;font-size:16px}
</style>
</head>
<body>
<header>
<h1>House Flip Closing Coordinator</h1>
<div class="updated" id="lastUpdated"></div>
<div class="stats" id="statsBar"></div>
</header>
<div id="loading">Loading dashboard...</div>
<div id="cards"></div>
<script>
const MS=['Offer Made','Under Contract','Title & Escrow','Inspections','Appraisal','Financing','Repairs / Rehab','Final Walkthrough','Closing','Closed'];
const MC={
'Offer Made':'#6b7280','Under Contract':'#3b82f6','Title & Escrow':'#8b5cf6',
'Inspections':'#f59e0b','Appraisal':'#f59e0b','Financing':'#f97316',
'Repairs / Rehab':'#f59e0b','Final Walkthrough':'#22c55e','Closing':'#ef4444','Closed':'#22c55e'
};
const SHORT=['Offer','Contract','Title','Inspect','Appraisal','Finance','Rehab','Walk','Closing','Closed'];

function daysDiff(d){if(!d)return null;const t=new Date(d),n=new Date();return Math.ceil((t-n)/(86400000));}
function fmt$(v){return v!=null?'$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2}):'â';}

function renderCard(p){
  const mi=MS.indexOf(p.current_milestone);
  const pct=mi>=0?Math.round((mi/(MS.length-1))*100):0;
  const dd=daysDiff(p.closing_date);
  let cdHtml='';
  if(p.current_milestone!=='Closed'&&dd!==null){
    if(dd<=0)cdHtml=`<div class="countdown" style="background:#ef4444">CLOSING TODAY</div>`;
    else if(dd===1)cdHtml=`<div class="countdown" style="background:#f97316">CLOSING TOMORROW</div>`;
    else if(dd<=7)cdHtml=`<div class="countdown" style="background:#f59e0b">${dd} DAYS TO CLOSING</div>`;
    else if(dd<=30)cdHtml=`<div class="countdown" style="background:#3b82f6">${dd} days to closing</div>`;
  }
  // Tags
  const tags=(p.data_sources||[]).map(s=>`<span class="tag" style="background:${s==='Email'?'#3b82f6':'#ef4444'}">${s}</span>`).join('');
  // Timeline dots
  let dots='';
  for(let i=0;i<MS.length;i++){
    const done=i<=mi;const cur=i===mi;
    const bg=done?'#22c55e':cur?'#3b82f6':'#374151';
    const border=done?'#22c55e':cur?'#3b82f6':'#374151';
    dots+=`<div class="dot-wrap"><div class="dot" style="background:${bg};border-color:${border}"></div><div class="dot-label">${SHORT[i]}</div></div>`;
  }
  // Financials
  let finHtml='';
  const f=p.financials||{};
  if(Object.keys(f).length){
    finHtml=`<div style="margin-top:8px"><div class="section-title">Financials</div>`;
    const rows=[['Purchase','purchase_price'],['Rehab Budget','rehab_budget'],['Total Loan','total_loan_amount'],['Wire Amount','wire_amount'],['Rate','interest_rate'],['Points','points'],['Lender Fees','lender_fees'],['Potential ARV','potential_arv']];
    rows.forEach(([l,k])=>{if(f[k]!=null)finHtml+=`<div class="fin-row"><span class="fin-label">${l}</span><span class="fin-val">${typeof f[k]==='number'?fmt$(f[k]):f[k]}</span></div>`;});
    finHtml+=`</div>`;
  }
  // Contacts
  let conHtml='';
  const contacts=p.key_contacts||[];
  if(contacts.length){
    const show=contacts.slice(0,6);
    conHtml=`<div style="margin-top:8px"><div class="section-title">Key Contacts</div>`;
    show.forEach(c=>conHtml+=`<div class="contact"><b>${c.name}</b> <span>â ${c.role}</span></div>`);
    if(contacts.length>6)conHtml+=`<div class="more">+${contacts.length-6} more</div>`;
    conHtml+=`</div>`;
  }
  // Updates
  let updHtml='';
  const updates=p.updates||[];
  if(updates.length){
    updHtml=`<div style="margin-top:8px"><div class="section-title">Recent Updates</div>`;
    updates.slice(0,5).forEach(u=>{
      const src=u.source?`<span class="src">${u.source}</span>`:'';
      updHtml+=`<div class="update"><span class="date">${u.date||''}</span> ${u.text} ${src}</div>`;
    });
    updHtml+=`</div>`;
  }
  // Actions
  let actHtml='';
  const actions=p.action_items||[];
  if(actions.length){
    actHtml=`<div style="margin-top:8px"><div class="section-title">Action Items</div>`;
    actions.forEach(a=>actHtml+=`<div class="action">â¢ ${typeof a==='string'?a:a.text||a}</div>`);
    actHtml+=`</div>`;
  }
  return `<div class="card">
<div class="card-header"><div><h2>${p.address}</h2><div style="margin-top:4px">${tags}</div></div>
<span class="badge" style="background:${MC[p.current_milestone]||'#6b7280'}">${p.current_milestone}</span></div>
${cdHtml}
<div class="timeline"><div class="timeline-bg"></div><div class="timeline-fg" style="width:${pct}%"></div>${dots}</div>
<div class="grid"><div>${finHtml}${conHtml}</div><div>${updHtml}${actHtml}</div></div></div>`;
}

fetch('properties_data.json').then(r=>r.json()).then(data=>{
  document.getElementById('lastUpdated').textContent='Last updated: '+(data.last_updated||'Unknown');
  const props=data.properties||[];
  // Stats
  const closed=props.filter(p=>p.current_milestone==='Closed').length;
  const closing=props.filter(p=>p.current_milestone==='Closing').length;
  const rehab=props.filter(p=>p.current_milestone==='Repairs / Rehab').length;
  const prospect=props.filter(p=>p.current_milestone==='Offer Made').length;
  const active=props.length-closed;
  document.getElementById('statsBar').innerHTML=
    `<div class="stat"><b>${active}</b> Active</div>`+
    `<div class="stat" style="border-left:3px solid #ef4444"><b>${closing}</b> At Closing</div>`+
    `<div class="stat" style="border-left:3px solid #f59e0b"><b>${rehab}</b> In Rehab</div>`+
    `<div class="stat" style="border-left:3px solid #22c55e"><b>${closed}</b> Closed</div>`+
    `<div class="stat" style="border-left:3px solid #6b7280"><b>${prospect}</b> Prospecting</div>`;
  // Sort: Closing first (by days to close), then active by milestone desc, then closed
  props.sort((a,b)=>{
    const ai=MS.indexOf(a.current_milestone),bi=MS.indexOf(b.current_milestone);
    if(a.current_milestone==='Closed'&&b.current_milestone!=='Closed')return 1;
    if(b.current_milestone==='Closed'&&a.current_milestone!=='Closed')return -1;
    if(ai!==bi)return bi-ai;
    const da=daysDiff(a.closing_date),db=daysDiff(b.closing_date);
    if(da!==null&&db!==null)return da-db;
    return 0;
  });
  document.getElementById('loading').style.display='none';
  document.getElementById('cards').innerHTML=props.map(renderCard).join('');
}).catch(e=>{
  document.getElementById('loading').innerHTML='<div style="color:#ef4444">Error loading data: '+e.message+'</div>';
});
</script>
</body>
</html>
