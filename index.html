<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Flip Closing Coordinator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0f1117;
  --card-bg: #1a1d27;
  --text: #e4e4e7;
  --text-muted: #9ca3af;
  --accent: #3b82f6;
  --green: #22c55e;
  --yellow: #eab308;
  --red: #ef4444;
  --orange: #f97316;
  --border: #2d3748;
}
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.5; padding: 0; }
.header { position: sticky; top: 0; z-index: 100; background: #141720; border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.header h1 { font-size: 1.4rem; font-weight: 700; }
.header-meta { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.stat { text-align: center; padding: 4px 12px; background: var(--card-bg); border-radius: 8px; }
.stat-value { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); }
.last-updated { font-size: 0.75rem; color: var(--text-muted); }
.container { max-width: 1400px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 20px; }
.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; transition: border-color 0.2s; }
.card:hover { border-color: var(--accent); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.address { font-size: 1.05rem; font-weight: 600; }
.phase-badge { padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; white-space: nowrap; }
.phase-closing { background: rgba(249,115,22,0.15); color: var(--orange); }
.phase-closed { background: rgba(34,197,94,0.15); color: var(--green); }
.phase-rehab { background: rgba(59,130,246,0.15); color: var(--accent); }
.phase-inspections { background: rgba(234,179,8,0.15); color: var(--yellow); }
.phase-title { background: rgba(168,85,247,0.15); color: #a855f7; }
.phase-financing { background: rgba(236,72,153,0.15); color: #ec4899; }
.phase-contract { background: rgba(20,184,166,0.15); color: #14b8a6; }
.phase-prospecting { background: rgba(156,163,175,0.15); color: var(--text-muted); }
.source-badges { display: flex; gap: 4px; margin-bottom: 10px; }
.source-badge { padding: 2px 6px; border-radius: 4px; font-size: 0.6rem; background: rgba(59,130,246,0.1); color: var(--accent); border: 1px solid rgba(59,130,246,0.2); }
.countdown { font-size: 0.8rem; color: var(--orange); font-weight: 600; margin-bottom: 10px; }
.timeline { display: flex; align-items: center; gap: 4px; margin: 14px 0; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border); }
.dot.completed { background: var(--green); border-color: var(--green); }
.dot.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px rgba(59,130,246,0.5); }
.dot.pending { background: transparent; }
.line { flex: 1; height: 2px; background: var(--border); }
.section { margin-top: 12px; }
.section-title { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; letter-spacing: 0.5px; }
.grid-sections { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.item { font-size: 0.8rem; color: var(--text); margin-bottom: 4px; padding-left: 8px; border-left: 2px solid var(--border); }
.item.urgent { border-left-color: var(--red); color: #fca5a5; }
.update { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
.update-date { color: var(--accent); font-weight: 500; }
.financials-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.fin-item { font-size: 0.75rem; }
.fin-label { color: var(--text-muted); }
.fin-value { color: var(--text); font-weight: 500; }
@media (max-width: 500px) { .container { grid-template-columns: 1fr; padding: 12px; } }
</style>
</head>
<body>
<div class="header">
  <h1>House Flip Closing Coordinator</h1>
  <div class="header-meta">
    <div class="stat"><div class="stat-value" id="active-count">0</div><div class="stat-label">Active</div></div>
    <div class="stat"><div class="stat-value" id="closing-count">0</div><div class="stat-label">At Closing</div></div>
    <div class="stat"><div class="stat-value" id="rehab-count">0</div><div class="stat-label">In Rehab</div></div>
    <div class="last-updated">Updated: <span id="last-updated-time"></span></div>
  </div>
</div>
<div class="container" id="cards"></div>
<script>
const MILESTONES = ["Offer Made","Under Contract","Title & Escrow","Inspections","Appraisal","Financing","Repairs/Rehab","Final Walkthrough","Closing","Closed"];

function getPhaseClass(m) {
  if (m === "Closed") return "phase-closed";
  if (m === "Closing") return "phase-closing";
  if (m.includes("Rehab") || m.includes("Repair")) return "phase-rehab";
  if (m === "Inspections") return "phase-inspections";
  if (m.includes("Title") || m.includes("Escrow")) return "phase-title";
  if (m === "Financing") return "phase-financing";
  if (m.includes("Contract")) return "phase-contract";
  if (m === "Prospecting") return "phase-prospecting";
  return "phase-rehab";
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + "T00:00:00");
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.ceil((d - now) / 86400000);
}

function renderTimeline(milestone) {
  const idx = MILESTONES.indexOf(milestone);
  let html = '';
  for (let i = 0; i < MILESTONES.length; i++) {
    let cls = 'pending';
    if (i < idx) cls = 'completed';
    else if (i === idx) cls = 'active';
    html += `<div class="dot ${cls}" title="${MILESTONES[i]}"></div>`;
    if (i < MILESTONES.length - 1) html += '<div class="line"></div>';
  }
  return html;
}

function renderCard(p) {
  const days = daysUntil(p.closing_date);
  const countdown = days !== null ? (days <= 0 ? `<div class="countdown">CLOSING PAST DUE (${Math.abs(days)} days ago)</div>` : `<div class="countdown">${days} days to closing</div>`) : '';
  const sources = p.sources.map(s => `<span class="source-badge">${s}</span>`).join('');
  const contacts = (p.contacts||[]).slice(0,4).map(c => `<div class="item">${c.name} - ${c.role}</div>`).join('');
  const actions = (p.action_items||[]).slice(0,4).map(a => `<div class="item${a.startsWith('URGENT') ? ' urgent' : ''}">${a}</div>`).join('');
  const updates = (p.recent_updates||[]).slice(0,3).map(u => `<div class="update"><span class="update-date">${u.date}</span> ${u.note.substring(0,80)}${u.note.length>80?'...':''}</div>`).join('');

  let finHtml = '';
  if (p.financials && Object.keys(p.financials).length > 0) {
    const entries = Object.entries(p.financials).slice(0,4).map(([k,v]) => `<div class="fin-item"><span class="fin-label">${k.replace(/_/g,' ')}:</span> <span class="fin-value">${typeof v === 'number' ? '$'+v.toLocaleString() : v}</span></div>`).join('');
    finHtml = `<div class="section"><div class="section-title">Financials</div><div class="financials-grid">${entries}</div></div>`;
  }

  return `<div class="card">
    <div class="card-header">
      <div class="address">${p.address}</div>
      <span class="phase-badge ${getPhaseClass(p.current_milestone)}">${p.current_milestone}</span>
    </div>
    <div class="source-badges">${sources}</div>
    ${countdown}
    <div class="timeline">${renderTimeline(p.current_milestone)}</div>
    ${finHtml}
    <div class="grid-sections">
      <div class="section"><div class="section-title">Key Contacts</div>${contacts || '<div class="item">None listed</div>'}</div>
      <div class="section"><div class="section-title">Action Items</div>${actions || '<div class="item">None</div>'}</div>
    </div>
    <div class="section"><div class="section-title">Recent Updates</div>${updates || '<div class="update">No recent updates</div>'}</div>
  </div>`;
}

async function init() {
  try {
    const resp = await fetch('properties_data.json');
    const data = await resp.json();
    document.getElementById('last-updated-time').textContent = new Date(data.last_updated).toLocaleString();
    const props = data.properties;
    const active = props.filter(p => p.current_milestone !== 'Closed' && p.current_milestone !== 'Prospecting');
    const closing = props.filter(p => p.current_milestone === 'Closing');
    const rehab = props.filter(p => p.current_milestone === 'Repairs/Rehab');
    document.getElementById('active-count').textContent = active.length;
    document.getElementById('closing-count').textContent = closing.length;
    document.getElementById('rehab-count').textContent = rehab.length;
    // Sort: active first (by closing date), then closed, then prospecting
    const order = {"Closing":0,"Inspections":1,"Title & Escrow":2,"Financing":3,"Under Contract":4,"Repairs/Rehab":5,"Final Walkthrough":6,"Appraisal":7,"Offer Made":8,"Closed":9,"Prospecting":10};
    props.sort((a,b) => (order[a.current_milestone]||8) - (order[b.current_milestone]||8));
    document.getElementById('cards').innerHTML = props.map(renderCard).join('');
  } catch(e) { document.getElementById('cards').innerHTML = '<p style="color:red;padding:40px;">Error loading data: '+e.message+'</p>'; }
}
init();
</script>
</body>
</html>
