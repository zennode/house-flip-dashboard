<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Flip Closing Coordinator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1117;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
.header{position:sticky;top:0;z-index:100;background:#0f1117;border-bottom:1px solid #2d3748;padding:16px 24px}
.header h1{font-size:22px;color:#f9fafb;margin-bottom:4px}
.header .meta{font-size:13px;color:#6b7280}
.stats{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.stat{background:#1a1d27;border-radius:8px;padding:8px 16px;text-align:center;min-width:120px}
.stat .num{font-size:24px;font-weight:700}
.stat .label{font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px}
.container{max-width:1200px;margin:0 auto;padding:20px 24px}
.card{background:#1a1d27;border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid #2d3748}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}
.badge{padding:4px 12px;border-radius:16px;font-size:12px;font-weight:600;color:#fff}
.src-badge{padding:2px 8px;border-radius:10px;font-size:11px;margin-right:4px;color:#fff}
.timeline{display:flex;align-items:flex-start;gap:2px;margin:12px 0}
.dot-wrap{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0}
.dot{width:14px;height:14px;border-radius:50%;margin-bottom:4px}
.dot-label{font-size:9px;color:#9ca3af;text-align:center;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60px}
.section-title{color:#9ca3af;font-size:12px;font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.countdown{font-size:13px;margin-top:4px}
.action-item{font-size:13px;color:#fbbf24;padding:4px 0;border-bottom:1px solid #1f2937}
.update-item{font-size:12px;color:#9ca3af;padding:3px 0;border-bottom:1px solid #1f2937}
.update-src{background:#1f2937;padding:1px 6px;border-radius:8px;font-size:10px}
.contact{font-size:13px;color:#d1d5db}
.contact-role{color:#6b7280}
.fin-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:13px;color:#d1d5db}
.loading{text-align:center;padding:60px;font-size:18px;color:#6b7280}
</style>
</head>
<body>
<div class="header">
<h1>House Flip Closing Coordinator</h1>
<div class="meta" id="meta">Loading...</div>
<div class="stats" id="stats"></div>
</div>
<div class="container" id="cards"><div class="loading">Loading properties data...</div></div>
<script>
const MS=["Offer Made","Under Contract","Title & Escrow","Inspections","Appraisal","Financing","Repairs / Rehab","Final Walkthrough","Closing","Closed"];
const PC={"Prospecting":"#6b7280","Offer Made":"#f59e0b","Under Contract":"#3b82f6","Title & Escrow":"#8b5cf6","Inspections":"#ec4899","Appraisal":"#14b8a6","Financing":"#f97316","Repairs / Rehab":"#eab308","Final Walkthrough":"#06b6d4","Closing":"#ef4444","Closed":"#22c55e"};
const SC={"dotloop":"#4f46e5","DocuSign":"#f59e0b","PDF":"#ef4444","Email":"#6b7280"};
function msIdx(m){return MS.indexOf(m)}
function sortKey(p){const m=p.current_milestone;if(m==="Closed")return[2,0];if(m==="Prospecting")return[1,0];return[0,-msIdx(m)]}
function countdown(cd){if(!cd)return"";const[mo,dy,yr]=cd.split("/").map(Number);const c=new Date(yr,mo-1,dy);const n=new Date();n.setHours(0,0,0,0);const d=Math.round((c-n)/864e5);if(d<0)return'<div class="countdown" style="color:#ef4444">Closing was '+Math.abs(d)+' days ago</div>';if(d===0)return'<div class="countdown" style="color:#f59e0b;font-weight:bold">CLOSING TODAY!</div>';return'<div class="countdown" style="color:#22c55e">'+d+' days to closing</div>'}
function timeline(cur){const idx=msIdx(cur);return'<div class="timeline">'+MS.map((m,i)=>{let c="#374151",b="#4b5563";if(cur!=="Prospecting"){if(i<idx){c="#22c55e";b=c}else if(i===idx){c="#3b82f6";b=c}}return'<div class="dot-wrap"><div class="dot" style="background:'+c+';border:2px solid '+b+'" title="'+m+'"></div><div class="dot-label" title="'+m+'">'+m+'</div></div>'}).join("")+'</div>'}
function card(p){const ph=p.current_milestone,pc=PC[ph]||"#6b7280";const srcs=p.sources.map(s=>'<span class="src-badge" style="background:'+(SC[s]||"#6b7280")+'">'+s+'</span>').join("");
let fin="";const f=p.financials||{};if(f.purchase_price||f.rate){let items="";if(f.purchase_price)items+="<div><strong>Purchase:</strong> $"+Number(f.purchase_price).toLocaleString()+"</div>";if(f.construction_advance)items+="<div><strong>Construction:</strong> $"+Number(f.construction_advance).toLocaleString()+"</div>";if(f.rate)items+="<div><strong>Rate:</strong> "+f.rate+"</div>";if(f.term)items+="<div><strong>Term:</strong> "+f.term+"</div>";if(f.points)items+="<div><strong>Points:</strong> $"+Number(f.points).toLocaleString()+"</div>";if(f.lender_fees)items+="<div><strong>Lender Fees:</strong> $"+Number(f.lender_fees).toLocaleString()+"</div>";fin='<div class="section-title">Financials</div><div class="fin-grid">'+items+"</div>"}
let contacts="";if(p.contacts&&p.contacts.length){contacts='<div class="section-title">Key Contacts</div>'+p.contacts.map(c=>'<div class="contact">'+c.name+' <span class="contact-role">('+c.role+')</span></div>').join("")}
let dates="";if(p.closing_date)dates='<div class="section-title">Important Dates</div><div style="font-size:13px;color:#d1d5db">Closing: '+p.closing_date+'</div>';
let actions="";if(p.action_items&&p.action_items.length)actions='<div class="section-title" style="color:#f59e0b">Action Items</div>'+p.action_items.map(a=>'<div class="action-item">â  '+a+"</div>").join("");
let updates="";if(p.recent_updates&&p.recent_updates.length)updates='<div class="section-title">Recent Updates</div>'+p.recent_updates.slice(0,5).map(u=>'<div class="update-item"><span style="color:#6b7280">'+(u.date||"")+"</span> "+u.subject+' <span class="update-src">'+(u.source||"")+"</span></div>").join("");
return'<div class="card"><div class="card-header"><div><h2 style="margin:0;font-size:18px;color:#f3f4f6">'+p.address+"</h2>"+countdown(p.closing_date)+'</div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="badge" style="background:'+pc+'">'+ph+"</span><div>"+srcs+'</div></div></div>'+timeline(ph)+'<div class="grid"><div>'+fin+contacts+'</div><div>'+dates+actions+updates+"</div></div></div>"}
fetch("properties_data.json").then(r=>r.json()).then(data=>{
const props=data.properties;const active=props.filter(p=>p.current_milestone!=="Closed"&&p.current_milestone!=="Prospecting");const closing=props.filter(p=>p.current_milestone==="Closing");const rehab=props.filter(p=>p.current_milestone==="Repairs / Rehab");const closed=props.filter(p=>p.current_milestone==="Closed");
document.getElementById("meta").textContent="Last updated: "+data.last_updated+" | Total Properties: "+props.length;
document.getElementById("stats").innerHTML='<div class="stat"><div class="num" style="color:#3b82f6">'+active.length+'</div><div class="label">Active</div></div><div class="stat"><div class="num" style="color:#ef4444">'+closing.length+'</div><div class="label">At Closing</div></div><div class="stat"><div class="num" style="color:#eab308">'+rehab.length+'</div><div class="label">In Rehab</div></div><div class="stat"><div class="num" style="color:#22c55e">'+closed.length+'</div><div class="label">Closed</div></div>';
props.sort((a,b)=>{const ka=sortKey(a),kb=sortKey(b);return ka[0]-kb[0]||ka[1]-kb[1]});
document.getElementById("cards").innerHTML=props.map(card).join("")}).catch(e=>{document.getElementById("cards").innerHTML='<div class="loading">Error loading data: '+e.message+"</div>"});
</script>
</body>
</html>
