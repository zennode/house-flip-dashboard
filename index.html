<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--card-bg:#1a1d27;--text:#e2e8f0;--text-muted:#94a3b8;--accent:#3b82f6;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--border:#2d3748}
body{font-family:-apple-system,BlinkMacSystemhFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:0 1rem 2rem}
.header{position:sticky;top:0;background:var(--bg);padding:1rem 0;border-bottom:1px solid var(--border);z-index:100;margin-bottom:1.5rem}
.header h1{font-size:1.5rem;font-weight:700}
.header-meta{display:flex;gap:1.5rem;margin-top:0.5rem;font-size:0.85rem;color:var(--text-muted)}
.stat{background:var(--card-bg);padding:0.25rem 0.75rem;border-radius:6px}
.stat strong{color:var(--text)}h
.cards{display:grid;gap:1.25rem;grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
.card{background:var(--card-bg);border-radius:12px;padding:1.25rem;border:1px solid var(--border)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.75rem}
.card-header h2{font-size:1rem;font-weight:600}
.badge{font-size:0.7rem;padding:0.2rem 0.6rem;border-radius:999px;font-weight:600;white-space:nowrap}
.badge-closed{background:#166534;color:#86efac}
.badge-closing{background:#92400e;color:#fde047}
.badge-rehab{background:#1e3a5f;color:#93c5fd}
.badge-financing{background:#4c1d95;color:#c4b5fd}
.badge-title{background:#3730a3;color:#a5b4fc}
.badge-contract{background:#065f46;color:#6ee7b7}
.badge-inspections{background:#713f12;color:#fde68a}
.badge-prospecting{background:#374151;color:#9ca3af}
.source-badges{display:flex;gap:0.35rem;margin-bottom:0.75rem}
.src-badge{font-size:0.65rem;padding:0.15rem 0.5rem;border-radius:4px;background:#374151;color:#9ca3af}
.countdown{font-size:0.8rem;color:var(--yellow);margin-bottom:0.5rem}
.timeline{display:flex;gap:4px;margin-bottom:1rem;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-done{background:var(--green)}
.dot-active{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.dot-pending{background:#374151}
.section{margin-top:0.75rem}
.section-title{font-size:0.75rem;text-transform:uppercase;color:var(--text-muted);margin-bottom:0.35rem;font-weight:600}
.section-content{font-size:0.8rem;color:var(--text-muted)}
.section-content li{margin-bottom:0.2rem;list-style:none}
.section-content li::before{content:"â¢ ";color:var(--accent)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}
.action-item{color:var(--yellow)}
.update-item{border-left:2px solid var(--border);padding-left:0.5rem;margin-bottom:0.4rem}
.update-date{font-size:0.7rem;color:var(--accent)}
@media(max-width:500px){.cards{grid-template-columns:1fr}.grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>

"financials":{},"recent_updates":[],"action_items":[]},{"address":"11 Bryant St, Springfield, MA","current_milestone":"Closed","closing_date":null,"sources":["Email"],"contacts":[{"name":"Jessica Sicard","role":"Project Manager"}],"financials":{},"recent_updates":[{"date":"2026-04-29","subject":"Detailed financial breakdown: YB owed $8,670.50 after settlement","source":"Email"}],"action_items":["Final payment approved; confirm listing date","Track YB settlement amount"]},{"address":"100 Central St (New Property)","current_milestone":"Repairs / Rehab","closing_date":null,"sources":["Email"],"contacts":[],"financials":{},"recent_updates":[{"date":"2026-04-24","subject":"New property acquired; rehab planning","source":"Email"}],"action_items":[]},{"address":"300 Tyler St, Pittsfield, MA 01201","current_milestone":"Title & Escrow","closing_date":null,"sources":["Email","PDF"],"contacts":[{"name":"David Burstein","role":"Attorney"},{"name":"Jessica Sicard","role":"Project Manager"}],"financials":{},"recent_updates":[{"date":"2026-05-05","subject":"Title work in progress","source":"Email"}],"action_items":[]},{"address":"166 East St, Stafford, CT 06076","current_milestone":"Under Contract","closing_date":null,"sources":["dotloop","Email"],"contacts":[{"name":"Alice Kempf","role":"Agent"}],"financials":{},"recent_updates":[{"date":"2026-05-08","subject":"Under contract; awaiting inspections","source":"Email"}],"action_items":[]},{"address":"583 Hawks Spur Rd, Plymouth, VT","current_milestone":"Prospecting","closing_date":null,"sources":["Email"],"contacts":[],"financials":{},"recent_updates":[],"action_items":[]},{"address":"103 Prospect St (Potential Sale)","current_milestone":"Inspections","closing_date":null,"sources":["Email"],"contacts":[{"name":"Ryan O'Hara","role":"Attorney (Bacon Wilson)"},{"name":"Hunter Foote","role":"Prospective Buyer (Vanderburgh)"}],"financials":{},"recent_updates":[{"date":"2026-05-13","subject":"Hunter Foote submitted new lower offer; Matt rejected","source":"Email"},{"date":"2026-05-13","subject":"Eviction court first tier event scheduled for May 28","source":"Email"},{"date":"2026-05-08","subject":"Potential buyer Hunter Foote in discussions","source":"Email"}],"action_items":["Eviction court first tier event May 28","Await revised offer from Hunter Foote / Vanderburgh","Do NOT contact Code Enforcement"]},{"address":"172 Fiske St, Southbridge, MA","current_milestone":"Prospecting","closing_date":null,"sources":["Email","PDF"],"contacts":[{"name":"Alice Kempf","role":"Agent"},{"name":"Antonio","role":"Partner (Investarters)"}],"financials":{"arv_2br":"379900","arv_3br":"439900-480000"},"recent_updates":[{"date":"2026-05-15","subject":"Alice Kempf sent CMA: 2BR ARV $379,900; 3BR ARV $439,900-$480,000","source":"Email"},{"date":"2026-05-15","subject":"Matt forwarded CMA to Antonio at Investarters for review","source":"Email"}],"action_items":["Evaluate room conversion to MBR suite for 3BR pricing","Await Antonio's feedback on deal viability","Review previous listing details from PDF"]},{"address":"26 Old Putnam Rd Ext, Plainfield, CT 06239","current_milestone":"Prospecting","closing_date":null,"sources":["Email","PDF"],"contacts":[{"name":"Alice Kempf","role":"Agent"}],"financials":{"arv_estimate":"429000"},"recent_updates":[{"date":"2026-05-15","subject":"Alice Kempf sent CMA with ARV ~$429k","source":"Email"},{"date":"2026-05-15","subject":"Matt acknowledged receipt of CMA","source":"Email"}],"action_items":["Review CMA reports for pricing accuracy","Assess impact of sloping backyard on value","Determine offer strategy"]}]};function getBadgeClass(m){if(m==='Closed')return'badge-closed';if(m==='Closing')return'badge-closing';if(m.includes('Rehab'))return'badge-rehab';if(m==='Financing')return'badge-financing';if(m.includes('Title'))return'badge-title';if(m==='Under Contract')return'badge-contract';if(m==='Inspections')return'badge-inspections';return'badge-prospecting';}
function getCountdown(d){if(!d)return'';const cl=new Date(d);const now=new Date();const diff=Math.ceil((cl-now)/(1000*60*60*24));if(diff<0)return'Closed '+Math.abs(diff)+' days ago';if(diff===0)return'CLOSING TODAY';return diff+' days to closing';}
function renderTimeline(current){const idx=milestones.indexOf(current);return milestones.map((_,i)=>{let cls='dot-pending';if(i<idx)cls='dot-done';else if(i===idx)cls='dot-active';return`<div class="dot ${cls}" title="${milestones[i]}"></div>`;}).join('');}
function renderCard(p){const fin=Object.keys(p.financials).length?Object.entries(p.financials).map(([k,v])=>`<li>${k.replace(/_/g,' ')}: $${v}</li>`).join(''):'<li>No data yet</li>';

const actions=p.action_items.length?p.action_items.map(a=>`<li class="action-item">${a}</li>`).join(''):'<li>None</li>';
const updates=p.recent_updates.length?p.recent_updates.slice(0,3).map(u=>`<div class="update-item"><span class="update-date">${u.date||''}</span> ${u.subject}</div>`).join(''):'<div class="update-item">No recent updates</div>';
const cd=getCountdown(p.closing_date);
return`<div class="card"><div class="card-header"><h2>${p.address}</h2><span class="badge ${getBadgeClass(p.current_milestone)}">${p.current_milestone}</span></div><div class="source-badges">${p.sources.map(s=>`<span class="src-badge">${s}</span>`).join('')}</div>${cd?`<div class="countdown">${cd}</div>`:''}
<div class="timeline">${renderTimeline(p.current_milestone)}</div><div class="grid-2"><div class="section"><div class="section-title">Financials</div><div class="section-content"><ul>${fin}</ul></div></div><div class="section"><div class="section-title">Key Contacts</div><div class="section-content"><ul>${contacts}</ul></div></div></div><div class="section"><div class="section-title">Action Items</div><div class="section-content"><ul>${actions}</ul></div></div><div class="section"><div class="section-title">Recent Updates</div><div class="section-content">${updates}</div></div></div>`;}
// Sort: active first (non-Closed, non-Prospecting), then Prospecting, then Closed
const order=['Closing','Financing','Title & Escrow','Inspections','Under Contract','Repairs / Rehab','Prospecting','Closed'];
const sorted=[...data.properties].sort((a,b)=>{let ai=order.indexOf(a.current_milestone);let bi=order.indexOf(b.current_milestone);if(ai===-1)ai=99;if(bi===-1)bi=99;return ai-bi;});
document.getElementById('cards').innerHTML=sorted.map(renderCard).join('');
</script>
