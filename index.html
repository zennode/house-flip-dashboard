<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .header { position: sticky; top: 0; z-index: 100; background: rgba(15,17,23,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 20px; }

  .header-title { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
  .header-title span { color: var(--accent); }
  .last-updated { font-size: 12px; color: var(--text-muted); }

  .stat-item { display: flex; align-items: center; gap: 8px; }
  .stat-value { font-size: 22px; font-weight: 700; line-height: 1; }
  .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; line-height: 1.3; }

  .main { padding: 24px 20px; max-width: 1400px; margin: 0 auto; }
  .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin: 28px 0 12px; display: flex; align-items: center; gap: 10px; }

  .section-label:first-child { margin-top: 0; }
  .property-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease; }
  .property-card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(59,130,246,0.15); background: var(--card-bg-hover); }
  .card-header { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .card-address { font-size: 16px; font-weight: 600; color: var(--text); flex: 1; min-width: 200px; }
  .card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
  .badge-green  { background: rgba(34,197,94,0.15);  color: var(--success); border: 1px solid rgba(34,197,94,0.3); }
  .badge-blue   { background: rgba(59,130,246,0.15); color: var(--accent);  border: 1px solid rgba(59,130,246,0.3); }
  .badge-yellow { background: rgba(245,158,11,0.15); color: var(--warning); border: 1px solid rgba(245,158,11,0.3); }
  .badge-red    { background: rgba(239,68,68,0.15);  color: var(--danger);  border: 1px solid rgba(239,68,68,0.3); }
  .badge-purple { background: rgba(168,85,247,0.15); color: var(--purple);  border: 1px solid rgba(168,85,247,0.3); }
  .badge-orange { background: rgba(249,115,22,0.15); color: var(--orange);  border: 1px solid rgba(249,115,22,0.3); }

  .tl-item { display: flex; flex-direction: column; align-items: center; flex: 1; position: relative; cursor: default; }
  .tl-dot-wrap { display: flex; align-items: center; width: 100%; }
  .tl-line { flex: 1; height: 2px; background: var(--dot-pending); }
  .tl-line.done   { background: var(--success); }
  .tl-line.active { background: var(--accent); }

  .tl-dot.active  { background: var(--accent); box-shadow: 0 0 0 4px rgba(59,130,246,0.25), 0 0 12px rgba(59,130,246,0.4); }

  .kv-key { color: var(--text-muted); flex-shrink: 0; min-width: 90px; text-transform: capitalize; }
  .kv-val { color: var(--text); font-weight: 500; }
  .empty-msg { color: var(--text-muted); font-style: italic; font-size: 12px; }
  .contact-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 5px; font-size: 13px; }
  .contact-name { color: var(--text); font-weight: 500; }
  .contact-role { color: var(--text-muted); font-size: 12px; }
  .action-list { list-style: none; }
  .action-item { display: flex; gap: 7px; align-items: flex-start; padding: 4px 0; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .action-item:last-child { border-bottom: none; }
  .action-bullet { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); margin-top: 6px; flex-shrink: 0; }
  .action-bullet.urgent { background: var(--danger); box-shadow: 0 0 6px rgba(239,68,68,0.5); }
  .action-text.urgent { color: var(--danger); font-weight: 500; }
  .update-row { padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12px; }
  .update-row:last-child { border-bottom: none; }
  .update-top { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .update-date { color: var(--text-muted); font-size: 11px; white-space: nowrap; }

  .date-row { display: flex; gap: 8px; align-items: center; margin-bottom: 5px; font-size: 13px; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>

function formatDateStr(iso) {
  if (!iso) return null;
  try {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  } catch(e) { return iso; }
}

function parseClosingDate(str) {
  if (!str) return null;
  try {
    const parts = str.split('/');
    if (parts.length === 3) return new Date(parseInt(parts[2]), parseInt(parts[0])-1, parseInt(parts[1]));
  } catch(e) {}
  return null;
}

function daysToClosing(ds) {
  const d = parseClosingDate(ds);
  if (!d) return null;
  return Math.round((d - TODAY) / 86400000);
}

function getMilestoneBadgeCls(m) {
  if (m === 'Closed') return 'badge-green';
  if (m === 'Closing') return 'badge-yellow';
  if (m === 'Inspections') return 'badge-yellow';
  if (m === 'Prospecting') return 'badge-gray';
  return 'badge-blue';
}

function getSourceBadgeCls(s) {
  if (s === 'dotloop') return 'badge-purple';
  if (s === 'Email') return 'badge-blue';
  if (s === 'PDF') return 'badge-orange';
  return 'badge-gray';
}

function buildTimeline(milestone) {
  const ci = MILESTONES.indexOf(milestone);
  let html = '<div class="timeline">';
  for (let i = 0; i < MILESTONES.length; i++) {
    let dotCls;
    if (ci === -1) dotCls = 'pending';
    else if (i < ci) dotCls = 'done';
    else if (i === ci) dotCls = 'active';
    else dotCls = 'pending';

    const leftLineCls = (i === 0) ? '' : (ci === -1 ? '' : (i <= ci ? 'done' : ''));
    const rightLineCls = (i === MILESTONES.length-1) ? '' : (ci === -1 ? '' : (i < ci ? 'done' : ''));

    html += `<div class="tl-item">
      <div class="tl-dot-wrap">
        ${i === 0 ? '' : `<div class="tl-line ${leftLineCls}"></div>`}
        <div class="tl-dot ${dotCls}"></div>
        ${i === MILESTONES.length-1 ? '' : `<div class="tl-line ${rightLineCls}"></div>`}
      </div>
      <div class="tl-popup">${MILESTONES[i]}</div>
    </div>`;
  }
  html += '</div>';
  return html;
}

function buildFinancials(fin) {
  const keys = Object.keys(fin || {});
  if (!keys.length) return '<span class="empty-msg">No financial data</span>';
  return keys.map(k => {
    let v = fin[k];
    const label = k.replace(/_/g, ' ');
    if (/^\d{4,}$/.test(v)) v = '$' + parseInt(v).toLocaleString();
    return `<div class="kv-row"><span class="kv-key">${label}</span><span class="kv-val">${v}</span></div>`;
  }).join('');
}

function buildContacts(contacts) {
  if (!contacts || !contacts.length) return '<span class="empty-msg">No contacts listed</span>';
  return contacts.map(c => `<div class="contact-row"><span class="contact-name">${c.name}</span><span class="contact-role">${c.role}</span></div>`).join('');
}

function buildActions(items) {
  if (!items || !items.length) return '<span class="empty-msg">No action items</span>';
  return '<ul class="action-list">' + items.map(item => {
    const urgent = /urgent|days away/i.test(item);
    return `<li class="action-item"><div class="action-bullet ${urgent?'urgent':''}"></div><span class="action-text ${urgent?'urgent':''}">${item}</span></li>`;
  }).join('') + '</ul>';
}

function buildUpdates(updates) {
  if (!updates || !updates.length) return '<span class="empty-msg">No recent updates</span>';
  return updates.slice(0,5).map(u => {
    const bc = getSourceBadgeCls(u.source||'');
    const ds = u.date ? formatDateStr(u.date) : '';
    return `<div class="update-row">
      <div class="update-top">${ds?`<span class="update-date">${ds}</span>`:''}<span class="badge ${bc}" style="font-size:10px;padding:2px 7px;">${u.source||''}</span></div>
      <div class="update-subject">${u.subject||''}</div>
    </div>`;
  }).join('');
}

function buildDates(prop) {
  if (!prop.closing_date) return '<span class="empty-msg">No key dates set</span>';
  const d = parseClosingDate(prop.closing_date);
  const formatted = d ? d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : prop.closing_date;
  return `<div class="date-row"><span class="date-label">Closing Date</span><span class="date-val">${formatted}</span></div>`;
}

function buildCountdown(prop) {
  if (!prop.closing_date || prop.current_milestone === 'Closed') return '';
  const days = daysToClosing(prop.closing_date);
  if (days === null) return '';
  let cls, label;
  if (days < 0)       { cls = 'countdown-past';    label = Math.abs(days)+'d overdue'; }
  else if (days === 0){ cls = 'countdown-danger';   label = 'Closing TODAY'; }
  else if (days <= 7) { cls = 'countdown-danger';   label = days+'d to closing'; }
  else if (days <= 30){ cls = 'countdown-warning';  label = days+'d to closing'; }
  else                { cls = 'countdown-normal';   label = days+'d to closing'; }
  return `<span class="countdown ${cls}">${label}</span>`;
}

function buildCard(prop) {
  const mbc = getMilestoneBadgeCls(prop.current_milestone);
  const srcBadges = (prop.sources||[]).map(s=>`<span class="badge ${getSourceBadgeCls(s)}">${s}</span>`).join('');
  return `<div class="property-card">
    <div class="card-header">
      <div class="card-address">${prop.address}</div>
      <div class="card-meta">
        <span class="badge ${mbc}">${prop.current_milestone}</span>
        ${srcBadges}
        ${buildCountdown(prop)}
      </div>
    </div>
    <div class="timeline-wrap">${buildTimeline(prop.current_milestone)}</div>
    <div class="card-grid">
      <div class="grid-section">
        <div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>Financials</div>
        ${buildFinancials(prop.financials)}
      </div>
      <div class="grid-section">
        <div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>Key Contacts</div>
        ${buildContacts(prop.contacts)}
      </div>
      <div class="grid-section">
        <div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Important Dates</div>
        ${buildDates(prop)}
      </div>
      <div class="grid-section">
        <div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Action Items</div>
        ${buildActions(prop.action_items)}
      </div>
      <div class="grid-section full-width">
        <div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>Recent Updates</div>
        ${buildUpdates(prop.recent_updates)}
      </div>
    </div>
  </div>`;
}

function getLastUpdate(prop) {
  for (const u of (prop.recent_updates||[])) if (u.date) return new Date(u.date+'T00:00:00');
  return new Date(0);
}

function getSortGroup(prop) {
  const m = prop.current_milestone;
  if (m === 'Prospecting') return 3;
  if (m === 'Closed') return 2;
  return 1;
}

function init() {
  const lu = new Date(DATA.last_updated);
  document.getElementById('lastUpdated').textContent = 'Updated ' + lu.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) + ' ' + lu.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZoneName:'short'});

  const props = DATA.properties;
  document.getElementById('statActive').textContent  = props.filter(p=>getSortGroup(p)===1).length;
  document.getElementById('statClosing').textContent = props.filter(p=>p.current_milestone==='Closing').length;
  document.getElementById('statRehab').textContent   = props.filter(p=>p.current_milestone==='Repairs / Rehab').length;
  document.getElementById('statTotal').textContent   = props.length;

  const sorted = [...props].sort((a,b)=>{
    const gd = getSortGroup(a)-getSortGroup(b);
    if (gd) return gd;
    return getLastUpdate(b)-getLastUpdate(a);
  });

  const active    = sorted.filter(p=>getSortGroup(p)===1);
  const closed    = sorted.filter(p=>getSortGroup(p)===2);
  const prospect  = sorted.filter(p=>getSortGroup(p)===3);

  let html = '';
  if (active.length)   { html += `<div class="section-label">Active (${active.length})</div>`; html += active.map(buildCard).join(''); }
  if (closed.length)   { html += `<div class="section-label">Closed (${closed.length})</div>`; html += closed.map(buildCard).join(''); }
  if (prospect.length) { html += `<div class="section-label">Prospecting (${prospect.length})</div>`; html += prospect.map(buildCard).join(''); }

  document.getElementById('dashboard').innerHTML = html;
}

init();
</script>
