<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Flip Closing Coordinator</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0f1117; color:#e5e7eb; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  .header { position:sticky; top:0; background:#0f1117ee; backdrop-filter:blur(10px); border-bottom:1px solid #2a2d3a; padding:16px 24px; z-index:100; }
  .header h1 { font-size:22px; font-weight:800; background:linear-gradient(135deg,#3b82f6,#8b5cf6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .stats { display:flex; gap:16px; margin-top:8px; flex-wrap:wrap; }
  .stat { background:#1a1d27; padding:6px 14px; border-radius:8px; font-size:13px; }
  .stat b { color:#f3f4f6; }
  .container { max-width:1200px; margin:0 auto; padding:20px; }
  @media(max-width:768px) { .container { padding:12px; } }
  .card { background:#1a1d27; border-radius:12px; padding:24px; border:1px solid #2a2d3a; margin-bottom:20px; }
  .card-header { display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .card h2 { color:#f3f4f6; font-size:18px; font-weight:700; margin:0 0 6px 0; }
  .badge { padding:4px 12px; border-radius:6px; font-size:12px; font-weight:700; }
  .src-badge { padding:2px 8px; border-radius:4px; font-size:10px; font-weight:600; }
  .countdown { padding:6px 12px; border-radius:6px; font-size:14px; font-weight:700; text-align:center; }
  .milestones { display:flex; gap:6px; align-items:center; padding:8px 0; }
  .dot { width:10px; height:10px; border-radius:50%; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-top:16px; }
  .section { background:#0f1117; border-radius:8px; padding:12px; }
  .section h3 { color:#9ca3af; font-size:11px; text-transform:uppercase; letter-spacing:1px; margin:0 0 8px 0; }
  .row { padding:3px 0; border-bottom:1px solid #2a2d3a; }
  .update-row { padding:4px 0; border-bottom:1px solid #2a2d3a; }
  .fin-row { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #2a2d3a; }
  .loading { text-align:center; padding:40px; color:#6b7280; }
</style>
</head>
<body>
<div class="header">
  <h1>House Flip Closing Coordinator</h1>
  <div id="subtitle" style="color:#6b7280;font-size:12px;margin-top:4px;"></div>
  <div class="stats" id="stats"></div>
</div>
<div class="container" id="container">
  <div class="loading">Loading properties data...</div>
</div>
<script>
const PHASES = {
  'Prospecting':'#6b7280','Offer Made':'#f59e0b','Under Contract':'#8b5cf6',
  'Title & Escrow':'#8b5cf6','Inspections':'#3b82f6','Appraisal':'#3b82f6',
  'Financing':'#3b82f6','Repairs / Rehab':'#f97316','Final Walkthrough':'#06b6d4',
  'Closing':'#22c55e','Closed':'#22c55e','Listed':'#ec4899','Under Agreement':'#8b5cf6'
};
const MILESTONES = ['Offer Made','Under Contract','Title & Escrow','Inspections','Appraisal','Financing','Repairs / Rehab','Final Walkthrough','Closing','Closed'];
const SRC_COLORS = {Email:'#3b82f6',PDF:'#ef4444',Phone:'#22c55e',Text:'#f59e0b',MLS:'#8b5cf6'};

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  const now = new Date();
  now.setHours(0,0,0,0); d.setHours(0,0,0,0);
  return Math.ceil((d - now) / 86400000);
}

function fmt$(v) {
  if (v == null) return '';
  return typeof v === 'number' ? '$' + v.toLocaleString('en-US',{minimumFractionDigits:2}) : v;
}

function renderCard(p) {
  const phase = p.current_phase || 'Unknown';
  const phaseColor = PHASES[phase] || '#6b7280';
  const closing = p.closing_date;
  const days = daysUntil(closing);
  let countdownHtml = '';
  if (days !== null && phase !== 'Closed') {
    let bg, color, text;
    if (days <= 0) { bg='#22c55e22'; color='#22c55e'; text='CLOSED'; }
    else if (days <= 1) { bg='#f59e0b22'; color='#f59e0b'; text='CLOSING TOMORROW'; }
    else if (days <= 7) { bg='#3b82f622'; color='#3b82f6'; text=days+' DAYS TO CLOSING'; }
    else if (days <= 30) { bg='#8b5cf622'; color='#8b5cf6'; text=days+' DAYS TO CLOSING'; }
    else { bg='#1a1d27'; color='#9ca3af'; text=days+' days to closing'; }
    countdownHtml = `<div class="countdown" style="background:${bg};color:${color};">${text}</div>`;
  }

  const sources = [...new Set((p.data_sources||[]))];
  const srcBadges = sources.map(s => {
    const c = SRC_COLORS[s]||'#6b7280';
    return `<span class="src-badge" style="background:${c}22;color:${c};">${s}</span>`;
  }).join(' ');

  const mIdx = MILESTONES.indexOf(phase);
  const completedMs = p.milestones_completed || [];
  const dots = MILESTONES.map((m,i) => {
    const done = completedMs.includes(m);
    const current = m === phase;
    const bg = done ? '#22c55e' : current ? phaseColor : '#4b5563';
    const op = done || current ? '1' : '0.5';
    return `<div title="${m}" class="dot" style="background:${bg};opacity:${op};"></div>`;
  }).join('');

  // Financials
  let finHtml = '<p style="color:#6b7280;font-size:13px;">No financial data</p>';
  if (p.financials && Object.keys(p.financials).length > 0) {
    const f = p.financials;
    const rows = [];
    if (f.purchase_price) rows.push(['Purchase Price', fmt$(f.purchase_price)]);
    if (f.rehab_budget) rows.push(['Rehab Budget', fmt$(f.rehab_budget)]);
    if (f.total_loan) rows.push(['Total Loan', fmt$(f.total_loan)]);
    if (f.arv) rows.push(['ARV', fmt$(f.arv)]);
    if (f.rate) rows.push(['Rate', f.rate]);
    if (f.points) rows.push(['Points', fmt$(f.points)]);
    if (f.lender_fees) rows.push(['Lender Fees', fmt$(f.lender_fees)]);
    if (f.list_price) rows.push(['List Price', fmt$(f.list_price)]);
    if (f.sale_price) rows.push(['Sale Price', fmt$(f.sale_price)]);
    finHtml = rows.map(([k,v]) => `<div class="fin-row"><span style="color:#9ca3af;font-size:12px;">${k}</span><span style="color:#e5e7eb;font-size:12px;font-weight:600;">${v}</span></div>`).join('');
  }

  // Contacts
  const contacts = (p.contacts||[]).slice(0,6);
  const extraContacts = (p.contacts||[]).length - 6;
  const contactHtml = contacts.length ? contacts.map(c =>
    `<div class="row"><span style="color:#e5e7eb;font-size:12px;">${c.name}</span><br><span style="color:#6b7280;font-size:11px;">${c.role||''}</span></div>`
  ).join('') + (extraContacts > 0 ? `<div style="color:#6b7280;font-size:11px;padding-top:4px;">+${extraContacts} more</div>` : '')
  : '<p style="color:#6b7280;font-size:13px;">No contacts</p>';

  // Action items
  const actions = (p.action_items||[]).slice(0,5);
  const actionHtml = actions.length ? actions.map(a =>
    `<div class="row" style="display:flex;gap:6px;"><span style="color:#f59e0b;font-size:12px;">&#9679;</span><span style="color:#d1d5db;font-size:12px;">${a}</span></div>`
  ).join('') : '<p style="color:#6b7280;font-size:13px;">No action items</p>';

  // Recent updates
  const updates = (p.recent_updates||[]).slice(0,4);
  const updateHtml = updates.length ? updates.map(u =>
    `<div class="update-row"><span style="color:#6b7280;font-size:10px;">${u.date||''}</span>${u.source ? `<span style="background:#2a2d3a;color:#9ca3af;padding:1px 6px;border-radius:3px;font-size:10px;margin-left:4px;">${u.source}</span>` : ''}<br><span style="color:#d1d5db;font-size:12px;">${u.summary||''}</span></div>`
  ).join('') : '<p style="color:#6b7280;font-size:13px;">No recent updates</p>';

  return `<div class="card">
    <div class="card-header">
      <div>
        <h2>${p.address}</h2>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
          <span class="badge" style="background:${phaseColor}22;color:${phaseColor};">${phase}</span>
          ${srcBadges}
        </div>
      </div>
      ${closing ? `<div style="color:#9ca3af;font-size:13px;">Closing: ${new Date(closing).toLocaleDateString()}</div>` : ''}
    </div>
    ${countdownHtml}
    <div class="milestones">${dots}<span style="color:#6b7280;font-size:10px;margin-left:8px;">&#x25CF; Done  &#x25CF; Current  &#x25CF; Pending</span></div>
    <div class="grid">
      <div class="section"><h3>Financials</h3>${finHtml}</div>
      <div class="section"><h3>Key Contacts</h3>${contactHtml}</div>
      <div class="section"><h3>Action Items</h3>${actionHtml}</div>
      <div class="section"><h3>Recent Updates</h3>${updateHtml}</div>
    </div>
  </div>`;
}

function sortProperties(props) {
  return props.sort((a,b) => {
    const aPhase = a.current_phase || '';
    const bPhase = b.current_phase || '';
    const aClosed = aPhase === 'Closed';
    const bClosed = bPhase === 'Closed';
    if (aClosed !== bClosed) return aClosed ? 1 : -1;
    const aProspecting = aPhase === 'Prospecting';
    const bProspecting = bPhase === 'Prospecting';
    if (aProspecting !== bProspecting) return aProspecting ? 1 : -1;
    const aDays = daysUntil(a.closing_date);
    const bDays = daysUntil(b.closing_date);
    if (aDays !== null && bDays !== null) return aDays - bDays;
    if (aDays !== null) return -1;
    if (bDays !== null) return 1;
    return 0;
  });
}

async function loadDashboard() {
  try {
    const resp = await fetch('properties_data.json?t=' + Date.now());
    const data = await resp.json();
    const props = data.properties || [];
    const sorted = sortProperties(props);

    const active = props.filter(p => p.current_phase !== 'Closed' && p.current_phase !== 'Prospecting').length;
    const approaching = props.filter(p => { const d = daysUntil(p.closing_date); return d !== null && d > 0 && d <= 14 && p.current_phase !== 'Closed'; }).length;
    const rehab = props.filter(p => p.current_phase === 'Repairs / Rehab').length;
    const closed = props.filter(p => p.current_phase === 'Closed').length;

    document.getElementById('subtitle').textContent = `Last updated: ${data.last_updated || 'Unknown'} | ${props.length} properties tracked`;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><b>${active}</b> <span style="color:#9ca3af;">Active</span></div>
      <div class="stat"><b>${approaching}</b> <span style="color:#9ca3af;">Approaching Closing</span></div>
      <div class="stat"><b>${rehab}</b> <span style="color:#9ca3af;">In Rehab</span></div>
      <div class="stat" style="border:1px solid #22c55e44;"><b style="color:#22c55e;">${closed}</b> <span style="color:#22c55e99;">Closed</span></div>
    `;
    document.getElementById('container').innerHTML = sorted.map(renderCard).join('');
  } catch(e) {
    document.getElementById('container').innerHTML = `<div class="loading" style="color:#ef4444;">Error loading data: ${e.message}</div>`;
  }
}

loadDashboard();
</script>
</body>
</html>
