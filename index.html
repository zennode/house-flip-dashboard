<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Flip Closing Coordinator</title>
<style>
  :root{
    --bg:#0f1117; --card-bg:#1a1d27; --border:#272b38; --text:#e6e8ee;
    --muted:#8b91a3; --accent:#ff9900; --green:#34d399; --blue:#3b82f6;
    --gray:#3a3f4d; --red:#f87171; --yellow:#fbbf24; --chip:#232735;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:50;background:rgba(15,17,23,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
    padding:16px 24px}
  .h-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{font-size:20px;margin:0;font-weight:700}
  h1 .dot{color:var(--accent)}
  .updated{font-size:12px;color:var(--muted)}
  .stats{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
  .stat{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;
    padding:8px 14px;min-width:96px}
  .stat .num{font-size:22px;font-weight:700}
  .stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  main{padding:24px;max-width:1280px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px}
  .card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;
    padding:18px;display:flex;flex-direction:column;gap:14px}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .addr{font-size:16px;font-weight:700}
  .city{font-size:12px;color:var(--muted)}
  .badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .badge.phase{background:rgba(59,130,246,.16);color:#9cc2ff;border:1px solid rgba(59,130,246,.4)}
  .badge.closed{background:rgba(52,211,153,.16);color:#7ee9c4;border:1px solid rgba(52,211,153,.4)}
  .badge.src{background:var(--chip);color:var(--muted);border:1px solid var(--border)}
  .countdown{background:rgba(255,153,0,.1);border:1px solid rgba(255,153,0,.35);
    border-radius:10px;padding:8px 12px;font-size:13px}
  .countdown b{color:var(--accent)}
  .timeline{display:flex;align-items:center;gap:0;margin:4px 0}
  .tl-step{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0}
  .tl-dot{width:13px;height:13px;border-radius:50%;background:var(--gray);
    border:2px solid var(--gray);z-index:2}
  .tl-dot.done{background:var(--green);border-color:var(--green)}
  .tl-dot.active{background:var(--blue);border-color:var(--blue);
    box-shadow:0 0 0 4px rgba(59,130,246,.25)}
  .tl-row{display:flex;align-items:center;width:100%;justify-content:center;position:relative}
  .tl-line{height:2px;flex:1;background:var(--gray)}
  .tl-line.done{background:var(--green)}
  .tl-line.hidden{visibility:hidden}
  .tl-label{font-size:8.5px;color:var(--muted);margin-top:5px;text-align:center;
    line-height:1.15;max-width:62px}
  .tl-label.active{color:#9cc2ff;font-weight:600}
  .sections{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sec{background:rgba(255,255,255,.02);border:1px solid var(--border);
    border-radius:10px;padding:10px 12px}
  .sec.full{grid-column:1 / -1}
  .sec h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);font-weight:700}
  .kv{display:flex;justify-content:space-between;font-size:13px;gap:8px;padding:2px 0}
  .kv .k{color:var(--muted)}
  .kv .v{font-weight:600;text-align:right}
  .contact{font-size:13px;padding:2px 0}
  .contact .role{color:var(--muted);font-size:11px}
  ul.items{margin:0;padding-left:16px;font-size:12.5px}
  ul.items li{margin-bottom:5px}
  ul.items li.urgent{color:var(--red);font-weight:600}
  .updates{display:flex;flex-direction:column;gap:8px}
  .upd{font-size:12.5px;border-left:2px solid var(--accent);padding-left:10px}
  .upd .d{color:var(--muted);font-size:11px}
  .empty{color:var(--muted);font-size:12px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  @media(max-width:520px){.sections{grid-template-columns:1fr}main{padding:16px}}
</style>
</head>
<body>
<header>
  <div class="h-top">
    <h1>House Flip Closing Coordinator <span class="dot">&#9679;</span></h1>
    <div class="updated" id="updated">Loading&hellip;</div>
  </div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <div class="grid" id="grid"></div>
</main>
<footer>Auto-generated daily by the House Flip Closing Coordinator &middot; data from Gmail</footer>

<script>
const MONEY = n => (typeof n === 'number') ? '$' + n.toLocaleString('en-US') : n;
const FIN_LABELS = {
  purchase_price:'Purchase', rehab_cost:'Rehab', rehab_estimate:'Rehab Est.',
  rehab_estimate_range:'Rehab Est.', listing_price:'List', sale_price:'Sale Price',
  asking_price:'Asking', arv:'ARV', arv_estimate:'ARV Est.',
  buyer_concession_request:'Buyer Concession', prior_price_reduction:'Prior Reduction',
  units:'Units', unit_type:'Unit Type'
};
const REHAB_MS = ['Demo/Rehab','Repairs / Rehab','Repairs/Rehab','Rehab'];
const CLOSE_MS = ['Closing','Closed'];

function fmtFin(k,v){
  if(k==='rehab_estimate_range' && typeof v==='string' && v.includes('-')){
    const [a,b]=v.split('-'); return MONEY(+a)+' - '+MONEY(+b);
  }
  if(typeof v==='number' && k!=='units') return MONEY(v);
  if(typeof v==='string' && /^\d+(-\d+)?$/.test(v)){
    if(v.includes('-')){const[a,b]=v.split('-');return MONEY(+a)+' - '+MONEY(+b);}
    return MONEY(+v);
  }
  return v;
}

function srcBadges(p){
  const set=new Set();
  if(p.source) set.add(p.source);
  const blob=JSON.stringify(p.recent_updates||[]).toLowerCase();
  if(blob.includes('dotloop')) set.add('dotloop');
  if(blob.includes('docusign')) set.add('DocuSign');
  if(blob.includes('inspection report')||blob.includes('attached')) set.add('PDF');
  if(set.size===0) set.add('Email');
  return [...set];
}

function daysTo(dateStr){
  const d=new Date(dateStr); if(isNaN(d)) return null;
  return Math.ceil((d - new Date())/(1000*60*60*24));
}

function timeline(p){
  const ms=p.milestones||[];
  const done=new Set(p.completed_milestones||[]);
  const cur=p.current_milestone;
  let html='<div class="timeline">';
  ms.forEach((m,i)=>{
    const isDone=done.has(m) && m!==cur;
    const isActive=m===cur;
    const cls=isActive?'active':(isDone?'done':'');
    const lineLeft=(i===0)?'hidden':(done.has(ms[i-1])?'done':'');
    const lineRight=(i===ms.length-1)?'hidden':(isDone?'done':'');
    html+=`<div class="tl-step">
      <div class="tl-row">
        <div class="tl-line ${lineLeft}"></div>
        <div class="tl-dot ${cls}"></div>
        <div class="tl-line ${lineRight}"></div>
      </div>
      <div class="tl-label ${isActive?'active':''}">${m}</div>
    </div>`;
  });
  return html+'</div>';
}

function card(p){
  const phaseClass=(p.current_milestone==='Closed')?'closed':'phase';
  const badges=srcBadges(p).map(s=>`<span class="badge src">${s}</span>`).join('');
  // countdown
  let cd='';
  const cdate=p.closing_date;
  if(cdate){const d=daysTo(cdate);
    if(d!==null) cd=`<div class="countdown">Closing in <b>${d} day${d===1?'':'s'}</b> &middot; ${cdate}</div>`;}
  // financials
  const fin=p.financials||{};
  const finRows=Object.keys(fin).map(k=>`<div class="kv"><span class="k">${FIN_LABELS[k]||k}</span><span class="v">${fmtFin(k,fin[k])}</span></div>`).join('')||'<div class="empty">No financials</div>';
  // contacts
  const contacts=(p.contacts||[]).map(c=>`<div class="contact">${c.name}<div class="role">${c.role||''}</div></div>`).join('')||'<div class="empty">No contacts</div>';
  // dates
  const dates=(p.important_dates||[]).map(d=>`<div class="kv"><span class="k">${d.label||d.name}</span><span class="v">${d.date}</span></div>`).join('');
  const datesSec = (dates||cdate)?`<div class="sec"><h3>Important Dates</h3>${cdate?`<div class="kv"><span class="k">Closing</span><span class="v">${cdate}</span></div>`:''}${dates}</div>`:'';
  // action items
  const items=(p.action_items||[]).map(a=>{
    const urgent=/urgent|asap|risk|overdue|immediately|past due/i.test(a);
    return `<li class="${urgent?'urgent':''}">${a}</li>`;
  }).join('');
  const itemsSec=items?`<div class="sec full"><h3>Action Items</h3><ul class="items">${items}</ul></div>`:'';
  // updates (latest 4)
  const ups=(p.recent_updates||[]).slice(0,4).map(u=>`<div class="upd"><div class="d">${u.date}</div>${u.note}</div>`).join('')||'<div class="empty">No updates</div>';

  return `<div class="card">
    <div class="card-head">
      <div><div class="addr">${p.address}</div><div class="city">${p.city||''}${p.state?', '+p.state:''}</div></div>
      <div class="badges"><span class="badge ${phaseClass}">${p.current_milestone}</span>${badges}</div>
    </div>
    ${cd}
    ${timeline(p)}
    <div class="sections">
      <div class="sec"><h3>Financials</h3>${finRows}</div>
      <div class="sec"><h3>Key Contacts</h3>${contacts}</div>
      ${datesSec}
      ${itemsSec}
      <div class="sec full"><h3>Recent Updates</h3><div class="updates">${ups}</div></div>
    </div>
  </div>`;
}

function render(data){
  const props=data.properties||[];
  const active=props.filter(p=>p.status!=='closed').length;
  const atClosing=props.filter(p=>CLOSE_MS.includes(p.current_milestone)).length;
  const inRehab=props.filter(p=>REHAB_MS.includes(p.current_milestone)).length;
  const upd=data.last_updated?new Date(data.last_updated):null;
  document.getElementById('updated').textContent='Last updated: '+
    (upd?upd.toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'}):'unknown');
  document.getElementById('stats').innerHTML=
    `<div class="stat"><div class="num">${active}</div><div class="lbl">Active Properties</div></div>
     <div class="stat"><div class="num">${atClosing}</div><div class="lbl">At Closing</div></div>
     <div class="stat"><div class="num">${inRehab}</div><div class="lbl">In Rehab</div></div>
     <div class="stat"><div class="num">${props.length}</div><div class="lbl">Total Tracked</div></div>`;
  // sort: closing first, then rehab/contract, prospecting last
  const order=m=>({'Closed':0,'Closing':1,'Financing':2,'Final Walkthrough':2,'Appraisal':3,'Inspections':3,'Under Contract':4,'Title & Escrow':4,'Listed':5,'Demo/Rehab':6,'Repairs / Rehab':6,'Prospecting':9,'Offer Made':8}[m]??7);
  props.sort((a,b)=>order(a.current_milestone)-order(b.current_milestone));
  document.getElementById('grid').innerHTML=props.map(card).join('');
}

fetch('./properties_data.json',{cache:'no-store'})
  .then(r=>r.json()).then(render)
  .catch(e=>{document.getElementById('grid').innerHTML='<div class="empty">Failed to load properties_data.json: '+e+'</div>';});
</script>
</body>
</html>
