<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>House Flip Closing Coordinator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1117;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.hdr{position:sticky;top:0;z-index:100;background:#0f1117ee;backdrop-filter:blur(10px);border-bottom:1px solid #2d3348;padding:16px 24px}
.hdr h1{font-size:22px;color:#f8fafc}
.meta{color:#6b7280;font-size:13px;margin-top:4px}
.stats{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap}
.stat{background:#1a1d27;border-radius:8px;padding:8px 16px;display:flex;align-items:center;gap:8px}
.stat .n{font-size:24px;font-weight:700}
.stat .l{font-size:12px;color:#9ca3af}
.ctn{max-width:1200px;margin:0 auto;padding:16px 24px}
.card{background:#1a1d27;border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid #2d3348}
.card-hdr{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.card h2{margin:0;color:#f8fafc;font-size:18px}
.badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;color:#fff}
.src{padding:2px 6px;border-radius:4px;font-size:10px;margin-left:4px}
.tl{display:flex;gap:2px;margin:12px 0;align-items:flex-start}
.dot{width:14px;height:14px;border-radius:50%;margin:0 auto}
.dot-l{font-size:9px;color:#9ca3af;text-align:center;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px;margin-top:8px}
.sec{background:#111827;border-radius:6px;padding:10px;margin:4px 0}
.sec-t{color:#60a5fa;font-size:11px;font-weight:600;margin-bottom:4px}
.sec-t.warn{color:#f59e0b}
.row{display:flex;justify-content:space-between;padding:2px 0}
.row .k{color:#9ca3af}.row .v{color:#e2e8f0}
.ct{padding:2px 0}.ct .n{color:#e2e8f0}.ct .r{color:#6b7280;font-size:11px}
.ai{padding:2px 0;color:#e2e8f0}.ai.urg{color:#ef4444;font-weight:600}
.up{padding:3px 0;border-bottom:1px solid #1f2937}.up .d{color:#6b7280;font-size:11px}.up .t{color:#d1d5db;font-size:12px}
.cd{margin:8px 0}
</style>
</head>
<body>
<div class="hdr"><h1>House Flip Closing Coordinator</h1><div class="meta" id="meta"></div><div class="stats" id="stats"></div></div>
<div class="ctn" id="cards"></div>
<script>
const MS=["Offer Made","Under Contract","Title & Escrow","Inspections","Appraisal","Financing","Repairs/Rehab","Final Walkthrough","Closing","Closed"];
const MC={"Offer Made":"#6366f1","Under Contract":"#8b5cf6","Title & Escrow":"#a855f7","Inspections":"#ec4899","Appraisal":"#f43f5e","Financing":"#f97316","Repairs/Rehab":"#eab308","Final Walkthrough":"#84cc16","Closing":"#22c55e","Closed":"#10b981","Prospecting":"#64748b"};
const SC={"dotloop":"#3b82f6","DocuSign":"#f59e0b","PDF":"#ef4444","Email":"#6b7280"};
const today=new Date("2026-06-03");

function cd(d){if(!d)return"";const c=new Date(d),diff=Math.round((c-today)/864e5);if(diff<0)return'<span style="color:#ef4444;font-weight:700">'+Math.abs(diff)+' DAYS PAST DUE</span>';if(diff===0)return'<span style="color:#f59e0b;font-weight:700">CLOSING TODAY</span>';if(diff<=7)return'<span style="color:#f59e0b;font-weight:700">'+diff+' days to close</span>';return'<span style="color:#22c55e">'+diff+' days to close</span>';}

function dots(m){const idx=MS.indexOf(m);return MS.map((s,i)=>{const c=i<idx?"#22c55e":i===idx?"#3b82f6":"#4b5563";return'<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:0"><div class="dot" style="background:'+c+'" title="'+s+'"></div><span class="dot-l">'+s+'</span></div>';}).join("");}

function render(data){
document.getElementById("meta").innerHTML="Last updated: "+data.last_updated+" &bull; Dashboard auto-refreshes via GitHub Pages";
const p=data.properties;
const active=p.filter(x=>x.current_milestone!=="Closed"&&x.current_milestone!=="Prospecting");
const closing=p.filter(x=>x.current_milestone==="Closing");
const rehab=p.filter(x=>x.current_milestone==="Repairs/Rehab");
const prospect=p.filter(x=>x.current_milestone==="Prospecting");
document.getElementById("stats").innerHTML='<div class="stat"><span class="n" style="color:#3b82f6">'+active.length+'</span><span class="l">Active</span></div><div class="stat"><span class="n" style="color:#22c55e">'+closing.length+'</span><span class="l">At Closing</span></div><div class="stat"><span class="n" style="color:#eab308">'+rehab.length+'</span><span class="l">In Rehab</span></div><div class="stat"><span class="n" style="color:#64748b">'+prospect.length+'</span><span class="l">Prospecting</span></div>';

const sorted=p.slice().sort((a,b)=>{const ma=a.current_milestone,mb=b.current_milestone;if(ma==="Closed"&&mb!=="Closed")return 1;if(ma!=="Closed"&&mb==="Closed")return-1;if(ma==="Prospecting"&&mb!=="Prospecting")return 1;if(ma!=="Prospecting"&&mb==="Prospecting")return-1;return MS.indexOf(mb)-MS.indexOf(ma);});

let h="";
sorted.forEach(pr=>{
const m=pr.current_milestone;
const cdt=cd(pr.closing_date);
const badges='<span class="badge" style="background:'+(MC[m]||"#64748b")+'">'+m+'</span>'+(pr.sources||[]).map(s=>'<span class="src" style="background:'+(SC[s]||"#6b7280")+'33;color:'+(SC[s]||"#6b7280")+'">'+s+'</span>').join("");
const timeline=m!=="Prospecting"?'<div class="tl">'+dots(m)+'</div>':"";
const fin=Object.entries(pr.financials||{}).map(([k,v])=>'<div class="row"><span class="k">'+k.replace(/_/g," ")+'</span><span class="v">'+v+'</span></div>').join("")||'<span style="color:#4b5563">â</span>';
const cts=(pr.contacts||[]).slice(0,5).map(c=>'<div class="ct"><span class="n">'+c.name+'</span> <span class="r">('+c.role+')</span></div>').join("")||'<span style="color:#4b5563">â</span>';
const ais=(pr.action_items||[]).map(a=>'<div class="ai'+(a.includes("URGENT")||a.includes("PAST DUE")||a.includes("TOMORROW")?" urg":"")+'">\u2022 '+a+'</div>').join("");
const ups=(pr.recent_updates||[]).slice(0,3).map(u=>'<div class="up"><span class="d">'+u.date+'</span><div class="t">'+u.note+'</div></div>').join("");
h+='<div class="card"><div class="card-hdr"><h2>'+pr.address+'</h2><div>'+badges+'</div></div>'+(cdt?'<div class="cd">'+cdt+'</div>':"")+timeline+'<div class="grid"><div class="sec"><div class="sec-t">FINANCIALS</div>'+fin+'</div><div class="sec"><div class="sec-t">KEY CONTACTS</div>'+cts+'</div></div>'+(ais?'<div class="sec"><div class="sec-t warn">ACTION ITEMS</div>'+ais+'</div>':'')+(ups?'<div class="sec"><div class="sec-t">RECENT UPDATES</div>'+ups+'</div>':'')+'</div>';
});
document.getElementById("cards").innerHTML=h;
}

fetch("properties_data.json").then(r=>r.json()).then(render).catch(()=>{document.getElementById("cards").innerHTML="<p>Error loading data</p>";});
</script>
</body>
</html>
