<title>House Flip Closing Coordinator</title>
<style>
:root {
  --bg: #0f1117;
  --card-bg: #1a1d27;
  --text: #e1e4e8;
  --text-secondary: #8b949e;
  --accent: #58a6ff;
  --success: #3fb950;
  --warning: #d29922;
  --danger: #f85149;
  --border: #30363d;
  --card-hover: #21252f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif; line-height: 1.5; }

/* Header */
.header {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(135deg, #161922 0%, #1a1d27 100%);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  backdrop-filter: blur(10px);
}
.header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
.header h1 { font-size: 1.4rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
.header h1 span { color: var(--accent); }
.header-meta { font-size: 0.8rem; color: var(--text-secondary); }
.stats-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.stat-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;
  background: rgba(255,255,255,0.05); border: 1px solid var(--border);
}
.stat-badge .num { font-size: 1.1rem; }
.stat-badge.total .num { color: var(--accent); }
.stat-badge.active .num { color: var(--success); }
.stat-badge.closed .num { color: var(--text-secondary); }
.stat-badge.closing .num { color: var(--warning); }
.stat-badge.rehab .num { color: #f0883e; }
.stat-badge.prospect .num { color: #bc8cff; }

/* Main */
.main { max-width: 1400px; margin: 0 auto; padding: 24px; }
.section-title {
  font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text-secondary); margin: 28px 0 16px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.section-title:first-child { margin-top: 0; }

/* Card Grid */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 20px; }
@media (max-width: 500px) { .card-grid { grid-template-columns: 1fr; } }

/* Property Card */
.card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px; transition: border-color 0.2s, box-shadow 0.2s;
}
.card:hover { border-color: var(--accent); box-shadow: 0 0 20px rgba(88,166,255,0.08); }
.card.closed-card { opacity: 0.65; }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
.card-address { font-size: 1.05rem; font-weight: 700; color: var(--text); line-height: 1.3; }
.phase-badge {
  display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.7rem;
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap;
}
.phase-prospecting { background: rgba(188,140,255,0.15); color: #bc8cff; }
.phase-under-contract { background: rgba(88,166,255,0.15); color: #58a6ff; }
.phase-title-escrow { background: rgba(210,153,34,0.15); color: #d29922; }
.phase-inspections { background: rgba(240,136,62,0.15); color: #f0883e; }
.phase-appraisal { background: rgba(219,171,255,0.15); color: #dbabff; }
.phase-financing { background: rgba(121,192,255,0.15); color: #79c0ff; }
.phase-repairs-rehab { background: rgba(240,136,62,0.15); color: #f0883e; }
.phase-final-walkthrough { background: rgba(63,185,80,0.15); color: #3fb950; }
.phase-closing { background: rgba(210,153,34,0.15); color: #d29922; }
.phase-closed { background: rgba(139,148,158,0.15); color: #8b949e; }

/* Source Badges */
.source-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.source-badge {
  font-size: 0.65rem; font-weight: 600; padding: 2px 8px; border-radius: 8px;
  text-transform: uppercase; letter-spacing: 0.04em;
}
.source-dotloop { background: rgba(163,113,247,0.2); color: #a371f7; }
.source-email { background: rgba(88,166,255,0.2); color: #58a6ff; }
.source-pdf { background: rgba(240,136,62,0.2); color: #f0883e; }

/* Countdown */
.countdown {
  background: rgba(248,81,73,0.1); border: 1px solid rgba(248,81,73,0.3);
  border-radius: 8px; padding: 8px 12px; margin-bottom: 14px;
  font-size: 0.8rem; color: var(--danger); font-weight: 600;
}
.countdown.past { background: rgba(139,148,158,0.1); border-color: rgba(139,148,158,0.3); color: var(--text-secondary); }

/* Milestone Timeline */
.milestone-timeline { display: flex; align-items: center; gap: 0; margin-bottom: 16px; padding: 8px 0; overflow-x: auto; }
.milestone-dot-wrap { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 0; position: relative; }
.milestone-dot {
  width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border);
  background: transparent; position: relative; z-index: 2; flex-shrink: 0;
}
.milestone-dot.completed { background: var(--success); border-color: var(--success); }
.milestone-dot.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px rgba(88,166,255,0.5); }
.milestone-dot.pending { background: transparent; border-color: var(--border); }
.milestone-label {
  font-size: 0.55rem; color: var(--text-secondary); text-align: center;
  margin-top: 4px; line-height: 1.2; max-width: 52px; word-wrap: break-word;
}
.milestone-dot.active + .milestone-label { color: var(--accent); font-weight: 600; }
.milestone-line {
  flex: 1; height: 2px; background: var(--border); min-width: 4px;
}
.milestone-line.completed { background: var(--success); }

/* Detail Sections */
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 500px) { .detail-grid { grid-template-columns: 1fr; } }
.detail-section {
  background: rgba(255,255,255,0.02); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px;
}
.detail-section.full-width { grid-column: 1 / -1; }
.detail-title {
  font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-secondary); margin-bottom: 8px;
}
.detail-item { font-size: 0.8rem; color: var(--text); padding: 3px 0; }
.detail-item .label { color: var(--text-secondary); }
.action-item {
  font-size: 0.8rem; color: var(--warning); padding: 4px 0;
  padding-left: 14px; position: relative;
}
.action-item::before { content: "\25B6"; position: absolute; left: 0; font-size: 0.6rem; top: 5px; }
.action-item.urgent { color: var(--danger); font-weight: 600; }
.update-item { font-size: 0.78rem; padding: 4px 0; border-bottom: 1px solid rgba(48,54,61,0.5); }
.update-item:last-child { border-bottom: none; }
.update-date { color: var(--accent); font-weight: 600; font-size: 0.7rem; }
.update-source { color: var(--text-secondary); font-size: 0.65rem; }
.contact-item { display: flex; justify-content: space-between; padding: 3px 0; font-size: 0.8rem; }
.contact-role { color: var(--text-secondary); font-size: 0.7rem; }
.fin-item { display: flex; justify-content: space-between; padding: 3px 0; font-size: 0.8rem; }
.fin-label { color: var(--text-secondary); }
.fin-value { font-weight: 600; color: var(--success); }
.empty-state { font-size: 0.75rem; color: var(--text-secondary); font-style: italic; }
</style>
</head>

const MILESTONES = [
  "Offer Made", "Under Contract", "Title & Escrow", "Inspections", "Appraisal",
  "Financing", "Repairs / Rehab", "Final Walkthrough", "Closing", "Closed"
];

function milestoneIndex(m) {
  // Prospecting maps to before Offer Made (index -1 effectively)
  if (m === "Prospecting") return -1;
  return MILESTONES.indexOf(m);
}

function phaseClass(m) {
  const map = {
    "Prospecting": "phase-prospecting",
    "Offer Made": "phase-under-contract",
    "Under Contract": "phase-under-contract",
    "Title & Escrow": "phase-title-escrow",
    "Inspections": "phase-inspections",
    "Appraisal": "phase-appraisal",
    "Financing": "phase-financing",
    "Repairs / Rehab": "phase-repairs-rehab",
    "Final Walkthrough": "phase-final-walkthrough",
    "Closing": "phase-closing",
    "Closed": "phase-closed"
  };
  return map[m] || "phase-prospecting";
}

function sourceClass(s) {
  return "source-" + s.toLowerCase();
}

function formatFinKey(k) {
  return k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function formatFinVal(k, v) {
  if (typeof v === 'string' && /^\d+$/.test(v)) {
    return '$' + Number(v).toLocaleString();
  }
  if (typeof v === 'string' && v.includes('-') && /^\d/.test(v)) {
    return '$' + v.replace(/(\d+)/g, (m) => Number(m).toLocaleString());
  }
  return v;
}

function getCountdown(dateStr) {
  if (!dateStr) return null;
  const parts = dateStr.split('/');
  const d = new Date(parts[2], parts[0]-1, parts[1]);
  const now = new Date(2026, 4, 16); // May 16, 2026
  const diff = Math.ceil((d - now) / (1000*60*60*24));
  return diff;
}

function renderTimeline(currentMilestone) {
  const idx = milestoneIndex(currentMilestone);
  let html = '<div class="milestone-timeline">';
  MILESTONES.forEach((m, i) => {
    let cls = 'pending';
    if (currentMilestone === "Closed") {
      cls = 'completed';
    } else if (i < idx) {
      cls = 'completed';
    } else if (i === idx) {
      cls = 'active';
    }
    // For Prospecting, all are pending
    if (currentMilestone === "Prospecting") cls = 'pending';

    html += '<div class="milestone-dot-wrap">';
    html += `<div class="milestone-dot ${cls}"></div>`;
    html += `<div class="milestone-label">${m}</div>`;
    html += '</div>';
    if (i < MILESTONES.length - 1) {
      let lineCls = 'milestone-line';
      if (currentMilestone === "Closed" || i < idx - 1 || (i < idx)) lineCls += ' completed';
      if (currentMilestone === "Prospecting") lineCls = 'milestone-line';
      html += `<div class="${lineCls}"></div>`;
    }
  });
  html += '</div>';
  return html;
}

  const hasFin = Object.keys(p.financials).length > 0;
  const hasContacts = p.contacts.length > 0;
  const hasActions = p.action_items.length > 0;

        countdown = `<div class="countdown">Closing TODAY (${p.closing_date})</div>`;
      } else {
        countdown = `<div class="countdown">${days} day(s) until closing (${p.closing_date})</div>`;
      }

    let items = Object.entries(p.financials).map(([k,v]) =>

    ).join('');
    detailSections += `<div class="detail-section"><div class="detail-title">Financials</div>${items}</div>`;
  }

  // Contacts
  if (hasContacts) {
    let items = p.contacts.map(c =>
      `<div class="contact-item"><span>${c.name}</span><span class="contact-role">${c.role}</span></div>`
    ).join('');
    detailSections += `<div class="detail-section"><div class="detail-title">Key Contacts</div>${items}</div>`;
  }

  if (p.closing_date) {

  }

    let items = p.recent_updates.slice(0, 4).map(u => {

  }

  return `<div class="card ${isClosed ? 'closed-card' : ''}">
    <div class="card-header">
      <div class="card-address">${p.address}</div>
      <span class="phase-badge ${phaseClass(p.current_milestone)}">${p.current_milestone}</span>
    </div>
    <div class="source-badges">${sources}</div>
    ${countdown}
    ${renderTimeline(p.current_milestone)}
    ${detailGrid}
  </div>`;
}

// Sort: active first by milestone progress desc, then closed
const props = [...DATA.properties];
props.sort((a, b) => {
  const aClosed = a.current_milestone === "Closed" ? 1 : 0;
  const bClosed = b.current_milestone === "Closed" ? 1 : 0;
  if (aClosed !== bClosed) return aClosed - bClosed;
  return milestoneIndex(b.current_milestone) - milestoneIndex(a.current_milestone);
});

const active = props.filter(p => p.current_milestone !== "Closed");
const closed = props.filter(p => p.current_milestone === "Closed");

let html = '';
html += '<div class="section-title">Active Properties (' + active.length + ')</div>';
html += '<div class="card-grid">' + active.map(renderCard).join('') + '</div>';
html += '<div class="section-title">Closed Properties (' + closed.length + ')</div>';
html += '<div class="card-grid">' + closed.map(renderCard).join('') + '</div>';

document.getElementById('app').innerHTML = html;
</script>
</body>
</html>
