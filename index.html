<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--card-bg:#1a1d27;--card-border:#2a2d3a;--text:#e0e0e0;--text-muted:#8a8d9a;--accent:#4a9eff;--green:#34d399;--yellow:#fbbf24;--red:#f87171;--blue:#60a5fa;--purple:#a78bfa;--orange:#fb923c}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5}
.header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#1a1d27 0%,#252836 100%);border-bottom:1px solid var(--card-border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-meta{font-size:.8rem;color:var(--text-muted)}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{background:rgba(74,158,255,.08);border:1px solid rgba(74,158,255,.2);border-radius:8px;padding:8px 16px;text-align:center}
.stat-num{font-size:1.3rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.container{max-width:1400px;margin:0 auto;padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:20px;transition:border-color .2s}
.card:hover{border-color:var(--accent)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:8px}
.card-address{font-size:1.1rem;font-weight:600}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.badge-closed{background:rgba(52,211,153,.15);color:var(--green)}
.badge-closing{background:rgba(251,191,36,.15);color:var(--yellow)}
.badge-rehab{background:rgba(251,146,60,.15);color:var(--orange)}
.badge-contract{background:rgba(96,165,250,.15);color:var(--blue)}
.badge-financing{background:rgba(167,139,250,.15);color:var(--purple)}
.badge-title{background:rgba(167,139,250,.15);color:var(--purple)}
.badge-inspections{background:rgba(96,165,250,.15);color:var(--blue)}
.badge-prospecting{background:rgba(138,141,154,.15);color:var(--text-muted)}
.source-badges{display:flex;gap:4px;margin:8px 0}
.src-badge{font-size:.6rem;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.06);color:var(--text-muted)}
.countdown{font-size:.8rem;color:var(--yellow);margin:6px 0}
.timeline{display:flex;align-items:center;gap:0;margin:16px 0;padding:8px 0}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;position:relative}
.dot-done{background:var(--green)}
.dot-active{background:var(--blue);box-shadow:0 0 8px var(--blue)}
.dot-pending{background:#2a2d3a;border:1px solid #3a3d4a}
.dot-line{flex:1;height:2px;background:#2a2d3a;min-width:4px}
.dot-line-done{background:var(--green)}
.dot-label{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:.5rem;color:var(--text-muted);white-space:nowrap;display:none}
.dot:first-child .dot-label,.dot-active .dot-label,.dot:last-child .dot-label{display:block}
.sections{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.section{background:rgba(255,255,255,.02);border-radius:8px;padding:10px}
.section-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:6px;font-weight:600}
.section-item{font-size:.78rem;color:var(--text);padding:2px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.section-item:last-child{border-bottom:none}
.section-item-label{color:var(--text-muted);font-size:.7rem}
.action-item{color:var(--yellow);font-size:.78rem;padding:2px 0}
.action-item::before{content:'â¡ '}
.update-date{color:var(--accent);font-size:.65rem;margin-right:4px}
.full-width{grid-column:1/-1}
@media(max-width:500px){.cards{grid-template-columns:1fr}.sections{grid-template-columns:1fr}.header{flex-direction:column;align-items:flex-start}}
</style>
</head>

const milestones = ['Offer Made','Under Contract','Title & Escrow','Inspections','Appraisal','Financing','Repairs / Rehab','Final Walkthrough','Closing','Closed'];

function getMilestoneIndex(m){return milestones.indexOf(m)}
function getBadgeClass(m){
  if(m==='Closed') return 'badge-closed';
  if(m==='Closing') return 'badge-closing';
  if(m==='Repairs / Rehab') return 'badge-rehab';
  if(m==='Under Contract') return 'badge-contract';
  if(m==='Financing') return 'badge-financing';
  if(m==='Title & Escrow') return 'badge-title';
  if(m==='Inspections') return 'badge-inspections';
  if(m==='Prospecting') return 'badge-prospecting';
  return 'badge-contract';
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const parts = dateStr.split('/');
  const d = new Date(parts[2],parts[0]-1,parts[1]);
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.ceil((d-now)/(1000*60*60*24));
}

function renderTimeline(current){
  const idx = getMilestoneIndex(current);
  let html = '<div class="timeline">';
  milestones.forEach((m,i)=>{
    if(i>0) html += '<div class="dot-line'+(i<=idx?' dot-line-done':'')+'"></div>';
    let cls = 'dot ';
    if(i<idx) cls += 'dot-done';
    else if(i===idx) cls += 'dot-active';
    else cls += 'dot-pending';
    html += '<div class="'+cls+'"><span class="dot-label">'+m+'</span></div>';
  });
  html += '</div>';
  return html;
}

function renderCard(p){
  const days = daysUntil(p.closing_date);
  let html = '<div class="card">';
  html += '<div class="card-header"><div class="card-address">'+p.address+'</div>';
  html += '<span class="badge '+getBadgeClass(p.current_milestone)+'">'+p.current_milestone+'</span></div>';
  if(p.sources && p.sources.length){
    html += '<div class="source-badges">';
    p.sources.forEach(s=>html+='<span class="src-badge">'+s+'</span>');
    html += '</div>';
  }
  if(days!==null){
    if(days>0) html += '<div class="countdown">ð '+days+' day'+(days!==1?'s':'')+' to closing ('+p.closing_date+')</div>';
    else if(days===0) html += '<div class="countdown" style="color:var(--red)">ð´ CLOSING TODAY ('+p.closing_date+')</div>';
    else html += '<div class="countdown" style="color:var(--text-muted)">Closed '+Math.abs(days)+' days ago ('+p.closing_date+')</div>';
  }
  if(p.current_milestone!=='Prospecting') html += renderTimeline(p.current_milestone);
  html += '<div class="sections">';
  if(p.financials && Object.keys(p.financials).length){
    html += '<div class="section"><div class="section-title">Financials</div>';
    Object.entries(p.financials).forEach(([k,v])=>{
      const label = k.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase());
      html += '<div class="section-item"><span class="section-item-label">'+label+':</span> '+v+'</div>';
    });
    html += '</div>';
  }
  if(p.contacts && p.contacts.length){
    html += '<div class="section"><div class="section-title">Key Contacts</div>';
    p.contacts.forEach(c=>html+='<div class="section-item">'+c.name+' <span class="section-item-label">('+c.role+')</span></div>');
    html += '</div>';
  }
  if(p.closing_date){
    html += '<div class="section"><div class="section-title">Important Dates</div>';
    html += '<div class="section-item"><span class="section-item-label">Closing:</span> '+p.closing_date+'</div>';
    html += '</div>';
  }
  if(p.action_items && p.action_items.length){
    html += '<div class="section"><div class="section-title">Action Items</div>';
    p.action_items.forEach(a=>html+='<div class="action-item">'+a+'</div>');
    html += '</div>';
  }
  if(p.recent_updates && p.recent_updates.length){
    html += '<div class="section full-width"><div class="section-title">Recent Updates</div>';
    p.recent_updates.slice(0,3).forEach(u=>{
      html += '<div class="section-item">';
      if(u.date) html += '<span class="update-date">'+u.date+'</span>';
      html += u.subject;
      if(u.source) html += ' <span class="src-badge">'+u.source+'</span>';
      html += '</div>';
    });
    html += '</div>';
  }
  html += '</div></div>';
  return html;
}
function render(){
  const props = DATA.properties;
  const active = props.filter(p=>p.current_milestone!=='Closed'&&p.current_milestone!=='Prospecting');
  const atClosing = props.filter(p=>p.current_milestone==='Closing');
  const inRehab = props.filter(p=>p.current_milestone==='Repairs / Rehab');
  const updated = new Date(DATA.last_updated);
  const timeStr = updated.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric'+hour:'numeric",minute:'2-digit',timeZoneName:'short'});
  document.body.innerHTML = `<div class="header"><div><h1>ð  House Flip Closing Coordinator</h1><div class="header-meta">Last updated: ${timeStr}</div></div><div class="stats"><div class="stat"><div class="stat-num">${active.length}</div><div class="stat-label">Active Properties</div></div><div class="stat"><div class="stat-num">${atClosing.length}</div><div class="stat-label">At Closing</div></div><div class="stat"><div class="stat-num">${inRehab.length}</div><div class="stat-label">In Rehab</div></div></div></div><div class="container"><div class="cards">${props.filter(p=>p.current_milestone!=='Closed'&&p.current_milestone!=='Prospecting').map(renderCard).join('')}${props.filter(p=>p.current_milestone==='Prospecting').map(renderCard).join('')}${props.filter(p=>p.current_milestone==='Closed').map(renderCard).join('')}</div></div>`;}
render();
</script>
