<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Flip Closing Coordinator</title>
<style>
  :root {
    --bg: #0f1117;
    --card-bg: #1a1d27;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --border: #2d3148;
    --card-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(15,17,23,0.97);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
  }
  .header-inner {
    max-width: 1600px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    padding: 14px 0;
  }
  .header-title-block { flex: 1; min-width: 200px; }
  .header-title-block h1 {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
  }
  .header-title-block .updated {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .header-stats { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .stat-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .stat-badge .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .stat-badge .count { font-weight: 700; font-size: 13px; }
  .filter-bar {
    max-width: 1600px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  main { max-width: 1600px; margin: 0 auto; padding: 0 24px 40px; }
  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin: 20px 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    box-shadow: var(--card-shadow);
    transition: border-color 0.15s, transform 0.1s;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card:hover { border-color: #3d4166; transform: translateY(-1px); }
  .card.urgent-card { border-left: 3px solid var(--danger); }
  .card.warning-card { border-left: 3px solid var(--warning); }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-address { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.3; flex: 1; }
  .card-address .state { color: var(--text-muted); font-weight: 400; }
  .phase-badge {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .phase-Closed { background: rgba(34,197,94,0.15); color: var(--success); border: 1px solid rgba(34,197,94,0.3); }
  .phase-Prospecting { background: rgba(148,163,184,0.1); color: var(--text-muted); border: 1px solid rgba(148,163,184,0.2); }
  .phase-active { background: rgba(59,130,246,0.15); color: var(--accent); border: 1px solid rgba(59,130,246,0.3); }
  .phase-Inspections { background: rgba(245,158,11,0.15); color: var(--warning); border: 1px solid rgba(245,158,11,0.3); }
  .phase-urgent { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
  .meta-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .source-pill {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .source-dotloop { background: rgba(59,130,246,0.12); color: #60a5fa; }
  .source-email { background: rgba(148,163,184,0.1); color: var(--text-muted); }
  .source-pdf { background: rgba(245,158,11,0.1); color: var(--warning); }
  .countdown {
    margin-left: auto;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .countdown.days-ok { background: rgba(34,197,94,0.12); color: var(--success); }
  .countdown.days-warn { background: rgba(245,158,11,0.15); color: var(--warning); }
  .countdown.days-urgent { background: rgba(239,68,68,0.15); color: var(--danger); }
  .countdown.closed-tag { background: rgba(148,163,184,0.1); color: var(--text-muted); }
  .timeline-section { }
  .timeline-dots { display: flex; gap: 0; align-items: flex-start; }
  .milestone-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    position: relative;
  }
  .milestone-wrap:not(:last-child)::after {
    content: '';
    position: absolute;
    top: 7px;
    left: calc(50% + 7px);
    right: calc(-50% + 7px);
    height: 2px;
    background: #374151;
    z-index: 0;
  }
  .milestone-wrap.ms-done:not(:last-child)::after { background: var(--success); }
  .milestone-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    position: relative;
    z-index: 1;
    flex-shrink: 0;
  }
  .milestone-dot.done { background: var(--success); }
  .milestone-dot.active { background: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.25); }
  .milestone-dot.pending { background: #374151; }
  .milestone-label {
    font-size: 8px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.2;
    max-width: 36px;
    word-break: break-word;
  }
  .milestone-label.lbl-active { color: var(--accent); font-weight: 700; }
  .milestone-label.lbl-done { color: #4ade80; }
  .data-sections { display: flex; flex-direction: column; gap: 10px; }
  .data-section-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .financials-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .fin-label { font-size: 10px; color: var(--text-muted); }
  .fin-value { font-size: 13px; font-weight: 600; color: var(--text); }
  .action-list { list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .action-item {
    display: flex;
    gap: 7px;
    align-items: flex-start;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
  }
  .action-item::before { content: '\00B7'; color: var(--accent); flex-shrink: 0; }
  .action-item.urgent { color: var(--danger); font-weight: 600; }
  .action-item.urgent::before { color: var(--danger); }
  .action-item.critical {
    color: #ff6b6b;
    font-weight: 700;
    background: rgba(239,68,68,0.07);
    border-radius: 4px;
    padding: 3px 6px;
  }
  .action-item.critical::before { color: var(--danger); }
  @media (max-width: 768px) {
    header { padding: 0 14px; }
    .filter-bar { padding: 12px 14px; }
    main { padding: 0 14px 40px; }
    .card-grid { grid-template-columns: 1fr; }
    .header-stats { gap: 6px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="header-title-block">
      <h1>House Flip Closing Coordinator</h1>
      <div class="updated">Last updated: May 28, 2026 6:02 PM EDT</div>
    </div>
    <div class="header-stats" id="headerStats"></div>
  </div>
</header>
<div class="filter-bar">
  <button class="filter-btn active" data-filter="all">All Properties</button>
  <button class="filter-btn" data-filter="active">Active</button>
  <button class="filter-btn" data-filter="Repairs/Rehab">Repairs/Rehab</button>
  <button class="filter-btn" data-filter="Inspections">Inspections</button>
  <button class="filter-btn" data-filter="Under Contract">Under Contract</button>
  <button class="filter-btn" data-filter="Prospecting">Prospecting</button>
  <button class="filter-btn" data-filter="Closed">Closed</button>
</div>
<main id="main"></main>
<script>
const MILESTONES = ['Offer Made','Under Contract','Title & Escrow','Inspections','Appraisal','Financing','Repairs/Rehab','Final Walkthrough','Closing','Closed'];
const PHASE_IDX = {'Offer Made':0,'Under Contract':1,'Title & Escrow':2,'Inspections':3,'Appraisal':4,'Financing':5,'Repairs/Rehab':6,'Final Walkthrough':7,'Closing':8,'Closed':9,'Prospecting':-1};
const ACTIVE_PHASES = ['Under Contract','Title & Escrow','Inspections','Appraisal','Financing','Repairs/Rehab','Final Walkthrough','Closing'];

const properties = [
  {id:1,address:'297 Breckwood Blvd',city_state:'Springfield, MA 01109',phase:'Closed',closed_date:'2026-04-13',sources:['dotloop','Email'],actions:[]},
  {id:2,address:'29 Chestnut Dr',city_state:'Belchertown, MA 01007',phase:'Closed',closed_date:'2026-04-14',sources:['dotloop','Email'],actions:[]},
  {id:3,address:'4 School St',city_state:'Ware, MA 01082',phase:'Financing',sources:['Email','PDF'],actions:[{text:'Follow up on closing date once financing finalizes',level:'normal'}]},
  {id:4,address:'167 East Park Terrace',city_state:'Pittsfield, MA 01201',phase:'Repairs/Rehab',closed_date:'2026-05-07',sources:['Email','PDF'],financials:{purchase:'$166k','rehab cap':'$50k',rate:'12%','boiler est':'$5.5-6k'},actions:[{text:'Review Pinnacle billing Acct #45006',level:'normal'},{text:'Finalize rehab scope under $50k',level:'normal'},{text:'Confirm boiler timeline',level:'normal'}]},
  {id:5,address:'70 Town Hill Road',city_state:'Middlefield, MA 01243',phase:'Closed',sources:['Email'],actions:[]},
  {id:6,address:'40 Roland St',city_state:'Pittsfield, MA 01201',phase:'Closed',closed_date:'2026-05-22',sources:['Email','dotloop'],actions:[{text:'Confirm check deposited to Freedom (~$6k)',level:'normal'},{text:'Final bills due end of May',level:'normal'},{text:'Reconciliation target 6/15 or 7/15',level:'normal'}]},
  {id:7,address:'21 Holly St',city_state:'Greenfield, MA',phase:'Repairs/Rehab',sources:['Email'],actions:[{text:'Follow up on reissued check for 3 Evergreen',level:'normal'}]},
  {id:8,address:'1874 Home Rd',city_state:'Sheffield, MA',phase:'Under Contract',sources:['Email','dotloop'],financials:{listing:'$450k',offer:'Near $450k'},actions:[{text:'Review/counter P&S terms',level:'normal'},{text:'Obtain buyer proof of funds',level:'normal'},{text:'Schedule closing',level:'normal'}]},
  {id:9,address:'1 Richmond Ln',city_state:'Pittsfield, MA',phase:'Repairs/Rehab',sources:['Email','PDF'],actions:[{text:'Confirm appliance delivery (was 5/21)',level:'normal'},{text:'Shed demo can proceed',level:'normal'},{text:'Follow up carpenter ants',level:'normal'},{text:'Push electrician',level:'normal'}]},
  {id:10,address:'42 Washington St',city_state:'Monson, MA 01057',phase:'Inspections',closing_date:'2026-06-29',sources:['dotloop','Email'],financials:{purchase:'$335k','loan type':'FHA'},actions:[{text:'URGENT: Alice drafting repair response',level:'urgent'},{text:'Mold remediation required',level:'urgent'},{text:'Powder post beetles - FHA documentation needed',level:'urgent'},{text:'Ridge vent',level:'normal'},{text:'Collar ties',level:'normal'},{text:'Crawl space supports',level:'normal'}]},
  {id:11,address:'54 Sectar Rd',city_state:'Ashford, CT 06278',phase:'Under Contract',sources:['dotloop','Email'],actions:[]},
  {id:12,address:'282-284 Suffolk Street',city_state:'Holyoke, MA',phase:'Prospecting',sources:[],actions:[]},
  {id:13,address:'140 Egremont Plain Rd',city_state:'Egremont, MA 01230',phase:'Prospecting',sources:[],financials:{arv:'$1.2-1.3M'},actions:[{text:'Review CMA',level:'normal'},{text:'Evaluate fluff vs full rehab',level:'normal'},{text:'Determine offer',level:'normal'}]},
  {id:14,address:'213 Brodie Mountain Rd',city_state:'Hancock, MA 01237',phase:'Closed',sources:[],actions:[]},
  {id:15,address:'11 Bryant St',city_state:'Springfield, MA',phase:'Closed',sources:[],actions:[{text:'Final payment - confirm listing',level:'normal'},{text:'Track YB settlement $8,670.50',level:'normal'}]},
  {id:16,address:'100 Central St (New Property)',city_state:'',phase:'Repairs/Rehab',sources:[],actions:[]},
  {id:17,address:'300 Tyler St',city_state:'Pittsfield, MA 01201',phase:'Title & Escrow',sources:[],actions:[]},
  {id:18,address:'166 East St',city_state:'Stafford, CT 06076',phase:'Under Contract',sources:[],actions:[]},
  {id:19,address:'583 Hawks Spur Rd',city_state:'Plymouth, VT',phase:'Prospecting',sources:[],actions:[]},
  {id:20,address:'103 Prospect St',city_state:'Springfield, MA',phase:'Inspections',sources:[],actions:[{text:'CRITICAL: Eviction court TODAY May 28',level:'critical'},{text:'Review violations',level:'urgent'},{text:'Await revised offer',level:'normal'},{text:'Do NOT contact Code Enforcement',level:'urgent'}]},
  {id:21,address:'172 Fiske St',city_state:'Southbridge, MA',phase:'Prospecting',sources:[],financials:{'arv 2br':'$379.9k','arv 3br':'$440-480k'},actions:[{text:'Evaluate MBR suite conversion',level:'normal'},{text:'Await Antonio feedback',level:'normal'}]},
  {id:22,address:'26 Old Putnam Rd Ext',city_state:'Plainfield, CT 06239',phase:'Prospecting',sources:[],financials:{arv:'$429k'},actions:[{text:'Review CMA',level:'normal'},{text:'Assess sloping backyard',level:'normal'},{text:'Determine offer',level:'normal'}]},
  {id:23,address:'412 Saint James Ave',city_state:'Springfield, MA 01109',phase:'Title & Escrow',sources:[],financials:{entity:'Yellowbrick Property LLC','auction loan':'$45k'},actions:[{text:'Finalize title vesting',level:'normal'},{text:'Complete insurance application',level:'normal'},{text:'Correct entity name with Brock & Scott',level:'normal'}]},
  {id:24,address:'141 St. Jerome Ave',city_state:'Holyoke, MA',phase:'Closed',closed_date:'2026-03-30',sources:[],financials:{'outstanding bir':'$2,090'},actions:[{text:'Pay BIR bill',level:'urgent'},{text:'Finalize profit numbers',level:'normal'}]},
  {id:25,address:'205 Old Stage Road',city_state:'Hatfield, MA',phase:'Repairs/Rehab',sources:[],actions:[{text:'Court date June 1, 9am - Hadley',level:'urgent'},{text:'Coordinate with Kate for property access',level:'normal'},{text:'Schedule lock change after court',level:'normal'}]},
  {id:26,address:'60 Shaker Rd',city_state:'E Longmeadow, MA',phase:'Inspections',sources:[],financials:{insurance:'The Hartford'},actions:[{text:'Insurance inspection June 4',level:'normal'},{text:'Prepare property',level:'normal'}]}
];

let currentFilter = 'all';

function daysToClosing(d) {
  if (!d) return null;
  const today = new Date('2026-05-28');
  const close = new Date(d + 'T00:00:00');
  return Math.ceil((close - today) / 86400000);
}

function formatDate(d) {
  if (!d) return null;
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'});
}

function urgencyScore(p) {
  const hasCrit = p.actions.some(a => a.level === 'critical');
  const hasUrgent = p.actions.some(a => a.level === 'urgent');
  const days = p.closing_date ? daysToClosing(p.closing_date) : null;
  if (hasCrit) return 1000;
  if (days !== null && days >= 0 && days <= 14) return 900 + (14 - days);
  if (hasUrgent) return 800;
  if (days !== null && days >= 0 && days <= 45) return 700 + (45 - days);
  return 0;
}

function sortProps(arr) {
  const active = arr.filter(p => ACTIVE_PHASES.includes(p.phase)).sort((a,b) => urgencyScore(b) - urgencyScore(a));
  const prospecting = arr.filter(p => p.phase === 'Prospecting');
  const closed = arr.filter(p => p.phase === 'Closed');
  return {active, prospecting, closed};
}

function timeline(phase) {
  const idx = PHASE_IDX[phase];
  let html = '<div class="timeline-dots">';
  for (let i = 0; i < MILESTONES.length; i++) {
    let dotCls, lblCls, wrapCls = '';
    if (idx === -1) { dotCls = 'pending'; lblCls = ''; }
    else if (i < idx) { dotCls = 'done'; lblCls = 'lbl-done'; wrapCls = 'ms-done'; }
    else if (i === idx) { dotCls = 'active'; lblCls = 'lbl-active'; }
    else { dotCls = 'pending'; lblCls = ''; }
    const lbl = MILESTONES[i].replace(' ', '<br>');
    html += `<div class="milestone-wrap ${wrapCls}"><div class="milestone-dot ${dotCls}"></div><div class="milestone-label ${lblCls}">${lbl}</div></div>`;
  }
  html += '</div>';
  return html;
}

function sourcePills(sources) {
  if (!sources || !sources.length) return '';
  return sources.map(s => {
    const cls = s.toLowerCase().replace(/[^a-z]/g,'');
    return `<span class="source-pill source-${cls}">${s}</span>`;
  }).join('');
}

function countdown(p) {
  if (p.closing_date) {
    const d = daysToClosing(p.closing_date);
    if (d < 0) return `<span class="countdown closed-tag">CLOSED</span>`;
    if (d <= 14) return `<span class="countdown days-urgent">${d}d to closing</span>`;
    if (d <= 30) return `<span class="countdown days-warn">${d}d to closing</span>`;
    return `<span class="countdown days-ok">${d}d to closing</span>`;
  }
  if (p.phase === 'Closed') {
    const lbl = p.closed_date ? `Closed ${formatDate(p.closed_date)}` : 'CLOSED';
    return `<span class="countdown closed-tag">${lbl}</span>`;
  }
  return '';
}

function financials(fin) {
  if (!fin || !Object.keys(fin).length) return '';
  let items = '';
  for (const [k,v] of Object.entries(fin)) {
    const label = k.charAt(0).toUpperCase() + k.slice(1);
    items += `<div class="fin-item"><div class="fin-label">${label}</div><div class="fin-value">${v}</div></div>`;
  }
  return `<div class="data-section"><div class="data-section-title">Financials</div><div class="financials-grid">${items}</div></div>`;
}

function actions(acts) {
  if (!acts || !acts.length) return '';
  const items = acts.map(a => {
    const cls = a.level === 'critical' ? 'critical' : a.level === 'urgent' ? 'urgent' : '';
    return `<li class="action-item ${cls}">${a.text}</li>`;
  }).join('');
  return `<div class="data-section"><div class="data-section-title">Action Items</div><ul class="action-list">${items}</ul></div>`;
}

function phaseBadge(p) {
  if (p.phase === 'Closed') return 'phase-Closed';
  if (p.phase === 'Prospecting') return 'phase-Prospecting';
  if (p.phase === 'Inspections') return p.actions.some(a => a.level === 'critical') ? 'phase-urgent' : 'phase-Inspections';
  return p.actions.some(a => a.level === 'critical') ? 'phase-urgent' : 'phase-active';
}

function cardBorder(p) {
  const hasCrit = p.actions.some(a => a.level === 'critical');
  const hasUrgent = p.actions.some(a => a.level === 'urgent');
  const days = p.closing_date ? daysToClosing(p.closing_date) : null;
  if (hasCrit || (days !== null && days >= 0 && days <= 7)) return 'urgent-card';
  if (hasUrgent || (days !== null && days >= 0 && days <= 20)) return 'warning-card';
  return '';
}

function card(p) {
  const addr = p.city_state ? `${p.address}, <span class="state">${p.city_state}</span>` : p.address;
  const src = sourcePills(p.sources);
  const cd = countdown(p);
  const meta = (src || cd) ? `<div class="meta-row">${src}${cd}</div>` : '';
  const fin = financials(p.financials);
  const act = actions(p.actions);
  const data = (fin || act) ? `<div class="data-sections">${fin}${act}</div>` : '';
  return `<div class="card ${cardBorder(p)}">
    <div class="card-header">
      <div class="card-address">${addr}</div>
      <span class="phase-badge ${phaseBadge(p)}">${p.phase}</span>
    </div>
    ${meta}
    ${timeline(p.phase)}
    ${data}
  </div>`;
}

function stats() {
  const active = properties.filter(p => ACTIVE_PHASES.includes(p.phase)).length;
  const rehab = properties.filter(p => p.phase === 'Repairs/Rehab').length;
  const insp = properties.filter(p => p.phase === 'Inspections').length;
  const closed = properties.filter(p => p.phase === 'Closed').length;
  document.getElementById('headerStats').innerHTML = `
    <div class="stat-badge"><div class="dot" style="background:var(--accent)"></div><span class="count">${active}</span>&nbsp;Active</div>
    <div class="stat-badge"><div class="dot" style="background:var(--warning)"></div><span class="count">${rehab}</span>&nbsp;In Rehab</div>
    <div class="stat-badge"><div class="dot" style="background:var(--warning)"></div><span class="count">${insp}</span>&nbsp;Inspections</div>
    <div class="stat-badge"><div class="dot" style="background:var(--success)"></div><span class="count">${closed}</span>&nbsp;Closed</div>
  `;
}

function filtered() {
  if (currentFilter === 'all') return properties;
  if (currentFilter === 'active') return properties.filter(p => ACTIVE_PHASES.includes(p.phase));
  if (currentFilter === 'Closed') return properties.filter(p => p.phase === 'Closed');
  if (currentFilter === 'Prospecting') return properties.filter(p => p.phase === 'Prospecting');
  return properties.filter(p => p.phase === currentFilter);
}

function render() {
  const {active, prospecting, closed} = sortProps(filtered());
  let html = '';
  if (active.length) html += `<div class="section-label">Active Properties (${active.length})</div><div class="card-grid">${active.map(card).join('')}</div>`;
  if (prospecting.length) html += `<div class="section-label">Prospecting (${prospecting.length})</div><div class="card-grid">${prospecting.map(card).join('')}</div>`;
  if (closed.length) html += `<div class="section-label">Closed (${closed.length})</div><div class="card-grid">${closed.map(card).join('')}</div>`;
  if (!html) html = `<div style="padding:40px;text-align:center;color:var(--text-muted);">No properties match this filter.</div>`;
  document.getElementById('main').innerHTML = html;
}

document.querySelector('.filter-bar').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  currentFilter = btn.dataset.filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
});

stats();
render();
</script>
</body>
</html>
