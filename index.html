.header-stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{text-align:center;padding:6px 14px;background:var(--card-bg);border-radius:8px;border:1px solid var(--card-border)}
.stat-val{font-size:1.3rem;font-weight:700}
.stat-label{font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.last-updated{font-size:.75rem;color:var(--text-muted)}
.container{max-width:1400px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:20px;transition:transform .2s}
.card:hover{transform:translateY(-2px)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:8px}
.card-address{font-size:1.1rem;font-weight:600}
.badge{padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.badge-closed{background:rgba(0,184,148,.15);color:#00b894}
.badge-closing{background:rgba(9,132,227,.15);color:#74b9ff}
.badge-rehab{background:rgba(253,203,110,.15);color:#fdcb6e}
.badge-financing{background:rgba(108,92,231,.15);color:#a29bfe}
.badge-contract{background:rgba(255,234,167,.15);color:#ffeaa7}
.badge-prospect{background:rgba(139,143,163,.15);color:#8b8fa3}
.badge-titleescrow{background:rgba(0,206,209,.15);color:#00ced1}
.badge-appraisal{background:rgba(255,165,0,.15);color:#ffa500}
.badge-inspection{background:rgba(255,107,107,.15);color:#ff6b6b}
.badge-walkthrough{background:rgba(46,213,115,.15);color:#2ed573}
.source-badges{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.src{padding:2px 8px;border-radius:4px;font-size:.65rem;background:rgba(108,92,231,.1);color:var(--accent);border:1px solid rgba(108,92,231,.2)}
.countdown{font-size:.8rem;color:var(--orange);margin-bottom:10px;font-weight:500}
.timeline{display:flex;align-items:center;gap:0;margin:14px 0;justify-content:space-between}
.dot-wrap{display:flex;flex-direction:column;align-items:center;flex:1}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--card-border)}
.dot.completed{background:var(--green);border-color:var(--green)}
.dot.active{background:var(--blue);border-color:var(--blue);box-shadow:0 0 8px rgba(9,132,227,.5)}
.dot.pending{background:transparent;border-color:#3a3d4a}
.dot-label{font-size:.5rem;color:var(--text-muted);margin-top:3px;text-align:center;width:45px;line-height:1.1}
.line{height:2px;flex:1;margin:0 -2px}
.line.completed{background:var(--green)}
.line.pending{background:#3a3d4a}
.section{margin-top:14px}
.section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:6px;font-weight:600}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-item{font-size:.8rem}
.info-label{color:var(--text-muted);font-size:.7rem}
.contact{font-size:.8rem;padding:2px 0}
.contact-role{color:var(--text-muted);font-size:.7rem}
.date-item,.action-item,.update-item{font-size:.78rem;padding:4px 0;border-bottom:1px solid rgba(42,45,58,.5)}
.action-item::before{content:"â¸ ";color:var(--accent)}
.update-date{color:var(--text-muted);font-size:.65rem}
.update-src{font-size:.6rem;padding:1px 5px;border-radius:3px;background:rgba(108,92,231,.1);color:var(--accent);margin-left:4px}
.new-tag{background:var(--red);color:#fff;font-size:.6rem;padding:1px 6px;border-radius:3px;margin-left:6px;font-weight:600;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@media(max-width:500px){.grid{grid-template-columns:1fr}.header{flex-direction:column;align-items:flex-start}}
</style>

const milestones = ["Offer Made","Under Contract","Title & Escrow","Inspections","Appraisal","Financing","Repairs / Rehab","Final Walkthrough","Closing","Closed"];

function getMilestoneIndex(m){
  const i = milestones.indexOf(m);
  return i >= 0 ? i : (m === "Prospecting" ? -1 : 0);
}

function getBadgeClass(m){
  const map = {"Closed":"closed","Closing":"closing","Repairs / Rehab":"rehab","Financing":"financing","Under Contract":"contract","Prospecting":"prospect","Title & Escrow":"titleescrow","Appraisal":"appraisal","Inspections":"inspection","Final Walkthrough":"walkthrough"};
  return map[m] || "prospect";
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const parts = dateStr.split('/');
  const d = new Date(parts[2], parts[0]-1, parts[1]);
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.ceil((d - now) / 86400000);
}

function formatMoney(v){
  if(!v) return '';
  const n = parseFloat(v);
  return isNaN(n) ? v : '$' + n.toLocaleString();
}

function renderCard(p){
  const mi = getMilestoneIndex(p.current_milestone);
  const days = daysUntil(p.closing_date);
  let countdownHtml = '';
  if(p.closing_date && p.current_milestone !== 'Closed'){
    if(days !== null){
      if(days < 0) countdownHtml = '<div class="countdown">Closing was ' + Math.abs(days) + ' days ago</div>';
      else if(days === 0) countdownHtml = '<div class="countdown" style="color:var(--red)">CLOSING TODAY</div>';
      else countdownHtml = '<div class="countdown">' + days + ' days to closing (' + p.closing_date + ')</div>';
    }
  }

  let timelineHtml = '';
  if(mi >= 0){
    timelineHtml = '<div class="timeline">';
    for(let i=0;i<milestones.length;i++){
      const cls = i < mi ? 'completed' : (i === mi ? 'active' : 'pending');
      if(i > 0) timelineHtml += '<div class="line ' + (i <= mi ? 'completed' : 'pending') + '"></div>';
      timelineHtml += '<div class="dot-wrap"><div class="dot '+cls+'"></div><div class="dot-label">'+milestones[i].replace('Repairs / Rehab','Rehab')+'</div></div>';
    }
    timelineHtml += '</div>';
  }

  const fins = p.financials || {};
  const finKeys = Object.keys(fins);
  let finHtml = '';
  if(finKeys.length){
    finHtml = '<div class="section"><div class="section-title">Financials</div><div class="info-grid">';
    finKeys.forEach(k => {
      const label = k.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase());
      const val = fins[k];
      finHtml += '<div class="info-item"><div class="info-label">'+label+'</div>'+(/^\d/.test(val) && !/%/.test(val) ? formatMoney(val) : val)+'</div>';
    });
    finHtml += '</div></div>';
  }

  const contacts = (p.contacts||[]).slice(0,6);
  let contactHtml = '';
  if(contacts.length){
    contactHtml = '<div class="section"><div class="section-title">Key Contacts</div>';
    contacts.forEach(c => { contactHtml += '<div class="contact">'+c.name+' <span class="contact-role">â '+c.role+'</span></div>'; });
    if((p.contacts||[]).length > 6) contactHtml += '<div class="contact" style="color:var(--text-muted)">+' + (p.contacts.length-6) + ' more</div>';
    contactHtml += '</div>';
  }

  const actions = (p.action_items||[]).slice(0,5);
  let actionHtml = '';
  if(actions.length){
    actionHtml = '<div class="section"><div class="section-title">Action Items</div>';
    actions.forEach(a => { actionHtml += '<div class="action-item">'+a+'</div>'; });
    actionHtml += '</div>';
  }

  const updates = (p.recent_updates||[]).slice(0,4);
  let updateHtml = '';
  if(updates.length){
    updateHtml = '<div class="section"><div class="section-title">Recent Updates</div>';
    updates.forEach(u => {
      updateHtml += '<div class="update-item">';
      if(u.date) updateHtml += '<span class="update-date">'+u.date+'</span> ';
      updateHtml += u.subject;
      if(u.source) updateHtml += '<span class="update-src">'+u.source+'</span>';
      updateHtml += '</div>';
    });
    updateHtml += '</div>';
  }

  const srcHtml = (p.sources||[]).map(s => '<span class="src">'+s+'</span>').join('');

  const isNew = (p.recent_updates||[]).some(u => u.date === '2026-05-01');
  const newTag = isNew ? '<span class="new-tag">NEW TODAY</span>' : '';

  return '<div class="card"><div class="card-header"><div class="card-address">'+p.address+newTag+'</div><span class="badge badge-'+getBadgeClass(p.current_milestone)+'">'+p.current_milestone+'</span></div><div class="source-badges">'+srcHtml+'</div>'+countdownHtml+timelineHtml+finHtml+contactHtml+actionHtml+updateHtml+'</div>';
}

function render(){
  const props = DATA.properties;
  const order = ["Closing","Final Walkthrough","Financing","Title & Escrow","Appraisal","Inspections","Under Contract","Repairs / Rehab","Offer Made","Prospecting","Closed"];
  props.sort((a,b) => {
    const ai = order.indexOf(a.current_milestone);
    const bi = order.indexOf(b.current_milestone);
    return (ai===-1?99:ai) - (bi===-1?99:bi);
  });

  let active=0, closing=0, rehab=0, closed=0;
  props.forEach(p => {
    if(p.current_milestone==='Closed') closed++;
    else{
      active++;
      if(p.current_milestone==='Closing'||p.current_milestone==='Final Walkthrough') closing++;
      if(p.current_milestone==='Repairs / Rehab') rehab++;
    }
  });
  document.getElementById('totalActive').textContent = active;
  document.getElementById('totalClosing').textContent = closing;
  document.getElementById('totalRehab').textContent = rehab;
  document.getElementById('totalClosed').textContent = closed;

  document.getElementById('cards').innerHTML = props.map(renderCard).join('');
}
render();
