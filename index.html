<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Flip Closing Coordinator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--card-bg:#1a1d27;--card-border:#2a2d3a;--text:#e2e8f0;--text-dim:#8892a8;--accent:#3b82f6;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--orange:#f97316;--purple:#a855f7}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#1a1d27 0%,#0f1117 100%);border-bottom:1px solid var(--card-border);padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,#3b82f6,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-meta{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.stat{text-align:center;padding:6px 16px;background:rgba(59,130,246,0.1);border-radius:8px;border:1px solid rgba(59,130,246,0.2)}
.stat-val{font-size:1.25rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px}
.updated{font-size:.75rem;color:var(--text-dim)}
.container{max-width:1400px;margin:0 auto;padding:24px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:24px;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.3)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:8px}
.address{font-size:1.1rem;font-weight:600;flex:1}
.phase-badge{padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:600;white-space:nowrap}
.phase-closed{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.3)}
.phase-closing{background:rgba(249,115,22,.15);color:#f97316;border:1px solid rgba(249,115,22,.3)}
.phase-rehab{background:rgba(168,85,247,.15);color:#a855f7;border:1px solid rgba(168,85,247,.3)}
.phase-financing{background:rgba(234,179,8,.15);color:#eab308;border:1px solid rgba(234,179,8,.3)}
.phase-contract{background:rgba(59,130,246,.15);color:#3b82f6;border:1px solid rgba(59,130,246,.3)}
.phase-title{background:rgba(20,184,166,.15);color:#14b8a6;border:1px solid rgba(20,184,166,.3)}
.phase-inspections{background:rgba(236,72,153,.15);color:#ec4899;border:1px solid rgba(236,72,153,.3)}
.phase-prospecting{background:rgba(107,114,128,.15);color:#9ca3af;border:1px solid rgba(107,114,128,.3)}
.phase-offer{background:rgba(99,102,241,.15);color:#6366f1;border:1px solid rgba(99,102,241,.3)}
.source-badges{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.source-badge{font-size:.65rem;padding:2px 8px;border-radius:4px;background:rgba(255,255,255,.05);color:var(--text-dim);border:1px solid var(--card-border)}
.countdown{font-size:.8rem;color:var(--orange);margin-bottom:12px;font-weight:500}
.milestone-track{display:flex;align-items:center;gap:4px;margin-bottom:20px;padding:12px 0}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-done{background:var(--green)}
.dot-active{background:var(--accent);box-shadow:0 0 8px rgba(59,130,246,.6)}
.dot-pending{background:#2a2d3a}
.dot-line{flex:1;height:2px;min-width:4px}
.line-done{background:var(--green)}
.line-active{background:var(--accent)}
.line-pending{background:#2a2d3a}
.section{margin-bottom:14px}
.section-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);margin-bottom:6px;font-weight:600}
.section-content{font-size:.85rem;color:var(--text);line-height:1.5}
.contact-list,.update-list,.action-list{list-style:none}
.contact-list li,.update-list li,.action-list li{padding:3px 0;font-size:.82rem;color:var(--text-dim)}
.contact-list li strong{color:var(--text);font-weight:500}
.update-list li{border-left:2px solid var(--card-border);padding-left:10px;margin-bottom:6px}
.update-date{color:var(--accent);font-size:.72rem;font-weight:600}
.action-list li{padding-left:16px;position:relative}
.action-list li::before{content:"!";position:absolute;left:0;color:var(--orange);font-weight:700;font-size:.8rem}
.fin-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.fin-item{display:flex;justify-content:space-between;font-size:.82rem}
.fin-label{color:var(--text-dim)}
.fin-value{color:var(--text);font-weight:500}
.empty-note{color:var(--text-dim);font-style:italic;font-size:.8rem}
@media(max-width:500px){.grid{grid-template-columns:1fr}.header{padding:16px}.header h1{font-size:1.2rem}}
</style>
</head>
<body>
<div class="header">
<div>
<h1>House Flip Closing Coordinator</h1>
<div class="updated" id="lastUpdated"></div>
</div>

<div class="stat"><div class="stat-val" id="closedCount">0</div><div class="stat-label">Closed</div></div>
</div>
</div>
<div class="container"><div class="grid" id="cards"></div></div>
<script>
const DATA={"last_updated": "2026-05-13T18:00:00-04:00", "properties": [{"address": "297 Breckwood Blvd, Springfield, MA 01109", "current_milestone": "Closed", "closing_date": "4/13/2026", "sources": ["dotloop", "Email"], "contacts": [{"name": "Alice Kempf", "role": "Agent"}, {"name": "David Burstein", "role": "Attorney"}, {"name": "Jessica Sicard", "role": "Project Manager"}], "financials": {}, "recent_updates": [{"date": "2026-04-13", "subject": "Closing date reached", "source": "Email"}, {"subject": "Repairs priority", "source": "Email"}, {"subject": "FHA Amendatory signed", "source": "dotloop"}], "action_items": []}, {"address": "29 Chestnut Dr, Belchertown, MA 01007", "current_milestone": "Closed", "closing_date": "4/14/2026", "sources": ["dotloop", "Email"], "contacts": [{"name": "Alice Kempf", "role": "Agent"}, {"name": "David Burstein", "role": "Attorney"}, {"name": "Jessica Sicard", "role": "Project Manager"}], "financials": {}, "recent_updates": [{"date": "2026-04-14", "subject": "Closing date reached", "source": "Email"}], "action_items": []}, {"address": "4 School St, Ware, MA 01082", "current_milestone": "Financing", "closing_date": null, "sources": ["Email", "PDF"], "contacts": [{"name": "David Burstein", "role": "Attorney"}, {"name": "Jessica Sicard", "role": "Project Manager"}], "financials": {}, "recent_updates": [{"date": "2026-04-28", "subject": "Financing stage updates", "source": "Email"}], "action_items": ["Follow up on closing date once financing finalizes"]}, {"address": "167 East Park Terrace, Pittsfield, MA 01201", "current_milestone": "Financing", "closing_date": "5/7/2026", "sources": ["Email", "PDF"], "contacts": [{"name": "David Burstein", "role": "Attorney"}, {"name": "Jessica Sicard", "role": "Project Manager"}, {"name": "Will McGuire", "role": "Borrower/Signer"}], "financials": {"purchase_price": "166000", "construction_advance": "50000", "points": "4980", "rate": "12.00%", "term": "12 months", "lender_fees": "570"}, "recent_updates" "contacts": [{"name": "Jessica Sicard", "role": "Project Manager"}], "financials": {}, "recent_updates": [{"date": "2026-04-22", "subject": "Rehab work in progress", "source": "Email"}], "action_items": []}, {"address": "1 Richmond Ln, Pittsfield, MA", "current_milestone": "Repairs / Rehab", "closing_date": null, "sources": ["Email"], "contacts": [{"name": "Jessica Sicard", "role": "Project Manager"}], "financials": {}, "recent_updates": [{"date": "2026-04-22", "subject": "Rehab work in progress", "source": "Email"}], "action_items": []}, {"address": "42 Washington St, Monson, MA 01057", "current_milestone": "Repairs / Rehab", "closing_date": null, "sources": ["dotloop", "Email"], "contacts": [{"name": "Alice Kempf", "role": "Agent"}, {"name": "Jessica Sicard", "role": "Project Manager"}], "financials": {}, "recent_updates": [{"date": "2026-05-13", "subject": "Alice Kempf shared Contract To Purchase Real Estate (Offer #501) via Dotloop for review", "source": "dotloop"}, {"date": "2026-05-01", "subject": "6 listing documents signed via dotloop", "source": "dotloop"}], "action_items": ["Review and sign Contract To Purchase Real Estate (Offer #501) in Dotloop"]}, {"address": "54 Sectar Rd, Ashford, CT 06278", "current_milestone": "Under Contract", "closing_date": null, "sources": ["dotloop", "Email"], "contacts": [{"name": "Alice Kempf", "role": "Agent"}, {"name": "Jessica Sicard", "role": "Project Manager"}], "financials": {}, "recent_updates": [{"date": "2026-05-01", "subject": "Under contract; docs in dotloop", "source": "dotloop"}], "action_items": []}, {"address": "282-284 Suffolk Street, Holyoke, MA", "current_milestone": "Prospecting", "closing_date": null, "sources": ["Email"], "contacts": [], "financials": {}, "recent_updates": [], "action_items": []}, {"address": "Egremont Project, Egremont, MA", "current_milestone": "Prospecting", "closing_date": null, "sources": ["Email"], "contacts": [], "financials": {}, "recent_updates": [], "action_items": []}, {"address": "213 Brodie Mountain Rd, Hancock, MA 01237", "current_milestone": "Closed", "closing_date": null, "sources": ["Email"], "contacts": [], "financials": {}, "recent_updates": [], "action_items": []}, {"address": "11 Bryant St, Springfield, MA", "current_milestone": "Closed", "closing_date": null, "sources": ["Email"], "contacts": [{"name": "Jessica Sicard", "role": "Project Manager"}], "financials": {}, "recent_updates": [{"date": "2026-04-29", "subject": "Detailed financial breakdown: YB owed $8,670.50 after settlement", "source": "Email"}], "action_items": ["Final payment approved; confirm listing date", "Track YB settlement amount"]}, {"address": "100 Central St (New Property)", "current_milestone": "Repairs / Rehab", "closing_date": null, "sources": ["Email"], "contacts": [], "financials": {}, "recent_updates": [{"date": "2026-04-24", "subject": "New property acquired; rehab planning", "source": "Email"}], "action_items": []}, {"address": "300 Tyler St, Pittsfield, MA 01201", "current_milestone": "Title & Escrow", "closing_date": null, "sources": ["Email", "PDF"], "contacts": [{"name": "David Burstein", "role": "Attorney"}, {"name": "Jessica Sicard", "role": "Project Manager"}], "financials": {}, "recent_updates": [{"date": "2026-05-05", "subject": "Title work in progress", "source": "Email"}], "action_items": []}, {"address": "166 East St, Stafford, CT 06076", "current_milestone": "Under Contract", "closing_date": null, "sources": ["dotloop", "Email"], "contacts": [{"name": "Alice Kempf", "role": "Agent"}], "financials": {}, "recent_updates": [{"date": "2026-05-08", "subject": "Under contract; awaiting inspections", "source": "Email"}], "action_items": []}, {"address": "583 Hawks Spur Rd, Plymouth, VT", "current_milestone": "Prospecting", "closing_date": null, "sources": ["Email"], "contacts": [], "financials": {}, "recent_updates": [], "action_items": []}, {"address": "103 Prospect St (Potential Sale)", "current_milestone": "Inspections", "closing_date": null, "sources": ["Email"], "contacts": [{"name": "Ryan O'Hara", "role": "Attorney (Bacon Wilson)"}, {"name": "Hunter Foote", "role": "Prospective Buyer (Vanderburgh)"}], "financials": {}, "recent_updates": [{"date": "2026-05-13", "subject": "Hunter Foote submitted new lower offer via attorney; Matt rejected as going backwards. O'Hara notes buyer banking on immediate close as incentive", "source": "Email"}, {"date": "2026-05-13", "subject": "Eviction court first tier event scheduled for May 28", "source": "Email"}, {"date": "2026-05-08", "subject": "Potential buyer Hunter Foote in discussions", "source": "Email"}], "action_items": ["Eviction court first tier event May 28", "Await revised offer from Hunter Foote / Vanderburgh", "Do NOT contact Code Enforcement - avoid prompting closer attention"]}]};
const MILESTONES=["Offer Made","Under Contract","Title & Escrow","Inspections","Appraisal","Financing","Repairs / Rehab","Final Walkthrough","Closing","Closed"];
function getPhaseClass(m){const l=m.toLowerCase();if(l==='closed')return'phase-closed';if(l==='closing'||l==='final walkthrough')return'phase-closing';if(l.includes('rehab')||l.includes('repair'))return'phase-rehab';if(l==='financing')return'phase-financing';if(l.includes('contract'))return'phase-contract';if(l.includes('title')||l.includes('escrow'))return'phase-title';if(l.includes('inspection')||l.includes('appraisal'))return'phase-inspections';if(l==='prospecting'||l==='offer made')return'phase-prospecting';return'phase-offer'}
function daysUntil(dateStr){if(!dateStr)return null;const parts=dateStr.split('/');const d=new Date(parts[2],parts[0]-1,parts[1]);const now=new Date();now.setHours(0,0,0,0);return Math.ceil((d-now)/(86400000))}
function buildMilestoneTrack(current){const idx=MILESTONES.indexOf(current);const ci=idx===-1?-1:idx;let h='';MILESTONES.forEach((m,i)=>{if(i>0){const lc=i<=ci?'line-done':i===ci?'line-active':'line-pending';h+=`<div class="dot-line ${lc}"></div>`}const dc=i<ci?'dot-done':i===ci?'dot-active':'dot-pending';h+=`<div class="dot ${dc}" title="${m}"></div>`});return h}
function renderCards(){const props=DATA.properties;let active=0,closing=0,rehab=0,closed=0;
props.forEach(p=>{const m=p.current_milestone;if(m==='Closed'){closed++}else{active++;if(m==='Closing'||m==='Final Walkthrough')closing++;if(m.includes('Rehab')||m.includes('Repair'))rehab++}});
document.getElementById('activeCount').textContent=active;
document.getElementById('closingCount').textContent=closing;
document.getElementById('rehabCount').textContent=rehab;
document.getElementById('closedCount').textContent=closed;
document.getElementById('lastUpdated').textContent='Last updated: '+new Date(DATA.last_updated).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'});
const sorted=[...props].sort((a,b)=>{const ai=MILESTONES.indexOf(a.current_milestone),bi=MILESTONES.indexOf(b.current_milestone);const av=ai===-1?-1:ai,bv=bi===-1?-1:bi;return av-bv});
const grid=document.getElementById('cards');
sorted.forEach(p=>{const days=daysUntil(p.closing_date);
let cd='';if(days!==null){if(days<0)cd=`<div class="countdown">Closing was ${Math.abs(days)} days ago</div>`;else if(days===0)cd='<div class="countdown">CLOSING TODAY!</div>';else cd=`<div class="countdown">${days} day${days!==1?'s':''} to closing</div>`}
let fins='';if(p.financials&&Object.keys(p.financials).length>0){const fg=Object.entries(p.financials).map(([k,v])=>`<div class="fin-item"><span class="fin-label">${k.replace(/_/g,' ')}</span><span class="fin-value">${v}</span></div>`).join('');fins=`<div class="section"><div class="section-title">Financials</div><div class="fin-grid">${fg}</div></div>`}
let contacts='';if(p.contacts&&p.contacts.length>0){const cl=p.contacts.map(c=>`<li><strong>${c.name}</strong> â ${c.role}</li>`).join('');contacts=`<div class="section"><div class="section-title">Key Contacts</div><ul class="contact-list">${cl}</ul></div>`}
let updates='';if(p.recent_updates&&p.recent_updates.length>0){const ul=p.recent_updates.slice(0,4).map(u=>`<li>${u.date?`<span class="update-date">${u.date}</span> `:''}${u.subject} <span class="source-badge">${u.source}</span></li>`).join('');updates=`<div class="section"><div class="section-title">Recent Updates</div><ul class="update-list">${ul}</ul></div>`}
let actions='';if(p.action_items&&p.action_items.length>0){const al=p.action_items.map(a=>`<li>${a}</li>`).join('');actions=`<div class="section"><div class="section-title">Action Items</div><ul class="action-list">${al}</ul></div>`}
const sb=p.sources?p.sources.map(s=>`<span class="source-badge">${s}</span>`).join(''):'';
const card=document.createElement('div');card.className='card';
card.innerHTML=`<div class="card-header"><div class="address">${p.address}</div><span class="phase-badge ${getPhaseClass(p.current_milestone)}">${p.current_milestone}</span></div>${sb?`<div class="source-badges">${sb}</div>`:''}${cd}<div class="milestone-track">${buildMilestoneTrack(p.current_milestone)}</div>${fins}${contacts}${updates}${actions}${!fins&&!contacts&&!updates&&!actions?'<div class="empty-note">No details yet</div>':''}`;
grid.appendChild(card)})}
renderCards();
</script>
</body>
