<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>House Flip Closing Coordinator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--card-bg:#1a1d27;--card-border:#2a2d3a;--text:#e1e4ed;--text-dim:#8b8fa3;--accent:#4f8cff;--green:#34d399;--yellow:#fbbf24;--red:#f87171;--blue:#60a5fa;--purple:#a78bfa;--gray:#4b5563}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0}
.header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#141722,#1a1d27);border-bottom:1px solid var(--card-border);padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,#4f8cff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-meta{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.stat{text-align:center;padding:8px 16px;background:rgba(79,140,255,0.08);border-radius:10px;border:1px solid rgba(79,140,255,0.15)}
.stat .num{font-size:1.4rem;font-weight:700;color:var(--accent)}
.stat .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);margin-top:2px}
.updated{font-size:.75rem;color:var(--text-dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px;padding:24px 32px}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:22px;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.3)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:8px}
.card-head h2{font-size:1.05rem;font-weight:600;line-height:1.3}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.badge-closed{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.25)}
.badge-closing{background:rgba(251,191,36,.12);color:var(--yellow);border:1px solid rgba(251,191,36,.25)}
.badge-rehab{background:rgba(167,139,250,.12);color:var(--purple);border:1px solid rgba(167,139,250,.25)}
.badge-financing{background:rgba(96,165,250,.12);color:var(--blue);border:1px solid rgba(96,165,250,.25)}
.badge-prospecting{background:rgba(75,85,99,.2);color:var(--text-dim);border:1px solid var(--gray)}
.badge-contract{background:rgba(251,191,36,.12);color:var(--yellow);border:1px solid rgba(251,191,36,.25)}
.badge-title{background:rgba(96,165,250,.12);color:var(--blue);border:1px solid rgba(96,165,250,.25)}
.badge-inspections{background:rgba(251,191,36,.12);color:var(--yellow);border:1px solid rgba(251,191,36,.25)}
.source-badges{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.src{font-size:.6rem;padding:2px 6px;border-radius:4px;background:rgba(79,140,255,0.1);color:var(--accent);border:1px solid rgba(79,140,255,0.2)}
.countdown{font-size:.8rem;color:var(--yellow);margin-bottom:10px;font-weight:500}
.timeline{display:flex;align-items:center;gap:0;margin:14px 0;position:relative}
.dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;position:relative;z-index:2}
.dot.done{background:var(--green)}
.dot.active{background:var(--blue);box-shadow:0 0 8px rgba(96,165,250,.5);animation:pulse 2s infinite}
.dot.pending{background:var(--gray)}
.line{flex:1;height:2px;background:var(--gray);z-index:1}
.line.done{background:var(--green)}
@keyframes pulse{0%,100%{box-shadow:0 0 4px rgba(96,165,250,.4)}50%{box-shadow:0 0 12px rgba(96,165,250,.7)}}
.timeline-labels{display:flex;justify-content:space-between;font-size:.55rem;color:var(--text-dim);margin-top:2px;padding:0 2px}
.sections{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.section{background:rgba(15,17,23,.5);border-radius:8px;padding:12px}
.section h3{font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin-bottom:8px;font-weight:600}
.section p,.section li{font-size:.78rem;color:var(--text-dim);line-height:1.5}
.section ul{list-style:none;padding:0}
.section li{padding:3px 0;border-bottom:1px solid rgba(42,45,58,.5)}
.section li:last-child{border:none}
.section li::before{content:'â ';color:var(--accent)}
.section.full{grid-column:1/-1}
.update-item{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid rgba(42,45,58,.5);font-size:.75rem}
.update-item:last-child{border:none}
.update-date{color:var(--accent);font-weight:500;white-space:nowrap;min-width:70px}
.update-src{font-size:.6rem;padding:1px 5px;border-radius:3px;background:rgba(79,140,255,0.08);color:var(--text-dim);white-space:nowrap}
.action-item{color:var(--yellow)!important}
.action-item::before{content:'â¡ '!important;color:var(--yellow)}
.empty{color:var(--gray);font-style:italic;font-size:.75rem}
@media(max-width:500px){.grid{grid-template-columns:1fr;padding:12px}.header{padding:14px}.sections{grid-template-columns:1fr}}
</style>
</head>

_updates":[{"date":"2026-05-13","subject":"Hunter Foote submitted new lower offer via attorney; Matt rejected as going backwards. O'Hara notes buyer banking on immediate close as incentive","source":"Email"},{"date":"2026-05-13","subject":"Eviction court first tier event scheduled for May 28","source":"Email"},{"date":"2026-05-08","subject":"Potential buyer Hunter Foote in discussions","source":"Email"}],"action_items":["Eviction court first tier event May 28","Await revised offer from Hunter Foote / Vanderburgh","Do NOT contact Code Enforcement - avoid prompting closer attention"]},{"address":"172 Fiske St, Southbridge, MA","current_milestone":"Prospecting","closing_date":null,"sources":["Email","PDF"],"contacts":[{"name":"Alice Kempf","role":"Agent"},{"name":"Antonio","role":"Partner (Investarters)"}],"financials":{"arv_2br":"379900","arv_3br":"439900-480000"},"recent_updates":[{"date":"2026-05-15","subject":"Alice Kempf sent CMA: 2BR ARV $379,900; 3BR ARV $439,900-$480,000. Previous listing PDF attached. Room with fireplace could be converted to MBR suite. Full bath on each floor confirmed.","source":"Email"},{"date":"2026-05-15","subject":"Matt forwarded CMA to Antonio at Investarters for review","source":"Email"}],"action_items":["Evaluate whether room can be converted to MBR suite for 3BR pricing","Await Antonio's feedback on deal viability","Review previous listing details from PDF"]}]};

function getBadgeClass(m){
  if(m==='Closed')return 'badge-closed';
  if(m==='Closing'||m==='Final Walkthrough')return 'badge-closing';
  if(m.includes('Rehab'))return 'badge-rehab';
  if(m==='Financing'||m==='Title & Escrow'||m==='Appraisal')return 'badge-financing';
  if(m==='Under Contract')return 'badge-contract';
  if(m==='Inspections')return 'badge-inspections';
  return 'badge-prospecting';
}

function daysUntil(dateStr){
  if(!dateStr)return null;
  const parts=dateStr.includes('/')?dateStr.split('/'):null;
  if(!parts)return null;
  const d=new Date(parts[2],parts[0]-1,parts[1]);
  const now=new Date();now.setHours(0,0,0,0);
  return Math.ceil((d-now)/(1000*60*60*24));
}

function renderTimeline(milestone){
  const idx=MILESTONES.indexOf(milestone);
  const isProspecting=milestone==='Prospecting';
  let html='<div class="timeline">';
  for(let i=0;i<MILESTONES.length;i++){
    let cls='pending';
    if(!isProspecting){
      if(i<idx)cls='done';
      else if(i===idx)cls='active';
    }
    html+=`<div class="dot ${cls}" title="${MILESTONES[i]}"></div>`;
    if(i<MILESTONES.length-1)html+=`<div class="line ${i<idx&&!isProspecting?'done':''}"></div>`;
  }
  html+='</div>';
  html+='<div class="timeline-labels"><span>Offer</span><span>Contract</span><span>Title</span><span>Inspect</span><span>Apprsl</span><span>Finance</span><span>Rehab</span><span>Walk</span><span>Closing</span><span>Closed</span></div>';
  return html;
}

function fmt$(v){return v?'$'+Number(v).toLocaleString():'-'}

function renderCard(p){
  const days=daysUntil(p.closing_date);
  const fin=p.financials||{};
  const hasFin=Object.keys(fin).length>0;
  let html=`<div class="card"><div class="card-head"><div><h2>${p.address}</h2><div class="source-badges">${(p.sources||[]).map(s=>`<span class="src">${s}</span>`).join('')}</div></div><span class="badge ${getBadgeClass(p.current_milestone)}">${p.current_milestone}</span></div>`;
  if(days!==null){
    if(days>0)html+=`<div class="countdown">ð ${days} day${days!==1?'s':''} to closing</div>`;
    else if(days===0)html+=`<div class="countdown" style="color:var(--red)">ð´ CLOSING TODAY</div>`;
    else html+=`<div class="countdown" style="color:var(--text-dim)">Closed ${Math.abs(days)} days ago</div>`;
  }
  html+=renderTimeline(p.current_milestone);
  html+='<div class="sections">';
  // Financials
  html+='<div class="section"><h3>Financials</h3>';
  if(hasFin){
    if(fin.purchase_price)html+=`<p>Purchase: ${fmt$(fin.purchase_price)}</p>`;
    if(fin.construction_advance)html+=`<p>Constr. Advance: ${fmt$(fin.construction_advance)}</p>`;
    if(fin.rate)html+=`<p>Rate: ${fin.rate} / ${fin.term||'-'}</p>`;
    if(fin.points)html+=`<p>Points: ${fmt$(fin.points)}</p>`;
    if(fin.lender_fees)html+=`<p>Lender Fees: ${fmt$(fin.lender_fees)}</p>`;
    if(fin.arv_2br)html+=`<p>ARV (2BR): ${fmt$(fin.arv_2br)}</p>`;
    if(fin.arv_3br)html+=`<p>ARV (3BR): $${fin.arv_3br}</p>`;
  } else {
    html+='<p class="empty">No data yet</p>';
  }
  html+='</div>';
  // Contacts
  html+='<div class="section"><h3>Key Contacts</h3>';
  if(p.contacts&&p.contacts.length){
    html+='<ul>'+p.contacts.map(c=>`<li>${c.name} <span style="color:var(--text-dim)">(${c.role})</span></li>`).join('')+'</ul>';
  } else {html+='<p class="empty">None listed</p>';}
  html+='</div>';
  // Dates
  html+='<div class="section"><h3>Important Dates</h3>';
  if(p.closing_date)html+=`<p>Closing: ${p.closing_date}</p>`;
  else html+='<p class="empty">No dates set</p>';
  html+='</div>';
  // Action Items
  html+='<div class="section"><h3>Action Items</h3>';
  if(p.action_items&&p.action_items.length){
    html+='<ul>'+p.action_items.map(a=>`<li class="action-item">${a}</li>`).join('')+'</ul>';
  } else {html+='<p class="empty">None</p>';}
  html+='</div>';
  // Recent Updates
  if(p.recent_updates&&p.recent_updates.length){
    html+='<div class="section full"><h3>Recent Updates</h3>';
    p.recent_updates.slice(0,5).forEach(u=>{
      html+=`<div class="update-item"><span class="update-date">${u.date||''}</span><span>${u.subject}</span><span class="update-src">${u.source}</span></div>`;
    });
    html+='</div>';
  }
  html+='</div></div>';
  return html;
}

// Sort: active first (non-closed, non-prospecting), then prospecting, then closed
const sorted=[...data.properties].sort((a,b)=>{
  const order=m=>{
    if(m==='Closed')return 3;
    if(m==='Prospecting')return 2;
    return 1;
  };
  return order(a.current_milestone)-order(b.current_milestone);
});

let active=0,closing=0,rehab=0,closed=0;
data.properties.forEach(p=>{
  if(p.current_milestone==='Closed')closed++;
  else{
    active++;
    if(p.current_milestone==='Closing'||p.current_milestone==='Final Walkthrough')closing++;
    if(p.current_milestone.includes('Rehab'))rehab++;
  }
});
document.getElementById('active-count').textContent=active;
document.getElementById('closing-count').textContent=closing;
document.getElementById('rehab-count').textContent=rehab;
document.getElementById('closed-count').textContent=closed;
document.getElementById('total-count').textContent=data.properties.length;
document.getElementById('grid').innerHTML=sorted.map(renderCard).join('');
</script>
</body>
