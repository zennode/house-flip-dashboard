<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Flip Closing Coordinator</title>
<style>
  :root{
    --bg:#0f1117; --card-bg:#1a1d27; --card-bg2:#20242f;
    --text:#e6e9ef; --muted:#9aa3b2; --line:#2a2f3c;
    --green:#3fb950; --blue:#388bfd; --gray:#3a4150;
    --amber:#d29922; --red:#f85149; --accent:#7c8cff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;}
  a{color:var(--accent);text-decoration:none}
  header{position:sticky;top:0;z-index:10;background:rgba(15,17,23,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 22px;}
  .h-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;justify-content:space-between}
  h1{font-size:20px;margin:0;letter-spacing:.2px}
  .updated{color:var(--muted);font-size:12.5px}
  .stats{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .stat{background:var(--card-bg);border:1px solid var(--line);border-radius:10px;
    padding:8px 14px;min-width:96px}
  .stat .n{font-size:22px;font-weight:700}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  main{max-width:1180px;margin:0 auto;padding:20px 18px 60px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
  .card{background:var(--card-bg);border:1px solid var(--line);border-radius:14px;
    padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
  .c-head{display:flex;flex-direction:column;gap:7px}
  .addr{font-size:16px;font-weight:650}
  .sub{color:var(--muted);font-size:12.5px}
  .badges{display:flex;flex-wrap:wrap;gap:6px}
  .badge{font-size:11px;padding:2.5px 9px;border-radius:999px;border:1px solid var(--line);
    background:var(--card-bg2);color:var(--muted)}
  .badge.phase{color:#fff;border:none;font-weight:600}
  .ph-closing{background:var(--blue)} .ph-closed{background:var(--green)}
  .ph-rehab{background:#8957e5} .ph-contract{background:var(--amber);color:#1a1d27}
  .ph-default{background:var(--gray)}
  .src-dotloop{color:#58a6ff;border-color:#214a7d} .src-docusign{color:#f0c040;border-color:#5a4a14}
  .src-pdf{color:#f08a8a;border-color:#5a2424} .src-email{color:#9aa3b2}
  .countdown{font-size:12.5px;display:flex;align-items:center;gap:6px}
  .countdown b{color:var(--text)}
  .cd-soon{color:var(--amber)} .cd-now{color:var(--red)} .cd-far{color:var(--muted)}
  .timeline{display:flex;align-items:center;gap:0;margin:2px 0}
  .tl-step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative}
  .dot{width:13px;height:13px;border-radius:50%;background:var(--gray);
    border:2px solid var(--card-bg);z-index:2}
  .dot.done{background:var(--green)} .dot.active{background:var(--blue);
    box-shadow:0 0 0 4px rgba(56,139,253,.25)}
  .tl-line{position:absolute;top:6px;left:50%;width:100%;height:2px;background:var(--gray);z-index:1}
  .tl-line.done{background:var(--green)}
  .tl-label{font-size:9px;color:var(--muted);margin-top:5px;text-align:center;
    line-height:1.15;max-width:62px}
  .tl-label.active{color:var(--blue);font-weight:600}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sec{background:var(--card-bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .sec.full{grid-column:1 / -1}
  .sec h4{margin:0 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
  .kv{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:1.5px 0}
  .kv span:first-child{color:var(--muted)}
  ul{margin:0;padding-left:16px}
  li{font-size:12.5px;margin:3px 0}
  .upd{font-size:12px;margin:6px 0;padding-left:9px;border-left:2px solid var(--line)}
  .upd .d{color:var(--muted);font-size:11px}
  .empty{color:var(--muted);font-size:12px}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:24px}
  .loading{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px}
</style>
</head>
<body>
<header>
  <div class="h-top">
    <h1>🏠 House Flip Closing Coordinator</h1>
    <div class="updated" id="updated">Loading…</div>
  </div>
  <div class="stats" id="stats"></div>
</header>
<main id="main"><div class="loading">Loading properties…</div></main>
<footer>Auto-generated dashboard · data from properties_data.json</footer>

<script>
const money = n => (typeof n === 'number') ? '$' + n.toLocaleString() : n;
const titleCase = s => String(s).replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());

function phaseClass(ms){
  const m = (ms||'').toLowerCase();
  if(m.includes('closed')) return 'ph-closed';
  if(m.includes('closing')) return 'ph-closing';
  if(m.includes('rehab')||m.includes('demo')) return 'ph-rehab';
  if(m.includes('contract')) return 'ph-contract';
  return 'ph-default';
}
function srcClass(s){
  const m=(s||'').toLowerCase();
  if(m.includes('dotloop'))return 'src-dotloop';
  if(m.includes('docusign'))return 'src-docusign';
  if(m.includes('pdf'))return 'src-pdf';
  return 'src-email';
}
function daysTo(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((d - today)/86400000);
}
function countdownHtml(p){
  const cd = p.closing_date;
  if(!cd) return '';
  const days = daysTo(cd);
  if(days===null) return '';
  let cls='cd-far', txt;
  if(days<0){cls='cd-now';txt=`Closing was ${Math.abs(days)} day(s) ago (${cd})`;}
  else if(days===0){cls='cd-now';txt=`Closing TODAY (${cd})`;}
  else if(days<=7){cls='cd-soon';txt=`${days} day(s) to closing (${cd})`;}
  else {txt=`${days} day(s) to closing (${cd})`;}
  return `<div class="countdown ${cls}">📅 <b>${txt}</b></div>`;
}
function timeline(p){
  const steps = p.milestones||[];
  if(!steps.length) return '';
  const done = new Set(p.completed_milestones||[]);
  const active = p.current_milestone;
  let activeIdx = steps.indexOf(active);
  return `<div class="timeline">` + steps.map((s,i)=>{
    let dc='', lc='';
    if(s===active){dc='active';lc='active';}
    else if(done.has(s) || (activeIdx>=0 && i<activeIdx)){dc='done';}
    const lineDone = (i < steps.length-1 && (done.has(s) || (activeIdx>=0 && i<activeIdx))) ? 'done':'';
    const lineHtml = i < steps.length-1 ? `<span class="tl-line ${lineDone}"></span>`:'';
    return `<div class="tl-step">${lineHtml}<span class="dot ${dc}"></span>`+
           `<span class="tl-label ${lc}">${s}</span></div>`;
  }).join('') + `</div>`;
}
function financials(f){
  if(!f || !Object.keys(f).length) return '';
  const rows = Object.entries(f).map(([k,v])=>{
    let val = (/price|cost|arv|concession|reduction|budget|payoff/i.test(k) && typeof v==='number') ? money(v) : v;
    return `<div class="kv"><span>${titleCase(k)}</span><span>${val}</span></div>`;
  }).join('');
  return `<div class="sec"><h4>Financials</h4>${rows}</div>`;
}
function contacts(c){
  if(!c || !c.length) return '';
  const rows = c.map(x=>`<div class="kv"><span>${x.name}</span><span>${x.role||''}</span></div>`).join('');
  return `<div class="sec"><h4>Key Contacts</h4>${rows}</div>`;
}
function dates(p){
  const items=[];
  if(p.closing_date) items.push(['Closing', p.closing_date]);
  if(p.important_dates){
    if(Array.isArray(p.important_dates)) p.important_dates.forEach(d=> items.push([d.label||d.name||'Date', d.date||d.value||d]));
    else Object.entries(p.important_dates).forEach(([k,v])=> items.push([titleCase(k), v]));
  }
  if(!items.length) return '';
  const rows = items.map(([k,v])=>`<div class="kv"><span>${k}</span><span>${v}</span></div>`).join('');
  return `<div class="sec"><h4>Important Dates</h4>${rows}</div>`;
}
function actions(a){
  if(!a || !a.length) return '';
  return `<div class="sec full"><h4>Action Items</h4><ul>`+
    a.map(x=>`<li>${x}</li>`).join('')+`</ul></div>`;
}
function updates(u){
  if(!u || !u.length) return '';
  const list = u.slice(0,5).map(x=>
    `<div class="upd"><span class="d">${x.date||''}${x.source?' · '+x.source:''}</span><br>${x.note||''}</div>`
  ).join('');
  return `<div class="sec full"><h4>Recent Updates</h4>${list}</div>`;
}
function card(p){
  const srcBadges=[];
  if(p.source) srcBadges.push(`<span class="badge ${srcClass(p.source)}">${p.source}</span>`);
  if(p.auto_detected) srcBadges.push(`<span class="badge">auto-detected</span>`);
  const sections = [financials(p.financials), contacts(p.contacts), dates(p), actions(p.action_items), updates(p.recent_updates)].filter(Boolean).join('');
  return `<div class="card">
    <div class="c-head">
      <div class="addr">${p.address||''}</div>
      <div class="sub">${[p.city,p.state].filter(Boolean).join(', ')}</div>
      <div class="badges">
        <span class="badge phase ${phaseClass(p.current_milestone)}">${p.current_milestone||'—'}</span>
        ${srcBadges.join('')}
      </div>
      ${countdownHtml(p)}
    </div>
    ${timeline(p)}
    <div class="grid">${sections || '<div class="sec full empty">No additional details</div>'}</div>
  </div>`;
}

function render(data){
  const props = data.properties||[];
  const active = props.filter(p=>p.status==='active');
  const atClosing = props.filter(p=>/closing/i.test(p.current_milestone||'') && !/closed/i.test(p.current_milestone||''));
  const inRehab = props.filter(p=>/rehab|demo/i.test(p.current_milestone||''));
  document.getElementById('updated').textContent = 'Last updated: ' + (data.last_updated||'—');
  document.getElementById('stats').innerHTML =
    [['Active', active.length],['At Closing', atClosing.length],['In Rehab', inRehab.length],['Total', props.length]]
    .map(([l,n])=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

  const rank = p => {
    const m=(p.current_milestone||'').toLowerCase();
    if(p.closing_date){const d=daysTo(p.closing_date); if(d!==null) return d;}
    if(m.includes('closing')) return 50;
    if(m.includes('contract')) return 100;
    if(m.includes('rehab')||m.includes('demo')) return 200;
    if(m.includes('closed')) return 9000;
    return 500;
  };
  const sorted = props.slice().sort((a,b)=>{
    if((a.status==='active')!==(b.status==='active')) return a.status==='active'?-1:1;
    return rank(a)-rank(b);
  });
  document.getElementById('main').innerHTML = sorted.map(card).join('');
}

fetch('properties_data.json?cb=' + Date.now())
  .then(r=>r.json())
  .then(render)
  .catch(e=>{
    document.getElementById('main').innerHTML =
      '<div class="loading">Failed to load properties_data.json — '+e.message+'</div>';
  });
</script>
</body>
</html>
