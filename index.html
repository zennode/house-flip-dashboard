<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Flip Closing Coordinator</title>
<style>
  :root{
    --bg:#0f1117; --card-bg:#1a1d27; --border:#2a2e3a; --text:#e6e8ee;
    --muted:#8b90a0; --accent:#4f8cff; --green:#3ecf8e; --blue:#4f8cff;
    --gray:#3a3f4d; --amber:#f0a92b; --red:#ff5c6c; --chip:#232734;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45;padding-bottom:60px}
  header{position:sticky;top:0;z-index:10;background:rgba(15,17,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:16px 24px}
  .h-top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
  h1{font-size:20px;font-weight:700;letter-spacing:.2px}
  .updated{font-size:12px;color:var(--muted)}
  .stats{display:flex;gap:20px;margin-top:12px;flex-wrap:wrap}
  .stat{display:flex;flex-direction:column}
  .stat .n{font-size:22px;font-weight:700}
  .stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .wrap{max-width:1180px;margin:0 auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px}
  .card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
  .c-head{display:flex;flex-direction:column;gap:6px}
  .addr{font-size:17px;font-weight:650}
  .city{font-size:12.5px;color:var(--muted)}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .badge{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--chip);color:var(--text);border:1px solid var(--border)}
  .badge.phase{background:rgba(79,140,255,.16);color:#9cc0ff;border-color:rgba(79,140,255,.4)}
  .badge.src{background:rgba(62,207,142,.13);color:#7fe3b8;border-color:rgba(62,207,142,.35)}
  .badge.closed{background:rgba(139,144,160,.18);color:#b6bccb}
  .countdown{font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:8px;background:rgba(240,169,43,.12);color:var(--amber);border:1px solid rgba(240,169,43,.3);display:inline-block}
  .countdown.past{background:rgba(255,92,108,.12);color:var(--red);border-color:rgba(255,92,108,.3)}
  .countdown.soon{background:rgba(62,207,142,.12);color:var(--green);border-color:rgba(62,207,142,.3)}
  .timeline{display:flex;align-items:flex-start;gap:0;margin:2px 0}
  .tl-step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;min-width:0}
  .tl-step:not(:last-child)::after{content:"";position:absolute;top:6px;left:50%;width:100%;height:2px;background:var(--gray)}
  .tl-step.done:not(:last-child)::after{background:var(--green)}
  .dot{width:13px;height:13px;border-radius:50%;background:var(--gray);z-index:1;border:2px solid var(--card-bg)}
  .tl-step.done .dot{background:var(--green)}
  .tl-step.active .dot{background:var(--blue);box-shadow:0 0 0 3px rgba(79,140,255,.25)}
  .tl-lbl{font-size:8.5px;color:var(--muted);margin-top:5px;text-align:center;line-height:1.15;word-break:break-word}
  .tl-step.active .tl-lbl{color:#9cc0ff;font-weight:600}
  .tl-step.done .tl-lbl{color:#7fe3b8}
  .sections{display:flex;flex-direction:column;gap:12px}
  .sec h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:5px}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:2px 0}
  .kv .k{color:var(--muted)}
  .kv .v{text-align:right;font-weight:550}
  ul.items{list-style:none;display:flex;flex-direction:column;gap:5px}
  ul.items li{font-size:12.5px;padding-left:15px;position:relative;color:#d2d6e0}
  ul.items li::before{content:"";position:absolute;left:2px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .updates{display:flex;flex-direction:column;gap:8px}
  .upd{font-size:12px;border-left:2px solid var(--border);padding-left:10px}
  .upd .meta{font-size:10.5px;color:var(--muted);margin-bottom:2px;display:flex;gap:8px}
  .upd .meta .s{color:#7fe3b8}
  .upd a{color:var(--accent);word-break:break-all}
  .contact{font-size:12.5px;padding:2px 0}
  .contact .nm{font-weight:600}
  .contact .ro{color:var(--muted);font-size:11.5px}
  .note{font-size:12px;color:var(--amber);background:rgba(240,169,43,.08);padding:8px 10px;border-radius:8px;border:1px solid rgba(240,169,43,.2)}
  .err{padding:40px;text-align:center;color:var(--muted)}
  @media(max-width:520px){.wrap{grid-template-columns:1fr;padding:14px}.tl-lbl{display:none}}
</style>
</head>
<body>
<header>
  <div class="h-top">
    <h1>🏠 House Flip Closing Coordinator</h1>
    <span class="updated" id="updated">Loading…</span>
  </div>
  <div class="stats" id="stats"></div>
</header>
<div class="wrap" id="wrap"><div class="err">Loading properties…</div></div>

<script>
const STAGE_ORDER=["Prospecting","Acquired","Demo/Rehab","Listed","Title & Escrow","Under Contract","Closing","Closed"];
function money(v){if(typeof v==="number")return "$"+v.toLocaleString("en-US",{maximumFractionDigits:2});return v;}
function titleize(k){return k.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');}
function daysTo(dstr){const today=new Date();today.setHours(0,0,0,0);const d=new Date(dstr+"T00:00:00");return Math.round((d-today)/86400000);}

function timeline(p){
  const steps=(p.milestones&&p.milestones.length)?p.milestones:STAGE_ORDER;
  const done=new Set(p.completed_milestones||[]);
  const cur=p.current_milestone;
  return '<div class="timeline">'+steps.map(s=>{
    let cls="tl-step";
    if(done.has(s))cls+=" done";
    if(s===cur)cls+=" active";
    return '<div class="'+cls+'"><span class="dot"></span><span class="tl-lbl">'+esc(s)+'</span></div>';
  }).join("")+'</div>';
}

function countdown(p){
  if(!p.closing_date)return "";
  const n=daysTo(p.closing_date);
  let cls="countdown",txt;
  if(n<0){cls+=" past";txt="Closed/past — "+p.closing_date;}
  else if(n===0){cls+=" soon";txt="Closing TODAY — "+p.closing_date;}
  else if(n<=7){cls+=" soon";txt=n+" day"+(n>1?"s":"")+" to closing — "+p.closing_date;}
  else txt=n+" days to closing — "+p.closing_date;
  return '<span class="'+cls+'">⏳ '+txt+'</span>';
}

function sources(src){
  if(!src)return "";
  return String(src).split(/[\/,]/).map(s=>s.trim()).filter(Boolean)
    .map(s=>'<span class="badge src">'+esc(s)+'</span>').join("");
}

function section(title,inner){return inner?'<div class="sec"><h4>'+title+'</h4>'+inner+'</div>':"";}

function card(p){
  const phaseClass=p.current_milestone==="Closed"?"badge phase closed":"badge phase";
  let h='<div class="card"><div class="c-head">';
  h+='<div class="addr">'+esc(p.address)+'</div>';
  h+='<div class="city">'+esc([p.city,p.state].filter(Boolean).join(", "))+'</div>';
  h+='<div class="badges"><span class="'+phaseClass+'">'+esc(p.current_milestone||"—")+'</span>'+sources(p.source)+'</div>';
  h+='</div>';
  const cd=countdown(p);if(cd)h+=cd;
  h+=timeline(p);
  if(p.status_note)h+='<div class="note">⚠ '+esc(p.status_note)+'</div>';
  h+='<div class="sections">';
  if(p.financials&&Object.keys(p.financials).length){
    let f=Object.entries(p.financials).map(([k,v])=>'<div class="kv"><span class="k">'+titleize(k)+'</span><span class="v">'+esc(money(v))+'</span></div>').join("");
    h+=section("Financials",f);
  }
  if(p.contacts&&p.contacts.length){
    let c=p.contacts.map(ct=>'<div class="contact"><span class="nm">'+esc(ct.name)+'</span>'+(ct.role?' <span class="ro">— '+esc(ct.role)+'</span>':"")+'</div>').join("");
    h+=section("Key Contacts",c);
  }
  if(p.important_dates&&Object.keys(p.important_dates).length){
    let dd=Object.entries(p.important_dates).map(([k,v])=>'<div class="kv"><span class="k">'+titleize(k)+'</span><span class="v">'+esc(v)+'</span></div>').join("");
    h+=section("Important Dates",dd);
  }else if(p.closing_date){
    h+=section("Important Dates",'<div class="kv"><span class="k">Closing</span><span class="v">'+esc(p.closing_date)+'</span></div>');
  }
  if(p.action_items&&p.action_items.length){
    h+=section("Action Items",'<ul class="items">'+p.action_items.map(a=>'<li>'+esc(a)+'</li>').join("")+'</ul>');
  }
  if(p.recent_updates&&p.recent_updates.length){
    const ups=[...p.recent_updates].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    let u=ups.map(up=>'<div class="upd"><div class="meta"><span>'+esc(up.date||"")+'</span>'+(up.source?'<span class="s">'+esc(up.source)+'</span>':"")+'</div><div>'+linkify(up.note||"")+'</div></div>').join("");
    h+=section("Recent Updates",'<div class="updates">'+u+'</div>');
  }
  h+='</div></div>';
  return h;
}

function rankOf(p){
  if(p.status==="closed"||p.current_milestone==="Closed")return 99;
  const i=STAGE_ORDER.indexOf(p.current_milestone);
  return i===-1?50:(STAGE_ORDER.length-i);
}

function render(data){
  const props=data.properties||[];
  const active=props.filter(p=>p.status==="active").length;
  const atClosing=props.filter(p=>p.current_milestone==="Closing"&&p.status!=="closed").length;
  const inRehab=props.filter(p=>p.current_milestone==="Demo/Rehab").length;
  document.getElementById("stats").innerHTML=
    stat(active,"Active Properties")+stat(atClosing,"At Closing")+stat(inRehab,"In Rehab")+stat(props.length,"Total Tracked");
  if(data.last_updated){
    const dt=new Date(data.last_updated);
    document.getElementById("updated").textContent="Last updated: "+(isNaN(dt)?data.last_updated:dt.toLocaleString("en-US",{dateStyle:"medium",timeStyle:"short"}));
  }
  const sorted=[...props].sort((a,b)=>{
    const r=rankOf(a)-rankOf(b);if(r)return r;
    if(a.closing_date&&b.closing_date)return a.closing_date.localeCompare(b.closing_date);
    if(a.closing_date)return -1;if(b.closing_date)return 1;return 0;
  });
  document.getElementById("wrap").innerHTML=sorted.map(card).join("");
}
function stat(n,l){return '<div class="stat"><span class="n">'+n+'</span><span class="l">'+l+'</span></div>';}

fetch("properties_data.json?t="+Date.now())
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
  .then(render)
  .catch(e=>{document.getElementById("wrap").innerHTML='<div class="err">Could not load properties_data.json ('+esc(e.message)+')</div>';});
</script>
</body>
</html>
