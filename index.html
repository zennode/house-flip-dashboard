<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Flip Closing Coordinator</title>
<style>
  :root {
    --bg: #0f1117;
    --card-bg: #1a1d27;
    --card-border: #2a2d3a;
    --text: #e1e4e8;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --blue: #58a6ff;
    --gray: #484f58;
    --red: #f85149;
    --orange: #d29922;
    --purple: #a371f7;
    --yellow: #e3b341;
    --section-bg: #12151f;
    --input-bg: #21262d;
    --border: #30363d;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }
  /* HEADER */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13,16,33,0.92);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
  }
  .header-inner {
    max-width: 1400px; margin: 0 auto;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .header-title-group { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 220px; }
  .header-title { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
  .header-subtitle { font-size: 11px; color: var(--text-muted); }
  .header-badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .stat-badge {
    display: flex; align-items: center; gap: 6px;
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 12px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .stat-badge .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .stat-badge .count { font-size: 14px; font-weight: 700; }
  /* TOOLBAR */
  .toolbar {
    max-width: 1400px; margin: 0 auto;
    padding: 16px 20px 0;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 400px; }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  .search-input {
    width: 100%; background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 8px 10px 8px 34px;
    font-size: 13px; outline: none; transition: border-color .15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-muted); }
  .filter-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-tab {
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text-muted); cursor: pointer;
    font-size: 12px; font-weight: 500; padding: 6px 12px; transition: all .15s;
  }
  .filter-tab:hover { border-color: var(--accent); color: var(--text); }
  .filter-tab.active { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 700; }
  .result-count { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  /* MAIN */
  .main { max-width: 1400px; margin: 0 auto; padding: 20px; }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-muted); margin: 24px 0 10px; padding-left: 2px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
    gap: 16px;
  }
  /* PROPERTY CARD */
  .property-card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 12px; overflow: hidden;
    transition: border-color .15s, box-shadow .15s;
  }
  .property-card:hover { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(88,166,255,.13); }
  .property-card.urgent { border-color: var(--red); box-shadow: 0 0 0 1px rgba(248,81,73,.2); }
  .property-card.urgent:hover { box-shadow: 0 0 0 2px rgba(248,81,73,.33); }
  .card-header {
    padding: 14px 16px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  }
  .card-address { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.3; }
  .card-city { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .card-header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .phase-badge { border-radius: 6px; font-size: 11px; font-weight: 700; padding: 3px 9px; letter-spacing: .02em; white-space: nowrap; }
  .phase-badge.green { background: rgba(63,185,80,.13); color: var(--green); border: 1px solid rgba(63,185,80,.27); }
  .phase-badge.blue  { background: rgba(88,166,255,.13); color: var(--blue);  border: 1px solid rgba(88,166,255,.27); }
  .phase-badge.red   { background: rgba(248,81,73,.13);  color: var(--red);   border: 1px solid rgba(248,81,73,.27); }
  .phase-badge.orange{ background: rgba(210,153,34,.13); color: var(--orange);border: 1px solid rgba(210,153,34,.27); }
  .source-badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .source-badge { border-radius: 4px; font-size: 10px; font-weight: 600; padding: 2px 6px; letter-spacing: .03em; }
  .source-badge.dotloop  { background: rgba(163,113,247,.13); color: var(--purple); border: 1px solid rgba(163,113,247,.27); }
  .source-badge.docusign { background: rgba(227,179,65,.13);  color: var(--yellow); border: 1px solid rgba(227,179,65,.27); }
  .source-badge.email    { background: rgba(72,79,88,.27);    color: #adb5bd;       border: 1px solid rgba(72,79,88,.6); }
  .source-badge.pdf      { background: rgba(210,153,34,.13);  color: var(--orange); border: 1px solid rgba(210,153,34,.27); }
  .countdown { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 6px; white-space: nowrap; }
  .countdown.urgent { background: rgba(248,81,73,.13); color: var(--red);    border: 1px solid rgba(248,81,73,.27); }
  .countdown.normal { background: rgba(210,153,34,.13);color: var(--orange); border: 1px solid rgba(210,153,34,.27); }
  .countdown.soon   { background: rgba(63,185,80,.13); color: var(--green);  border: 1px solid rgba(63,185,80,.27); }
  /* MILESTONE TIMELINE */
  .milestone-bar { padding: 12px 16px 8px; border-bottom: 1px solid var(--border); background: var(--section-bg); }
  .milestone-track { display: flex; align-items: flex-start; width: 100%; }
  .milestone-step { display: flex; flex-direction: column; align-items: center; flex: 1; }
  .milestone-connector { flex: 1; height: 2px; background: var(--border); margin-top: 5px; min-width: 2px; }
  .milestone-connector.done { background: var(--green); }
  .milestone-dot-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .milestone-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
  .milestone-dot.done    { background: var(--green); }
  .milestone-dot.active  { background: var(--blue); box-shadow: 0 0 0 3px rgba(88,166,255,.2); animation: pulse 1.5s infinite; }
  .milestone-dot.pending { background: var(--border); }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 2px rgba(88,166,255,.2); }
    50%      { box-shadow: 0 0 0 5px rgba(88,166,255,.13); }
  }
  .milestone-label { font-size: 8.5px; color: var(--text-muted); text-align: center; line-height: 1.2; max-width: 42px; word-break: break-word; }
  .milestone-label.done   { color: var(--green); }
  .milestone-label.active { color: var(--blue); font-weight: 700; }
  /* CARD BODY */
  .card-body { padding: 14px 16px; }
  .card-sections { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card-section { background: var(--section-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .card-section.full-width { grid-column: 1 / -1; }
  .section-title { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .kv-list { display: flex; flex-direction: column; gap: 4px; }
  .kv-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .kv-key { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
  .kv-val { font-size: 12px; color: var(--text); font-weight: 600; text-align: right; word-break: break-word; max-width: 55%; }
  .kv-val.green { color: var(--green); }
  .kv-val.blue  { color: var(--blue); }
  .contact-list { display: flex; flex-direction: column; gap: 5px; }
  .contact-item { display: flex; flex-direction: column; gap: 1px; }
  .contact-name { font-size: 12px; font-weight: 600; color: var(--text); }
  .contact-role { font-size: 10px; color: var(--text-muted); }
  .dates-list { display: flex; flex-direction: column; gap: 5px; }
  .date-item { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .date-label { font-size: 11px; color: var(--text-muted); }
  .date-val { font-size: 11px; color: var(--text); font-weight: 600; text-align: right; }
  .action-list { display: flex; flex-direction: column; gap: 5px; list-style: none; }
  .action-item { font-size: 12px; color: var(--text-muted); padding-left: 16px; position: relative; line-height: 1.4; }
  .action-item::before { content: 'â¢'; position: absolute; left: 0; color: var(--text-muted); }
  .action-item.urgent-action { color: var(--red); }
  .action-item.urgent-action::before { content: 'â '; font-size: 10px; color: var(--red); }
  .updates-list { display: flex; flex-direction: column; gap: 8px; }
  .update-item { padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .update-item:last-child { border-bottom: none; padding-bottom: 0; }
  .update-date { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; font-weight: 600; }
  .update-note { font-size: 12px; color: var(--text); line-height: 1.45; }
  /* CLOSED SECTION */
  .closed-toggle {
    display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none;
    margin: 24px 0 10px; padding: 0; background: none; border: none;
    color: var(--text-muted); font-size: 11px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; width: 100%; text-align: left;
  }
  .closed-toggle:hover { color: var(--text); }
  .closed-toggle .toggle-arrow { transition: transform .2s; font-size: 10px; display: inline-block; }
  .closed-toggle.collapsed .toggle-arrow { transform: rotate(-90deg); }
  .closed-toggle::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .closed-section.hidden { display: none; }
  /* EMPTY STATE */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); display: none; }
  .empty-state.visible { display: block; }
  .empty-state h3 { font-size: 16px; margin-bottom: 8px; color: var(--text); }
  .empty-state p { font-size: 13px; }
  /* FOOTER */
  .footer { border-top: 1px solid var(--border); padding: 20px; text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 40px; }
  .footer a { color: var(--accent); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
  /* PROFIT PILL */
  .profit-pill { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; }
  .profit-pill.positive { background: rgba(63,185,80,.13); color: var(--green); }
  .profit-pill.negative { background: rgba(248,81,73,.13); color: var(--red); }
  /* RESPONSIVE */
  @media (max-width: 700px) {
    .cards-grid { grid-template-columns: 1fr; }
    .card-sections { grid-template-columns: 1fr; }
    .card-section.full-width { grid-column: 1; }
    .toolbar { padding: 12px 12px 0; }
    .main { padding: 12px; }
  }
</style>
</head>

<header class="header">

<main class="main">

</main>

/* ===== CONSTANTS ===== */
const TODAY = new Date('2026-06-04T00:00:00');

// 10-step canonical timeline
const TIMELINE_STEPS = [
  'Offer Made','Under Contract','Title & Escrow','Inspections','Appraisal',
  'Financing','Repairs/Rehab','Final Walkthrough','Closing','Closed'
];

// Milestone urgency order (lower = more urgent for sorting)
const MILESTONE_ORDER = [
  'Closing','Inspections','Under Contract','Title & Escrow','Financing',
  'Repairs/Rehab','Demo/Rehab','Listed','Offer Made','Final Walkthrough',
  'Acquired','Prospecting'
];

/* ===== HELPERS ===== */
function fmt$(n) {
  if (n === undefined || n === null) return 'â';
  const s = String(n);
  const num = parseFloat(s.replace(/[^0-9.]/g,''));
  if (isNaN(num)) return s;
  return '$' + num.toLocaleString('en-US');
}
function fmtDate(s) {
  if (!s) return 'â';
  const d = new Date(s + 'T00:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function daysDiff(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  return Math.round((d - TODAY) / 86400000);
}
function isUrgent(p) {
  if (p.current_milestone === 'Closed') return false;
  if (p.current_milestone === 'Closing') return true;
  if (p.closing_date && daysDiff(p.closing_date) < 0) return true;
  return (p.action_items||[]).some(a => /urgent|past due|forfeiture|termination|ACTIVE NEGOTIATION/i.test(a));
}
function milestoneRank(m) {
  const i = MILESTONE_ORDER.indexOf(m);
  return i === -1 ? 99 : i;
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ===== TIMELINE ===== */
function buildTimeline(prop) {
  const completed = new Set(prop.completed_milestones || []);
  const current = prop.current_milestone;
  const isProspect = current === 'Prospecting';
  const propSteps = (prop.milestones || []).filter(m => m !== 'Prospecting');

  // Map 10 canonical slots to property milestones by position
  const parts = [];
  for (let i = 0; i < 10; i++) {
    const label = TIMELINE_STEPS[i];
    let state = 'pending';
    if (!isProspect) {
      const ratio = propSteps.length > 1 ? (propSteps.length - 1) / 9 : 0;
      const pi = Math.min(Math.round(i * ratio), propSteps.length - 1);
      const mapped = propSteps[pi] || '';
      const mappedRank = propSteps.indexOf(mapped);
      const currentRank = propSteps.indexOf(current);
      if (mapped === current) state = 'active';
      else if (completed.has(mapped)) state = 'done';
      else if (mappedRank >= 0 && currentRank >= 0 && mappedRank < currentRank) state = 'done';
    }

    // Connector before this dot (not before first)
    let conn = '';
    if (i > 0) {
      const prevState = parts[i-1] ? parts[i-1].state : 'pending';
      const connDone = prevState === 'done' && state !== 'pending';
      conn = `<div class="milestone-connector${connDone?' done':''}"></div>`;
    }
    parts.push({ state, html: `${conn}<div class="milestone-step"><div class="milestone-dot-wrap"><div class="milestone-dot ${state}"></div><div class="milestone-label ${state}">${esc(label)}</div></div></div>` });
  }
  return `<div class="milestone-bar"><div class="milestone-track">${parts.map(p=>p.html).join('')}</div></div>`;
}

/* ===== COUNTDOWN ===== */
function buildCountdown(prop) {
  if (!prop.closing_date || prop.current_milestone === 'Closed') return '';
  const days = daysDiff(prop.closing_date);
  if (days === null) return '';
  if (days < 0) return `<div class="countdown urgent">${Math.abs(days)} days past due</div>`;
  if (days <= 7)  return `<div class="countdown urgent">${days} days to closing</div>`;
  if (days <= 21) return `<div class="countdown normal">${days} days to closing</div>`;
  return `<div class="countdown soon">${days} days to closing</div>`;
}

/* ===== SOURCE BADGES ===== */
function buildSourceBadges(prop) {
  const set = new Set();
  const src = (prop.source||'').toLowerCase();
  const notes = (prop.recent_updates||[]).map(u=>u.note.toLowerCase()).join(' ');
  if (prop.current_milestone === 'Closing' || prop.current_milestone === 'Under Contract' || prop.current_milestone === 'Closed') set.add('dotloop');
  if (prop.current_milestone === 'Under Contract' || prop.current_milestone === 'Closing' || prop.current_milestone === 'Closed') set.add('docusign');
  if (src === 'email' || notes.includes('forwarded') || notes.includes('cma') || notes.includes('email')) set.add('email');
  if (notes.includes('inspection report') || notes.includes('estimate') || notes.includes('t-12') || notes.includes('viessman')) set.add('pdf');
  if (set.size === 0) return '';
  return `<div class="source-badges">${[...set].map(s=>`<span class="source-badge ${s}">${s==='dotloop'?'Dotloop':s==='docusign'?'DocuSign':s==='email'?'Email':'PDF'}</span>`).join('')}</div>`;
}

/* ===== FINANCIALS ===== */
function buildFinancials(fin) {
  const defs = [
    ['purchase_price','Purchase Price',''],
    ['asking_price','Asking Price',''],
    ['rehab_cost','Rehab Cost',''],
    ['rehab_estimate_range','Rehab Est. Range',''],
    ['rehab_estimate','Rehab Estimate',''],
    ['listing_price','List Price','blue'],
    ['sale_price','Sale Price','green'],
    ['arv','ARV','green'],
    ['arv_estimate','ARV (Est.)','green'],
    ['buyer_concession_request','Concession Req.',''],
    ['prior_price_reduction','Prior Reduction',''],
    ['units','Units',''],
    ['unit_type','Unit Type',''],
  ];
  const rows = [];
  for (const [k,label,cls] of defs) {
    if (fin[k] === undefined || fin[k] === null) continue;
    let display;
    if (k==='units'||k==='unit_type') display = esc(fin[k]);
    else if (k==='rehab_estimate_range') display = '$'+String(fin[k]).replace('-','&ndash;$');
    else display = esc(fmt$(fin[k]));
    rows.push(`<div class="kv-row"><span class="kv-key">${label}</span><span class="kv-val ${cls}">${display}</span></div>`);
  }
  if (fin.sale_price && fin.purchase_price) {
    const profit = fin.sale_price - fin.purchase_price - (fin.rehab_cost||0);
    const pc = profit >= 0 ? 'positive' : 'negative';
    rows.push(`<div class="kv-row"><span class="kv-key">Est. Profit</span><span class="kv-val"><span class="profit-pill ${pc}">${profit>=0?'+':''}${fmt$(profit)}</span></span></div>`);
  }
  return rows.length ? `<div class="kv-list">${rows.join('')}</div>` : `<div class="kv-row"><span class="kv-key" style="font-style:italic">No financials yet</span></div>`;
}

/* ===== DATES ===== */
function buildDates(prop) {
  const items = [];
  if (prop.closing_date) items.push(`<div class="date-item"><span class="date-label">Closing Date</span><span class="date-val">${fmtDate(prop.closing_date)}</span></div>`);
  // Pull structured date mentions from notes
  const datePatterns = [
    /(?:closing|deadline|court date|offer deadline)[^\n]*?(\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]* \d{1,2},? \d{4})/gi,
    /(?:closing|deadline)[^\n]*?(\d{1,2}\/\d{1,2}\/\d{2,4})/gi,
    /(?:closing|scheduled)[^\n]*?(June \d{1,2},? \d{4})/gi,
  ];
  const seen = new Set();
  (prop.recent_updates||[]).forEach(u => {
    for (const pat of datePatterns) {
      const m = u.note.match(pat);
      if (m) m.forEach(match => {
        const cleaned = match.replace(/^(closing|deadline|court date|offer deadline|scheduled)\s*/i,'').trim();
        if (!seen.has(cleaned) && cleaned.length > 3) { seen.add(cleaned); items.push(`<div class="date-item"><span class="date-label">Noted Date</span><span class="date-val">${esc(cleaned)}</span></div>`); }
      });
    }
  });
  if (items.length === 0 && prop.recent_updates && prop.recent_updates.length > 0) {
    items.push(`<div class="date-item"><span class="date-label">Last Update</span><span class="date-val">${fmtDate(prop.recent_updates[0].date)}</span></div>`);
  }
  return `<div class="dates-list">${items.slice(0,4).join('')||'<span style="color:var(--text-muted);font-size:11px">No dates recorded</span>'}</div>`;
}

/* ===== CARD ===== */
function buildCard(prop) {
  const urgent = isUrgent(prop);
  const closed = prop.current_milestone === 'Closed';
  const phaseCls = closed ? 'green' : urgent ? 'red' : 'blue';

  const contacts = (prop.contacts||[]).map(c =>
    `<div class="contact-item"><div class="contact-name">${esc(c.name)}</div><div class="contact-role">${esc(c.role)}</div></div>`
  ).join('');

  const actions = (prop.action_items||[]).map(a => {
    const urg = /urgent|past due|forfeiture|termination|ACTIVE NEGOTIATION/i.test(a);
    return `<li class="action-item${urg?' urgent-action':''}">${esc(a)}</li>`;
  }).join('');

  const updates = [...(prop.recent_updates||[])].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5)
    .map(u=>`<div class="update-item"><div class="update-date">${fmtDate(u.date)}</div><div class="update-note">${esc(u.note)}</div></div>`).join('');

  return `<div class="property-card${urgent&&!closed?' urgent':''}" data-milestone="${esc(prop.current_milestone)}" data-addr="${esc(prop.address.toLowerCase())}" data-city="${esc(prop.city.toLowerCase())}">
  <div class="card-header">
    <div>
      <div class="card-address">${esc(prop.address)}</div>
      <div class="card-city">${esc(prop.city)}, ${esc(prop.state)}</div>
    </div>
    <div class="card-header-right">
      <span class="phase-badge ${phaseCls}">${esc(prop.current_milestone)}</span>
      ${buildSourceBadges(prop)}
      ${buildCountdown(prop)}
    </div>
  </div>
  ${buildTimeline(prop)}
  <div class="card-body">
    <div class="card-sections">
      <div class="card-section"><div class="section-title">Financials</div>${buildFinancials(prop.financials||{})}</div>
      <div class="card-section"><div class="section-title">Key Contacts</div><div class="contact-list">${contacts||'<span style="color:var(--text-muted);font-size:12px">No contacts</span>'}</div></div>
      <div class="card-section"><div class="section-title">Important Dates</div>${buildDates(prop)}</div>
      <div class="card-section"><div class="section-title">Action Items</div><ul class="action-list">${actions||'<li class="action-item">No pending items</li>'}</ul></div>
      <div class="card-section full-width"><div class="section-title">Recent Updates</div><div class="updates-list">${updates||'<div style="color:var(--text-muted);font-size:12px">No updates</div>'}</div></div>
    </div>
  </div>
</div>`;
}

/* ===== STATS ===== */
function updateStats() {
  const p = RAW_DATA.properties;
  document.getElementById('stat-total').textContent    = p.filter(x=>x.current_milestone!=='Closed').length;
  document.getElementById('stat-closing').textContent  = p.filter(x=>x.current_milestone==='Closing').length;
  document.getElementById('stat-rehab').textContent    = p.filter(x=>x.current_milestone==='Demo/Rehab').length;
  document.getElementById('stat-prospect').textContent = p.filter(x=>x.current_milestone==='Prospecting').length;
}

/* ===== RENDER ===== */
let closedOpen = true;
let activeFilter = 'all';
let searchQuery = '';

function sortProps(arr) {
  return [...arr].sort((a,b) => {
    const aActive = a.current_milestone !== 'Closed';
    const bActive = b.current_milestone !== 'Closed';
    if (aActive !== bActive) return aActive ? -1 : 1;
    return milestoneRank(a.current_milestone) - milestoneRank(b.current_milestone);
  });
}

function matchesSearch(p) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  return p.address.toLowerCase().includes(q) || p.city.toLowerCase().includes(q) || (p.state||'').toLowerCase().includes(q);
}
function matchesFilter(p) {
  if (activeFilter === 'all') return true;
  if (activeFilter === 'Demo/Rehab') return p.current_milestone === 'Demo/Rehab';
  return p.current_milestone === activeFilter;
}

function render() {
  const sorted = sortProps(RAW_DATA.properties);
  const active = sorted.filter(p => p.current_milestone !== 'Closed');
  const closed = sorted.filter(p => p.current_milestone === 'Closed');

  const fa = active.filter(p => matchesSearch(p) && matchesFilter(p));
  const fc = closed.filter(p => matchesSearch(p) && (activeFilter === 'all' || activeFilter === 'Closed'));

  document.getElementById('active-grid').innerHTML = fa.map(buildCard).join('');
  document.getElementById('closed-grid').innerHTML = fc.map(buildCard).join('');

  const total = fa.length + fc.length;
  document.getElementById('result-count').textContent = total === RAW_DATA.properties.length
    ? `${total} properties` : `Showing ${total} of ${RAW_DATA.properties.length}`;
  document.getElementById('empty-state').classList.toggle('visible', fa.length === 0 && fc.length === 0);
  document.getElementById('closed-count-label').textContent = `(${fc.length})`;
}

function toggleClosed() {
  closedOpen = !closedOpen;
  document.getElementById('closed-section').classList.toggle('hidden', !closedOpen);
  document.getElementById('closed-toggle').classList.toggle('collapsed', !closedOpen);
}

/* ===== INIT ===== */
document.addEventListener('DOMContentLoaded', () => {
  const lu = new Date(RAW_DATA.last_updated);
  document.getElementById('last-updated').textContent = lu.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'});
  document.getElementById('footer-date').textContent = lu.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  updateStats();
  render();

  document.getElementById('search-input').addEventListener('input', e => {
    searchQuery = e.target.value.trim();
    render();
  });
  document.getElementById('filter-tabs').addEventListener('click', e => {
    const t = e.target.closest('.filter-tab');
    if (!t) return;
    document.querySelectorAll('.filter-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    activeFilter = t.dataset.filter;
    render();
  });
});
</script>
</body>
