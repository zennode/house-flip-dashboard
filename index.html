<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>House Flip Closing Coordinator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1117;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
.header{background:#1a1d27;border-bottom:1px solid #2d3348;padding:16px 24px;position:sticky;top:0;z-index:100}
.header h1{font-size:22px;color:#f1f5f9;font-weight:800}
.header .sub{color:#6b7280;font-size:13px;margin-top:4px}
.stats{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.stat{background:#0f1117;padding:8px 16px;border-radius:8px;border:1px solid #2d3348}
.stat .num{font-size:24px;font-weight:800}
.stat .label{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px}
.container{max-width:1200px;margin:0 auto;padding:20px}
.card{background:#1a1d27;border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid #2d3348}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}
.card h2{color:#f1f5f9;font-size:18px;margin:0;font-weight:700}
.badge{padding:4px 12px;border-radius:9999px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
.src-badge{padding:2px 8px;border-radius:9999px;font-size:11px;margin-right:4px;color:#fff}
.countdown{padding:6px 12px;border-radius:8px;font-weight:700;font-size:14px;display:inline-block;margin:8px 0}
.timeline{display:flex;align-items:flex-start;gap:2px;margin:12px 0}
.tl-dot{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0}
.tl-dot .dot{width:14px;height:14px;border-radius:50%;margin-bottom:4px;flex-shrink:0}
.tl-dot span{font-size:9px;color:#9ca3af;text-align:center;line-height:1.1;word-break:break-word}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.section-title{color:#cbd5e1;font-weight:700;font-size:13px;margin-bottom:6px}
.fin-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #1e293b}
.fin-label{color:#9ca3af;font-size:12px}
.fin-val{color:#e2e8f0;font-size:12px;font-weight:600}
.contact{font-size:12px;color:#d1d5db;padding:2px 0}
.contact strong{color:#e2e8f0}
.contact .role{color:#6b7280}
.action{font-size:12px;color:#fbbf24;padding:3px 0 3px 12px;position:relative}
.action::before{content:'\u26A1';position:absolute;left:0}
.update{font-size:12px;color:#94a3b8;padding:3px 0;border-left:2px solid #374151;padding-left:8px;margin-bottom:4px}
.update .date{color:#6b7280}
.update .src{color:#4b5563;font-size:10px}
.loading{text-align:center;padding:40px;color:#6b7280;font-size:16px}
</style>
</head>
<body>
<div class="header">
<h1>House Flip Closing Coordinator</h1>
<div class="sub" id="lastUpdated">Loading...</div>
<div class="stats" id="stats"></div>
</div>
<div class="container" id="container"><div class="loading">Loading dashboard data...</div></div>
<script>
const MS=['Offer Made','Under Contract','Title & Escrow','Inspections','Appraisal','Financing','Repairs / Rehab','Final Walkthrough','Closing','Closed'];
const PC={'Prospecting':'#6b7280','Offer Made':'#f59e0b','Under Contract':'#f97316','Title & Escrow':'#8b5cf6','Inspections':'#06b6d4','Appraisal':'#3b82f6','Financing':'#6366f1','Repairs / Rehab':'#eab308','Final Walkthrough':'#f472b6','Closing':'#ef4444','Closed':'#22c55e'};
const SC={'dotloop':'#4f46e5','DocuSign':'#f59e0b','Email':'#6b7280','PDF':'#ef4444','Venmo':'#3b82f6'};
function mi(m){if(m==='Prospecting')return -1;const i=MS.indexOf(m);return i>=0?i:-1;}
function dtc(cd){if(!cd)return null;try{const parts=cd.split('/');if(parts.length===3){const d=new Date(parts[2],parts[0]-1,parts[1]);const now=new Date(2026,3,30);return Math.round((d-now)/86400000);}return null;}catch(e){return null;}}
function sortProps(props){return props.sort((a,b)=>{const ma=a.current_milestone,mb=b.current_milestone;const da=dtc(a.closing_date),db=dtc(b.closing_date);if(ma==='Closed'&&mb!=='Closed')return 1;if(mb==='Closed'&&ma!=='Closed')return -1;if(ma==='Prospecting'&&mb!=='Prospecting')return 1;if(mb==='Prospecting'&&ma!=='Prospecting')return -1;if(da!==null&&db!==null)return da-db;if(da!==null)return -1;if(db!==null)return 1;return mi(mb)-mi(ma);});}
function renderTimeline(current){const idx=mi(current);return '<div class="timeline">'+MS.map((m,i)=>{const c=i<idx?'#22c55e':i===idx?'#3b82f6':'#374151';return '<div class="tl-dot"><div class="dot" style="background:'+c+'"></div><span>'+m+'</span></div>';}).join('')+'</div>';}
function renderCard(p){const phase=p.current_milestone;const pc=PC[phase]||'#6b7280';const sources=(p.sources||[]).map(s=>'<span class="src-badge" style="background:'+(SC[s]||'#6b7280')+'">'+s+'</span>').join('');
let countdown='';const d=dtc(p.closing_date);if(d!==null){if(d===0)countdown='<div class="countdown" style="background:#ef4444;color:#fff">CLOSING TODAY</div>';else if(d<0)countdown='<div class="countdown" style="background:#22c55e;color:#fff">CLOSED '+Math.abs(d)+'d ago</div>';else if(d<=7)countdown='<div class="countdown" style="background:#f59e0b;color:#000">'+d+' days to closing</div>';else countdown='<div class="countdown" style="background:#1e293b;color:#94a3b8">'+d+' days to closing</div>';}
const fin=p.financials||{};let finH='';if(Object.keys(fin).length){finH='<div style="margin-top:8px"><div class="section-title">Financials</div>'+Object.entries(fin).map(([k,v])=>'<div class="fin-row"><span class="fin-label">'+k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())+'</span><span class="fin-val">'+v+'</span></div>').join('')+'</div>';}
const contacts=p.contacts||[];let conH='';if(contacts.length){conH='<div style="margin-top:8px"><div class="section-title">Key Contacts</div>'+contacts.slice(0,6).map(c=>'<div class="contact"><strong>'+c.name+'</strong> <span class="role">\u2014 '+c.role+'</span></div>').join('')+(contacts.length>6?'<div style="font-size:11px;color:#6b7280">+'+(contacts.length-6)+' more</div>':'')+'</div>';}
let dateH='';if(p.closing_date)dateH='<div style="margin-top:8px"><div class="section-title">Important Dates</div><div style="font-size:12px;color:#d1d5db">Closing: '+p.closing_date+'</div></div>';
const actions=p.action_items||[];let actH='';if(actions.length){actH='<div style="margin-top:8px"><div class="section-title">Action Items</div>'+actions.slice(0,5).map(a=>'<div class="action">'+a+'</div>').join('')+(actions.length>5?'<div style="font-size:11px;color:#6b7280;padding-left:12px">+'+(actions.length-5)+' more</div>':'')+'</div>';}
const updates=p.recent_updates||[];let updH='';if(updates.length){updH='<div style="margin-top:8px"><div class="section-title">Recent Updates</div>'+updates.slice(0,4).map(u=>'<div class="update"><span class="date">'+(u.date||'')+' </span>'+u.subject+' <span class="src">('+u.source+')</span></div>').join('')+'</div>';}
return '<div class="card"><div class="card-header"><h2>'+p.address+'</h2><span class="badge" style="background:'+pc+'">'+phase+'</span></div><div style="margin-top:6px">'+sources+'</div>'+countdown+renderTimeline(phase)+'<div class="grid"><div>'+finH+conH+dateH+'</div><div>'+actH+updH+'</div></div></div>';}
async function init(){try{const r=await fetch('properties_data.json?t='+Date.now());const data=await r.json();document.getElementById('lastUpdated').textContent='Last updated: '+data.last_updated+' | Dashboard auto-refreshes twice daily';const props=data.properties;const active=props.filter(p=>!['Closed','Prospecting'].includes(p.current_milestone));const closing=props.filter(p=>['Closing','Final Walkthrough'].includes(p.current_milestone));const rehab=props.filter(p=>p.current_milestone==='Repairs / Rehab');const closed=props.filter(p=>p.current_milestone==='Closed');const prospect=props.filter(p=>p.current_milestone==='Prospecting');document.getElementById('stats').innerHTML='<div class="stat"><div class="num" style="color:#3b82f6">'+active.length+'</div><div class="label">Active</div></div><div class="stat"><div class="num" style="color:#ef4444">'+closing.length+'</div><div class="label">At Closing</div></div><div class="stat"><div class="num" style="color:#eab308">'+rehab.length+'</div><div class="label">In Rehab</div></div><div class="stat"><div class="num" style="color:#22c55e">'+closed.length+'</div><div class="label">Closed</div></div><div class="stat"><div class="num" style="color:#6b7280">'+prospect.length+'</div><div class="label">Prospecting</div></div><div class="stat"><div class="num" style="color:#f1f5f9">'+props.length+'</div><div class="label">Total</div></div>';const sorted=sortProps([...props]);document.getElementById('container').innerHTML=sorted.map(renderCard).join('');}catch(e){document.getElementById('container').innerHTML='<div class="loading">Error loading data: '+e.message+'</div>';}}
init();
</script>
</body>
</html>
